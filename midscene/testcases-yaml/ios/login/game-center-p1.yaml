# TC-GAME-001 | P1 | iOS 从首页进入游戏中心（More）
# 前提：App 已登录并停留在首页（登录通过后进入首页）

ios:
  wdaHost: "${WDA_HOST}"

agent:
  testId: "TC-GAME-001-IOS"
  groupName: "游戏中心模块 P1 (iOS)"
  generateReport: true
  reportFileName: "ios-game-center-p1-report"
  aiActContext: >
    本用例只做一步：从首页点击右上角显示为“More>”的入口（文字“More”加右尖括号/箭头，在一条可点区域上）进入游戏中心。
    只点“More>”这一整块可点热区，不要点其左侧/右侧紧挨的其它图标（如日历、通知等）。
    除了该“More>”区域以外，禁止点击任何其他区域、按钮、输入框或弹窗内容。
    若无法明确定位到“More>”，则不要乱点，直接失败。
    若出现弹窗/引导导致阻挡，不要尝试关闭或跳过（这些属于“点击其它位置”），直接失败。

tasks:
  - name: "P1 - 首页点击右上角 more 进入游戏中心"
    flow:
      # 给 App/首页元素加载一点时间
      - sleep: 1000

      # 点击右上角 “More>” 区域进入游戏中心
      - aiAct: >
          在屏幕右上角，只点击带“More>”字样的那一块可点区域一次（精确点到“More”文字或“More>”整体热区中心，不要偏到旁边图标）。
          若界面显示为“More >”或“More›”等同义样式，仍视为同一入口，只点该文字所在区域。
          不要点击除“More>”入口以外的任何位置（包括背景、标题栏、列表项、其他菜单或弹窗按钮）。
          明确排除：不要点击“More>”左侧或右侧的日历/日期/通知等其它图标。
          若无法确认可见的“More>”（或同义“More”+箭头）入口，则不要点击任何其它图标，直接失败。
      - sleep: 1000

      # 断言进入游戏中心页面
      - aiAssert: 当前页面为“游戏中心”页面，能够看到游戏列表/入口/标题“游戏中心”
        errorMessage: "TC-GAME-001 iOS 失败：未进入游戏中心"
