name: Deploy GitHub Pages Demo

on:
  push:
    branches: [yaahlan, main, master]
    paths:
      - 'platform/web_agent/**'
      - 'scripts/build-github-pages-demo.sh'
      - '.github/workflows/github-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-demo
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build static demo
        run: bash scripts/build-github-pages-demo.sh

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          commit_message: 'chore: deploy web agent demo'
