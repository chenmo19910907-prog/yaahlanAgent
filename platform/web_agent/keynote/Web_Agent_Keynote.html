  function countSteps(scene) {
    if (scene.type === 'center') {
      var n = 0;
      if (scene.label) n++;
      if (scene.titleLines && scene.titleLines.length) n += scene.titleLines.length;
      else if (scene.text) n++;
      if (scene.subtitle) n++;
      return Math.max(n, 1);
    }
    if (scene.type === 'feature') {
      if (scene.textOnly && scene.capabilities && scene.capabilities.length) {
        return 3;
      }
      return 3;
    }
    if (scene.type === 'radial' || scene.type === 'agent-map') return 1 + (scene.callouts || []).length;
    if (scene.type === 'agent-preview') return 2;
    if (scene.type !== 'lines') return 1;
    var n = 0;
    (scene.lines || []).forEach(function (raw) {
      if (raw.inline) n += raw.inline.length;
      else n += 1 + (raw.suffix ? 1 : 0);
    });
    return n;
  }

      '</div>';

  function renderCenter(s) {
    var isSplit = s.titleLines && s.titleLines.length;
    content.className = isSplit ? 'center-left' : 'center';
    content.innerHTML = '';
    var block = document.createElement('div');
    block.className = 'center-block' + (isSplit ? ' left' : '');
    content.appendChild(block);

    var items = [];
    var step = 0;

    function addTitleLine(line, isNext) {
      var h2 = document.createElement('h2');
      h2.className = 'center-title' + (isNext ? ' center-title-next' : '') + ' hide';
      h2.textContent = line;
      return h2;
    }

    if (s.label) {
      var stack = document.createElement('div');
      stack.className = 'center-title-stack';
      var labelEl = document.createElement('div');
      labelEl.className = 'scene-label center-chapter-label hide';
      labelEl.textContent = s.label;
      stack.appendChild(labelEl);
      items.push({ el: labelEl, step: step++ });
      if (isSplit) {
        s.titleLines.forEach(function (line, i) {
          var h2 = addTitleLine(line, i > 0);
          stack.appendChild(h2);
          items.push({ el: h2, step: step++ });
        });
      } else if (s.text) {
        stack.appendChild(addTitleLine(s.text, false));
        items.push({ el: stack.lastElementChild, step: step++ });
      }
      block.appendChild(stack);
    } else if (isSplit) {
      s.titleLines.forEach(function (line, i) {
        var h2 = addTitleLine(line, i > 0);
        block.appendChild(h2);
        items.push({ el: h2, step: step++ });
      });
    } else if (s.text) {
      block.appendChild(addTitleLine(s.text, false));
      items.push({ el: block.lastElementChild, step: step++ });
    }

    if (s.subtitle) {
      var sub = document.createElement('p');
      sub.className = 'center-sub hide';
      sub.textContent = s.subtitle;
      block.appendChild(sub);
      items.push({ el: sub, step: step++ });
    }

    var animateStep = -1;
    if (sceneIdx !== lastSceneIdx) { if (stepIdx >= 0) animateStep = stepIdx; }
    else if (stepIdx > lastStepIdx) animateStep = stepIdx;
    applyStepVisibility(items, animateStep);
    lastSceneIdx = sceneIdx;
    lastStepIdx = stepIdx;
  }

        carousel.classList.add('is-fading');
        demoTimeout(function () {
          apply();
          carousel.classList.remove('is-fading');
        }, 200);
      } else {
        apply();
      }
    }

    function cycle() {
      applySlide(idx + 1, true);
      newChatTimer = demoTimeout(cycle, rotateMs);
    }

    applySlide(0, false);
    if (demos.length > 1) newChatTimer = demoTimeout(cycle, rotateMs);
  }

  function buildUsageChartSvg(days, optDate) {
    var pad = { l: 52, r: 48, t: 28, b: 42 };
    var w = 960;
    var h = 360;
    var plotW = w - pad.l - pad.r;
    var plotH = h - pad.t - pad.b;
    var maxReq = Math.max(240, Math.ceil(Math.max.apply(null, days.map(function (d) { return d.requests || 0; })) / 40) * 40);
    var maxUsers = Math.max(8, Math.ceil(Math.max.apply(null, days.map(function (d) { return d.users || 0; }))));
    var n = days.length;
    function xAt(i) { return pad.l + (n <= 1 ? 0 : (i / (n - 1)) * plotW); }
    function yReq(v) { return pad.t + plotH - (Math.min(v, maxReq) / maxReq) * plotH; }
    function yUser(v) { return pad.t + plotH - (Math.min(v, maxUsers) / maxUsers) * plotH; }
    function pathFor(key, yFn) {
      var d = '';
      days.forEach(function (day, i) {
        var px = xAt(i);
        var py = yFn(day[key]);
        d += (d ? ' L ' : 'M ') + px.toFixed(1) + ' ' + py.toFixed(1);
      });
      return d;
    }
    var optIdx = -1;
    days.forEach(function (day, i) { if (day.date === optDate) optIdx = i; });
    var parts = [];
    parts.push('<defs><linearGradient id="usageReqFill" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="#5B8CFF" stop-opacity="0.22"/>' +
      '<stop offset="100%" stop-color="#5B8CFF" stop-opacity="0"/></linearGradient></defs>');
    parts.push('<line class="grid-line" x1="' + pad.l + '" y1="' + (pad.t + plotH) + '" x2="' + (w - pad.r) + '" y2="' + (pad.t + plotH) + '"/>');
    [0.25, 0.5, 0.75, 1].forEach(function (ratio) {
      var y = pad.t + plotH * (1 - ratio);
      parts.push('<line class="grid-line" x1="' + pad.l + '" y1="' + y + '" x2="' + (w - pad.r) + '" y2="' + y + '"/>');
    });
    days.forEach(function (day, i) {
      parts.push('<text class="axis-label" x="' + xAt(i).toFixed(1) + '" y="' + (h - 12) + '" text-anchor="middle">' + day.label + '</text>');
    });
    parts.push('<text class="axis-label" x="' + (pad.l - 10) + '" y="' + (pad.t + 6) + '" text-anchor="end">' + maxReq + '</text>');
    parts.push('<text class="axis-label" x="' + (pad.l - 10) + '" y="' + (pad.t + plotH) + '" text-anchor="end">0</text>');
    parts.push('<text class="axis-label" x="' + (w - pad.r + 10) + '" y="' + (pad.t + 6) + '" text-anchor="start">' + maxUsers + '人</text>');
    parts.push('<text class="axis-label" x="' + (w - pad.r + 10) + '" y="' + (pad.t + plotH) + '" text-anchor="start">0</text>');
    if (optIdx >= 0) {
      var ox = xAt(optIdx);
      parts.push('<line class="opt-line mock-usage-opt-line" x1="' + ox.toFixed(1) + '" y1="' + pad.t + '" x2="' + ox.toFixed(1) + '" y2="' + (pad.t + plotH) + '"/>');
      parts.push('<text class="opt-label mock-usage-opt-label" x="' + (ox + 8).toFixed(1) + '" y="' + (pad.t + 14) + '">' + days[optIdx].label + ' 优化</text>');
    }
    var reqPath = pathFor('requests', yReq);
    var userPath = pathFor('users', yUser);
    var areaPath = reqPath + ' L ' + xAt(n - 1).toFixed(1) + ' ' + (pad.t + plotH) +
      ' L ' + xAt(0).toFixed(1) + ' ' + (pad.t + plotH) + ' Z';
    parts.push('<path class="area-req" d="' + areaPath + '"/>');
    parts.push('<path class="line-req mock-usage-line-req" d="' + reqPath + '" pathLength="1000"/>');
    parts.push('<path class="line-users mock-usage-line-users" d="' + userPath + '" pathLength="1000"/>');
    days.forEach(function (day, i) {
      if (!day.requests && !day.users) return;
      if (day.requests) parts.push('<circle class="dot-req" cx="' + xAt(i).toFixed(1) + '" cy="' + yReq(day.requests).toFixed(1) + '" r="3.2"/>');
      if (day.users) parts.push('<circle class="dot-users" cx="' + xAt(i).toFixed(1) + '" cy="' + yUser(day.users).toFixed(1) + '" r="2.8"/>');
    });
    return parts.join('');
  }

  function startMotionDemo(demo) {
    stopMotionDemo(demo);
    var panes = {
      empty: demo.querySelector('.mock-motion-empty'),

    var inputWrap = demo.querySelector('.mock-motion-input-wrap');

    var sessionItems = demo.querySelectorAll('.mock-motion-session-item');
    if (!panes.empty || !panes.msgs || !panes.catalog || !panes.input || !panes.sessions) return;

    var phases = [
      { label: '新对话 · 空态渐入', duration: 2800, pane: 'empty' },
      { label: '消息 · 轻量上浮', duration: 3000, pane: 'msgs' },

      { label: '输入框 · 光效随输入亮起', duration: 3800, pane: 'input' },
      { label: '历史会话 · 滑过轻跃而出', duration: 3600, pane: 'sessions' }
    ];
    var idx = 0;

    function activatePane(name) {
      Object.keys(panes).forEach(function (key) {
        if (panes[key]) panes[key].classList.toggle('is-active', key === name);
      });
    }

    function resetView() {
      Object.keys(panes).forEach(function (key) {
        if (panes[key]) panes[key].classList.remove('is-active');
      });
      panes.empty.classList.remove('is-out', 'is-enter');
      void panes.empty.offsetWidth;
      panes.msgs.classList.remove('is-visible');
      if (userMsg) userMsg.classList.remove('is-rise');
      if (botMsg) botMsg.classList.remove('is-rise');
      panes.catalog.classList.remove('is-open');
      if (inputWrap) inputWrap.classList.remove('has-content', 'is-focus');
      if (inputText) inputText.textContent = '';
      sessionItems.forEach(function (el) { el.classList.remove('is-hover'); });
    }

    function runInputPhase() {
      var fullText = '查用户 100465989 详情';
      var charIdx = 0;
      function typeChar() {
        if (!inputText || !inputWrap) return;
        if (charIdx < fullText.length) {
          inputText.textContent = fullText.slice(0, charIdx + 1);
          charIdx += 1;
          if (charIdx === 1) inputWrap.classList.add('has-content');
          scheduleMotion(typeChar, 85);
        } else {
          inputWrap.classList.add('is-focus');
        }
      }
      scheduleMotion(typeChar, 350);
    }

    function runSessionsPhase() {
      var order = [0, 1, 2, 1, 0, 2, 1];
      var step = 0;
      function cycleHover() {
        sessionItems.forEach(function (el, i) {
          el.classList.toggle('is-hover', i === order[step % order.length]);
        });
        step += 1;
        scheduleMotion(cycleHover, 620);
      }
      scheduleMotion(cycleHover, 280);
    }

    function applyPhase() {
      clearMotionTimers();
      resetView();
      var current = idx;
      var phase = phases[current];
      if (caption) caption.textContent = phase.label;
      activatePane(phase.pane);

      if (current === 0) {
        panes.empty.classList.add('is-enter');
      } else if (current === 1) {
        panes.msgs.classList.add('is-visible');
        if (userMsg) userMsg.classList.add('is-rise');
        scheduleMotion(function () {
          if (botMsg) botMsg.classList.add('is-rise');
        }, 420);
      } else if (current === 2) {
        panes.msgs.classList.add('is-visible');
        if (userMsg) userMsg.classList.add('is-rise');
        if (botMsg) botMsg.classList.add('is-rise');
        panes.msgs.classList.add('is-active');
        panes.catalog.classList.add('is-active');
        panes.catalog.classList.add('is-open');
      } else if (current === 3) {
        runInputPhase();
      } else if (current === 4) {
        runSessionsPhase();
      }

      idx = (idx + 1) % phases.length;
      scheduleMotion(applyPhase, phase.duration);
    }

    applyPhase();
  }

  function applyStepVisibility(items, animateStep) {
    items.forEach(function (item) {
      if (item.step < stepIdx) item.el.classList.remove('hide');

        else item.el.classList.remove('hide');
      } else item.el.classList.add('hide');
    });
    if (animateStep === stepIdx) {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          items.forEach(function (item) {
            if (item.step === stepIdx) item.el.classList.remove('hide');
          });
        });
      });
    }
  }

  function renderRadial(s) {
    content.className = 'radial';
    var callouts = s.callouts || [];
    var angles = [-90, -30, 30, 90, 150, 210];
    var radiusX = 42;
    var radiusY = 36;

    content.innerHTML =
      '<div class="radial-title">' + esc(s.title) + '</div>' +
      '<div class="radial-stage">' +
        '<svg class="radial-svg" id="radial-svg"></svg>' +
        '<div class="radial-center" id="radial-center">' +
          '<div class="feat-demo">' + radialCenterHtml() + '</div>' +
        '</div>' +
      '</div>';

    var stage = content.querySelector('.radial-stage');
    callouts.forEach(function (c, i) {
      var angle = angles[i % angles.length] * Math.PI / 180;
      var cx = 50 + radiusX * Math.cos(angle);
      var cy = 50 + radiusY * Math.sin(angle);
      var node = document.createElement('div');
      node.className = 'radial-callout hide';
      node.style.left = cx + '%';
      node.style.top = cy + '%';
      node.style.transform = 'translate(-50%, -50%)';
      node.innerHTML = '<div class="radial-callout-label">' + esc(c.label) + '</div>' +
        (c.detail ? '<div class="radial-callout-detail">' + esc(c.detail) + '</div>' : '');
      node.dataset.idx = String(i);
      stage.appendChild(node);
    });

    var svg = document.getElementById('radial-svg');
    var centerEl = document.getElementById('radial-center');
    var calloutEls = content.querySelectorAll('.radial-callout');
    var titleEl = content.querySelector('.radial-title');

    function layoutLines() {
      if (!svg || !centerEl || !stage) return;
      var stageRect = stage.getBoundingClientRect();
      var centerRect = centerEl.getBoundingClientRect();
      var cx = centerRect.left + centerRect.width / 2 - stageRect.left;
      var cy = centerRect.top + centerRect.height / 2 - stageRect.top;
      svg.innerHTML = '';
      callouts.forEach(function (_, i) {
        var angle = angles[i % angles.length] * Math.PI / 180;
        var tx = stageRect.width * (50 + radiusX * Math.cos(angle)) / 100;
        var ty = stageRect.height * (50 + radiusY * Math.sin(angle)) / 100;
        var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', cx);
        line.setAttribute('y1', cy);
        line.setAttribute('x2', tx);
        line.setAttribute('y2', ty);
        line.setAttribute('class', 'radial-line' + (stepIdx >= i + 1 ? ' show' : ''));
        svg.appendChild(line);
      });
    }

    var items = [{ el: titleEl, step: 0 }, { el: centerEl, step: 0 }];
    calloutEls.forEach(function (el, i) { items.push({ el: el, step: i + 1 }); });

    var animateStep = -1;
    if (sceneIdx !== lastSceneIdx) { if (stepIdx >= 0) animateStep = stepIdx; }
    else if (stepIdx > lastStepIdx) animateStep = stepIdx;
    applyStepVisibility(items, animateStep);

    requestAnimationFrame(layoutLines);
    window.addEventListener('resize', layoutLines);

    lastSceneIdx = sceneIdx;
    lastStepIdx = stepIdx;
  }

  function renderLines(s) {
    if (s.variant === 'evolution') {
      renderLinesEvolution(s);
      return;
    }
    content.className = s.align === 'center' ? 'center' : 'left';
    var html = (s.label ? '<div class="scene-label">' + esc(s.label) + '</div>' : '') + '<div id="lines"></div>';
    content.innerHTML = html;
    var box = document.getElementById('lines');
    var steps = [];
    var nextStepNum = 0;

    (s.lines || []).forEach(function (raw, idx, arr) {
      if (raw.inline) {
        var row = document.createElement('div');
        row.className = 'row' + (raw.accent ? ' is-accent' : '');
        var baseStep = nextStepNum;
        raw.inline.forEach(function (w, i) {
          var sn = baseStep + i;
          if (i > 0 && raw.separator) {
            var sp = document.createElement('span');
            sp.className = 'sep hide';
            sp.textContent = '·';
            row.appendChild(sp);
            steps.push({ el: sp, step: sn });
          }
          var el = document.createElement('span');
          el.className = 'line big hide' + (raw.accent ? ' accent' : '');
          el.textContent = w;
          row.appendChild(el);
          steps.push({ el: el, step: sn });
        });
        nextStepNum += raw.inline.length;
        box.appendChild(row);
        return;
      }

      var prev = idx > 0 ? arr[idx - 1] : null;
      var prev2 = idx > 1 ? arr[idx - 2] : null;
      if (raw.bridge && prev && prev.lead && !prev.bridge && !prev.inline) {
        return;
      }
      if (raw.dim && prev && prev.lead && !prev.inline && !prev.bridge) {
        return;
      }
      if (raw.leadLg && prev && prev.dim && prev2 && prev2.lead && !raw.inline && !raw.bridge) {
        return;
      }

      var block = null;
      var next = arr[idx + 1];
      if (raw.lead && next && next.bridge && !next.inline) {
        block = document.createElement('div');
        block.className = 'lines-bridge-block';
        box.appendChild(block);
      } else if (raw.lead && next && next.dim && !next.inline && !next.bridge) {
        block = document.createElement('div');
        block.className = 'lines-stack-block';
        box.appendChild(block);
      }

      var host = block || box;
      var row = document.createElement('div');
      row.className = 'row' + (block && next && next.bridge ? ' lines-bridge-head-row' : '');
      var sn = nextStepNum;
      var main = document.createElement('span');
      var cls = 'line hide';
      if (raw.lead) cls += ' lead';
      if (raw.leadLg) cls += ' lead-lg';
      if (raw.bridge) cls += ' bridge';
      if (raw.en) cls += ' en text-en';
      if (raw.dim) cls += ' dim';
      if (raw.small) cls += ' small';
      main.className = cls;
      main.textContent = raw.text || raw;
      row.appendChild(main);
      steps.push({ el: main, step: sn });
      nextStepNum++;
      if (raw.suffix) {
        var suf = document.createElement('span');
        suf.className = 'line suffix hide';
        suf.textContent = raw.suffix.text;
        row.appendChild(suf);
        steps.push({ el: suf, step: sn + 1 });
        nextStepNum++;
      }
      host.appendChild(row);

      if (block && next && next.bridge) {
        var bridgeSn = nextStepNum;
        var bridgeMain = document.createElement('span');
        bridgeMain.className = 'line bridge hide';
        bridgeMain.textContent = next.text || next;
        row.appendChild(bridgeMain);
        steps.push({ el: bridgeMain, step: bridgeSn });
        nextStepNum++;
      } else if (block && next && next.dim) {
        var dimSn = nextStepNum;
        var dimRow = document.createElement('div');
        dimRow.className = 'row lines-stack-dim-row';
        var dimMain = document.createElement('span');
        dimMain.className = 'line dim hide';
        dimMain.textContent = next.text || next;
        dimRow.appendChild(dimMain);
        block.appendChild(dimRow);
        steps.push({ el: dimMain, step: dimSn });
        nextStepNum++;
        var afterDim = arr[idx + 2];
        if (afterDim && afterDim.leadLg && !afterDim.inline && !afterDim.bridge) {
          var lgSn = nextStepNum;
          var lgRow = document.createElement('div');
          lgRow.className = 'row';
          var lgMain = document.createElement('span');
          lgMain.className = 'line lead-lg hide';
          lgMain.textContent = afterDim.text || afterDim;
          lgRow.appendChild(lgMain);
          block.appendChild(lgRow);
          steps.push({ el: lgMain, step: lgSn });
          nextStepNum++;
        }
      }
    });

    var animateStep = -1;
    if (sceneIdx !== lastSceneIdx) { if (stepIdx >= 0) animateStep = stepIdx; }
    else if (stepIdx > lastStepIdx) animateStep = stepIdx;
    applyStepVisibility(steps, animateStep);
    lastSceneIdx = sceneIdx;
    lastStepIdx = stepIdx;
  }

  function applyHashPage() {
    var m = String(location.hash || '').match(/^#(?:p|page)?(\d+)$/i);
    if (!m) return;
    var page = parseInt(m[1], 10);
    if (page >= 1 && page <= SCENES.length) {
      sceneIdx = page - 1;
      stepIdx = 0;
    }
  }

  function isStepScene(s) {
    return s.type === 'lines' || s.type === 'center' || s.type === 'feature' || s.type === 'radial' || s.type === 'agent-map' || s.type === 'agent-preview';
  }

  function layoutContentScale() {
    if (!contentScale || !content) return;
    if (EMBED_DEMO) {
      contentScale.style.transform = 'none';
      contentScale.style.width = '100%';
      contentScale.style.height = '100%';
      return;
    }
    var s = SCENES[sceneIdx];
    var stageEl = document.getElementById('stage');
    if (!stageEl) return;
    var padX = 28;
    var padY = 72;
    var availW = Math.max(320, stageEl.clientWidth - padX * 2);
    var availH = Math.max(240, stageEl.clientHeight - padY * 2);
    if (s && (s.type === 'radial' || s.type === 'agent-map' || s.type === 'agent-preview')) {
      contentScale.style.transform = 'none';
      contentScale.style.width = availW + 'px';
      contentScale.style.height = availH + 'px';
      return;
    }
    contentScale.style.width = '';
    contentScale.style.height = '';
    contentScale.style.transform = 'scale(1)';
    var cw = content.offsetWidth;
    var ch = content.offsetHeight;
    if (cw < 1 || ch < 1) return;
    var scale = Math.min(availW / cw, availH / ch);
    scale = Math.min(Math.max(scale, 1), 1.42);
    contentScale.style.transform = 'scale(' + scale.toFixed(3) + ')';
  }

  function scheduleContentScale() {
    requestAnimationFrame(function () {
      requestAnimationFrame(layoutContentScale);
    });
  }

  function render() {
    stopWaitingDemo(document.getElementById('feat-demo'));
    stopThemeDemo(document.getElementById('feat-demo'));
    stopSidebarDemo(document.getElementById('feat-demo'));
    stopMotionDemo(document.getElementById('feat-demo'));
    stopDingtalkSyncDemo(document.getElementById('feat-demo'));
    stopSessionIsolationDemo(document.getElementById('feat-demo'));
    stopSessionPinDemo(document.getElementById('feat-demo'));
    stopCatalogOnboardDemo(document.getElementById('feat-demo'));
    stopReplyModeDemo(document.getElementById('feat-demo'));
    stopStreamOutputDemo(document.getElementById('feat-demo'));
    stopExternalAgentDemo(document.getElementById('feat-demo'));
    stopAgentPreviewDemo(document.querySelector('.mock-ap'));
    var s = SCENES[sceneIdx];
    if (!s) return;
    if (s.type === 'hero') { stepIdx = 0; renderHero(s); }
    else if (s.type === 'center') {
      if (stepIdx < 0) stepIdx = 0;
      renderCenter(s);
    }
    else if (s.type === 'feature') {
      if (stepIdx < 0) stepIdx = 0;
      renderFeature(s);
    } else if (s.type === 'radial') {
      if (stepIdx < 0) stepIdx = 0;
      renderRadial(s);
    } else if (s.type === 'agent-map') {
      if (stepIdx < 0) stepIdx = 0;
      renderAgentMap(s);
    } else if (s.type === 'agent-preview') {
      if (stepIdx < 0) stepIdx = 0;
      renderAgentPreview(s);
    } else {
      if (stepIdx < 0) stepIdx = 0;
      renderLines(s);
    }
    var total = SCENES.length;
    if (isStepScene(s)) {
      progress.textContent = (sceneIdx + 1) + ' / ' + total + ' · ' + (stepIdx + 1) + ' / ' + countSteps(s);
    } else {
      progress.textContent = (sceneIdx + 1) + ' / ' + total;
    }
    dots.innerHTML = SCENES.map(function (_, i) {
      return '<span class="dot' + (i === sceneIdx ? ' on' : '') + '"></span>';
    }).join('');
    renderNav();
    scheduleContentScale();
    scheduleContentSteps();
  }

  function nextStep() {
    var s = SCENES[sceneIdx];
    if (!isStepScene(s)) return false;
    if (stepIdx < countSteps(s) - 1) { stepIdx++; render(); return true; }
    return false;
  }

  function prevStep() {
    var s = SCENES[sceneIdx];
    if (!isStepScene(s)) return false;
    if (stepIdx > 0) { stepIdx--; render(); return true; }
    return false;
  }

  function nextPage() {
    if (sceneIdx >= SCENES.length - 1) return;
    sceneIdx++;
    stepIdx = -1;
    render();
  }

  function prevPage() {
    if (sceneIdx <= 0) return;
    sceneIdx--;
    var s = SCENES[sceneIdx];
    stepIdx = isStepScene(s) ? countSteps(s) - 1 : 0;
    render();
  }

  function forward() {
    var s = SCENES[sceneIdx];
    if (s.type === 'hero') { nextPage(); return; }
    if (!nextStep()) nextPage();
  }

  function forwardPage() {
    nextPage();
  }

  function backward() {
    var s = SCENES[sceneIdx];
    if (s.type === 'hero') { prevPage(); return; }
    if (!prevStep()) prevPage();
  }

  function onKey(e) {
    var k = e.key;
    if (k === ' ' || k === 'ArrowRight' || k === 'Enter') { e.preventDefault(); forward(); }
    else if (k === 'ArrowLeft' || k === 'Backspace') { e.preventDefault(); backward(); }
    else if (k === 'ArrowDown') { e.preventDefault(); nextPage(); }
    else if (k === 'ArrowUp') { e.preventDefault(); prevPage(); }
    else if (k === 'f' || k === 'F') {
      e.preventDefault();
      toggleFullscreen();
    }
  }

  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  function toggleFullscreen() {
    if (!isFullscreen()) {
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (!req) return;
      Promise.resolve(req.call(el)).then(syncFullscreenLayout).catch(function () {});
    } else {
      var exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (!exit) return;
      Promise.resolve(exit.call(document)).then(syncFullscreenLayout).catch(function () {});
    }
  }

  function syncNavLayout() {
    var open = navOpen && !isFullscreen() &&
      !document.body.classList.contains('kn-cinema') &&
      !document.body.classList.contains('kn-embed');
    document.body.classList.toggle('kn-nav-open', open);
    document.body.classList.toggle('kn-nav-collapsed', !open);
    if (navTitle) navTitle.setAttribute('aria-expanded', open ? 'true' : 'false');
    scheduleContentScale();
  }

  function syncFullscreenLayout() {
    document.body.classList.toggle('kn-fullscreen', isFullscreen());
    if (isFullscreen()) navOpen = false;
    syncNavLayout();
  }

  if (navTitle) {
    navTitle.addEventListener('click', function (e) {
      e.stopPropagation();
      if (isFullscreen() || document.body.classList.contains('kn-cinema') ||
          document.body.classList.contains('kn-embed')) return;
      navOpen = !navOpen;
      syncNavLayout();
    });
  }
  if (navList) {
    navList.addEventListener('click', function (e) {
      var btn = e.target.closest('.kn-nav-item');
      if (!btn) return;
      e.stopPropagation();
      goToPage(btn.getAttribute('data-idx'));
    });
  }
  document.addEventListener('click', function (e) {
    if (!navOpen || isFullscreen()) return;
    var nav = document.getElementById('kn-nav');
    if (nav && !nav.contains(e.target)) {
      navOpen = false;
      syncNavLayout();
    }
  });
  document.addEventListener('fullscreenchange', syncFullscreenLayout);
  document.addEventListener('webkitfullscreenchange', syncFullscreenLayout);

  document.getElementById('stage').addEventListener('click', function (e) {
    if (e.clientX > window.innerWidth / 2) forward();
    else backward();
  });
  window.addEventListener('keydown', onKey);
  window.addEventListener('resize', scheduleContentScale);
  window.addEventListener('hashchange', function () {
    applyHashPage();
    render();
  });
  var AUTOPLAY = /(?:^|[?&])autoplay=1(?:&|$)/.test(location.search);
  var CINEMA = AUTOPLAY || /(?:^|[?&])cinema=1(?:&|$)/.test(location.search);
  var PROMO_FAST = /(?:^|[?&])fast=1(?:&|$)/.test(location.search);
  var PROMO_BPM = parseInt((location.search.match(/[?&]bpm=(\d+)/) || [])[1] || '128', 10);
  if (!PROMO_BPM || PROMO_BPM < 60 || PROMO_BPM > 200) PROMO_BPM = 128;
  var autoplayTimer = null;
  var beatTimer = null;
  var DEMO_HOLD_MS = {
    'reply-mode': 14000,
    'stream-output': 15000,
    'external-agent': 12000,
    'anniversary-egg-workflow': 26000,
    'pk-atm-workflow': 21000,
    'moa-record': 14000,
    'service-agent-moa': 16000,
    'registry-sync': 12000,
    'usage-growth': 14000,
    'task-progress': 12000,
    'run-recovery': 13000,
    'file-attach-export': 12000,
    'dingtalk-auth': 14000,
    'session-isolation': 14000,
    'dingtalk-push': 12000,
    'session-rename': 12000,
    'global-search': 12000,
    'catalog-onboard': 12000,
    'bookmarks-jump': 12000,
    'message-share': 12000,
    'new-chat': 12000
  };

  function beatMs() { return Math.round(60000 / PROMO_BPM); }

  function pulseBeat() {
    if (!CINEMA) return;
    var el = document.getElementById('kn-beat-flash');
    if (!el) return;
    el.classList.add('is-pulse');
    setTimeout(function () { el.classList.remove('is-pulse'); }, Math.min(beatMs() * 0.35, 120));
  }

  function demoHoldMs(scene) {
    if (!scene || !scene.demo) return beatMs() * 14;
    return DEMO_HOLD_MS[scene.demo] || beatMs() * 14;
  }

  function autoplayDelayMs() {
    var s = SCENES[sceneIdx];
    var b = beatMs();
    function div(x) { return PROMO_FAST ? Math.max(Math.round(x / 1.8), b * 2) : x; }
    if (s.type === 'hero') return div(b * 10);
    if (s.type === 'center') return div(b * 8);
    if (s.type === 'lines') return div(b * 3);
    if (s.type === 'feature') {
      if (s.textOnly && s.capabilities && s.capabilities.length) {
        if (stepIdx <= 1) return div(b * 4);
        return div(b * 2);
      }
      if (stepIdx <= 0) return div(b * 5);
      if (stepIdx === 1) return div(b * 4);
      return div(demoHoldMs(s));
    }
    return div(b * 4);
  }

  function isAutoplayFinished() {
    if (sceneIdx < SCENES.length - 1) return false;
    var s = SCENES[sceneIdx];
    if (isStepScene(s)) return stepIdx >= countSteps(s) - 1;
    return true;
  }

  function scheduleAutoplay() {
    if (!AUTOPLAY) return;
    if (autoplayTimer) clearTimeout(autoplayTimer);
    if (isAutoplayFinished()) {
      document.body.classList.add('kn-finished');
      document.body.dataset.promoFinished = '1';
      return;
    }
    autoplayTimer = setTimeout(function () {
      pulseBeat();
      forward();
      scheduleAutoplay();
    }, autoplayDelayMs());
  }

  function initPromoMode() {
    if (CINEMA) document.body.classList.add('kn-cinema');
    if (!AUTOPLAY) return;
    document.body.classList.add('kn-autoplay');
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) {
      Promise.resolve(req.call(el)).then(syncFullscreenLayout).catch(function () {});
    }
    syncFullscreenLayout();
    if (beatTimer) clearInterval(beatTimer);
    beatTimer = setInterval(pulseBeat, beatMs());
    scheduleAutoplay();
  }

  document.body.focus();
  applyHashPage();
  render();
  syncNavLayout();
  initPromoMode();
  } catch (err) {
    showKeynoteError(err);
  }
})();
</script>
