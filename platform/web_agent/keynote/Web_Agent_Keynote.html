<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yaahlan 智能工具 Agent · Keynote</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; color: #fff;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { outline: none; }
  #stage {
    position: fixed; inset: 0; left: 196px;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse 70% 50% at 50% 42%, rgba(91,140,255,0.07) 0%, transparent 55%), #000;
    cursor: pointer;
  }
  #content-scale {
    transform-origin: center center;
    will-change: transform;
  }
  #content {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    max-width: 94vw; text-align: center; gap: 1.6rem;
  }
  #content.left { align-items: flex-start; text-align: left; width: min(88vw,920px); padding-left: clamp(2rem,8vw,6rem); transform: none; }
  #content.center { align-items: center; text-align: center; padding-left: 0; }
  #content.center-left { align-items: flex-start; text-align: left; width: min(88vw,920px); padding-left: clamp(2rem,8vw,6rem); transform: none; }
  #content.feature { flex-direction: row; align-items: center; justify-content: center; gap: clamp(2rem,5vw,4.5rem); width: min(95vw,1250px); max-width: 95vw; transform: none; text-align: left; }
  #content.feature-text-only {
    flex-direction: column; align-items: flex-start; justify-content: center;
    width: min(90vw, 1000px); gap: 0;
  }
  .feature-text-only .feat-text { flex: 1; max-width: 100%; width: 100%; }
  .feat-cap-list {
    list-style: none; margin: clamp(1.1rem, 2.8vh, 1.6rem) 0 0; padding: 0;
    display: flex; flex-direction: column; gap: clamp(8px, 1.4vh, 14px); width: 100%;
  }
  .feature-text-only .feat-cap-list.cols-2 {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: clamp(8px, 1.2vh, 12px);
  }
  @media (max-width: 820px) {
    .feature-text-only .feat-cap-list.cols-2 { grid-template-columns: 1fr; }
  }
  .feat-cap-item {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.45em 1.1em;
    padding: clamp(10px, 1.5vh, 14px) clamp(14px, 2vw, 20px);
    border-radius: 12px; background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(148, 163, 184, 0.12);
  }
  .feat-cap-name {
    font-size: clamp(1rem, 2.1vw, 1.22rem); font-weight: 650;
    color: rgba(255, 255, 255, 0.92); flex-shrink: 0; min-width: 4.8em;
  }
  .feat-cap-detail {
    font-size: clamp(0.82rem, 1.55vw, 0.94rem); color: rgba(168, 196, 255, 0.72);
    line-height: 1.45; flex: 1; min-width: 12em;
  }
  #content.radial { width: 100%; height: 100%; max-width: none; transform: none; position: relative; }
  .text-en { font-family: "Helvetica Neue", Arial, sans-serif; letter-spacing: 0.05em; }
  .hero { display: flex; flex-direction: column; align-items: center; gap: 1.2rem; width: 100%; }
  .hero-logo {
    width: clamp(96px, 16vw, 152px); height: clamp(96px, 16vw, 152px);
    display: flex; align-items: center; justify-content: center;
    overflow: visible;
    filter: drop-shadow(0 0 24px rgba(91,140,255,0.3));
  }
  .hero .hero-logo { animation: fadeUp 1.05s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .hero-logo svg {
    width: 100%; height: 100%; display: block;
    transform-origin: center center;
    animation: logo-heartbeat 1.15s ease-in-out infinite;
  }
  @keyframes logo-heartbeat {
    0%, 100% { transform: scale(1); }
    12% { transform: scale(1.08); }
    24% { transform: scale(1); }
    36% { transform: scale(1.05); }
    48%, 100% { transform: scale(1); }
  }
  .hero-brand { font-size: clamp(0.9rem,2.2vw,1.25rem); color: rgba(255,255,255,0.42); letter-spacing: 0.2em; animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both; }
  .hero-title { font-size: clamp(2.6rem,8vw,5rem); font-weight: 600; letter-spacing: 0.08em; line-height: 1.15; animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both; }
  .hero-title-en { font-size: clamp(2.2rem,6.5vw,4.2rem); font-weight: 500; color: rgba(255,255,255,0.9); margin-top: -0.2em; animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) 0.32s both; }
  .hero-sub { font-size: clamp(0.95rem,2.4vw,1.35rem); color: rgba(255,255,255,0.4); letter-spacing: 0.16em; animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) 0.44s both; }
  .scene-label { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.28em; color: rgba(91,140,255,0.55); margin-bottom: 1.5rem; animation: fadeUp 0.85s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .center-title-stack {
    display: inline-flex; flex-direction: column; align-items: flex-start;
    gap: clamp(0.45rem, 1.2vh, 0.75rem);
  }
  .center-chapter-label { margin-bottom: 0; }
  #lines { display: flex; flex-direction: column; gap: 1.6rem; width: 100%; }
  .line, .sep, .feat-block, .feat-demo-wrap, .radial-callout, .radial-title {
    transition: opacity 1s cubic-bezier(0.22, 1, 0.36, 1),
                transform 1s cubic-bezier(0.22, 1, 0.36, 1),
                filter 1s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .line {
    font-size: clamp(1.8rem,4.8vw,3.4rem); font-weight: 500; line-height: 1.3;
    opacity: 1; transform: none; filter: blur(0);
  }
  .line.hide, .sep.hide, .feat-block.hide, .feat-demo-wrap.hide, .radial-callout.hide, .radial-title.hide { opacity: 0; transform: translateY(28px); filter: blur(6px); pointer-events: none; }
  .line.lead { font-size: clamp(2.1rem,6vw,4.2rem); font-weight: 600; letter-spacing: 0.05em; }
  .line.lead.en { font-size: clamp(1.9rem,5.5vw,3.6rem); font-weight: 500; margin-top: -0.3em; color: rgba(255,255,255,0.88); }
  .line.dim { color: rgba(255,255,255,0.45); font-size: clamp(1.6rem,4.2vw,3rem); }
  .line.small { font-size: clamp(1.1rem,2.8vw,1.8rem); color: rgba(255,255,255,0.5); letter-spacing: 0.12em; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.08); }
  .row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 0.15em 0.5em; width: 100%; }
  .line.big { font-size: clamp(3.2rem,10vw,6.8rem); font-weight: 600; display: inline; width: auto; color: #fff; }
  .line.suffix { font-size: clamp(5rem,17vw,11rem); font-weight: 600; display: inline; width: auto; color: #5B8CFF; text-shadow: 0 0 60px rgba(91,140,255,0.35); }
  .sep { color: rgba(255,255,255,0.2); font-size: clamp(1.8rem,5vw,3rem); display: inline; }
  .center-title { font-size: clamp(3.2rem,11vw,6.8rem); font-weight: 600; letter-spacing: 0.06em; line-height: 1.12; animation: fadeUp 1.1s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .center-block { display: flex; flex-direction: column; align-items: center; gap: 0.08em; }
  .center-block.left { align-items: flex-start; }
  .center-title-next { animation-delay: 0.12s; }
  .center-sub { font-size: clamp(1rem,2.6vw,1.5rem); color: rgba(255,255,255,0.38); letter-spacing: 0.28em; margin-top: 0.5rem; animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) 0.24s both; }
  .center-block.left .center-sub { letter-spacing: 0.16em; }

  .feat-text { flex: 0 1 380px; min-width: 0; }
  .feat-title { font-size: clamp(1.8rem,4.2vw,2.8rem); font-weight: 600; line-height: 1.25; letter-spacing: 0.04em; }
  .feat-desc { margin-top: 1.2rem; font-size: clamp(0.95rem,1.8vw,1.15rem); color: rgba(255,255,255,0.52); line-height: 1.65; letter-spacing: 0.04em; }
  .feat-demo-wrap { flex: 1 1 520px; max-width: 620px; min-width: 280px; }
  .feat-demo {
    --demo-speed: 2;
    position: relative; border-radius: 16px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.1);
    background: linear-gradient(145deg, rgba(18,22,32,0.95), rgba(8,10,16,0.98));
    box-shadow: 0 24px 80px rgba(0,0,0,0.55), 0 0 0 1px rgba(91,140,255,0.06) inset;
    aspect-ratio: 16 / 10;
  }
  .feat-demo.is-live .mock-catalog { transform: translateX(0); opacity: 1; }
  .feat-demo.is-live .mock-cap-highlight { animation: capPulse 0.8s ease-in-out infinite; }
  .feat-demo.is-live .mock-pin { opacity: 1; transform: scale(1); }
  .feat-demo.is-live .mock-cursor { opacity: 1; animation: cursorPath 2.5s ease-in-out infinite; }
  .feat-demo.is-live .mock-cursor.is-burst { animation: none; }
  .feat-demo.is-live .mock-chat-waiting { background: rgba(91,140,255,0.03); }
  .feat-demo.is-live .mock-chat-waiting::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    border: 1px solid rgba(91,140,255,0.12); border-radius: 0;
  }
  .feat-demo.is-live .mock-filter { border-color: rgba(91,140,255,0.55); box-shadow: 0 0 0 3px rgba(91,140,255,0.12); }
  .feat-demo.is-live .mock-empty-logo svg { animation: logo-heartbeat 0.575s ease-in-out infinite; }
  .feat-demo.is-live .mock-swatch { opacity: 1; transform: scale(1); }
  .feat-demo.is-live .mock-qbtn.highlight { border-color: rgba(91,140,255,0.55); background: rgba(91,140,255,0.14); animation: capPulse 0.8s ease-in-out infinite; }
  .feat-demo:has(.mock-app-body) {
    background: transparent;
    box-shadow: 0 24px 80px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.08) inset;
  }

  .mock-empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; padding: 14px 16px; text-align: center; gap: 6px;
  }
  .mock-empty-logo {
    width: 36px; height: 36px; margin-bottom: 4px;
    filter: drop-shadow(0 0 12px rgba(91,140,255,0.35));
  }
  .mock-empty-logo svg { width: 100%; height: 100%; display: block; transform-origin: center; }
  .mock-empty-title { font-size: 0.72rem; font-weight: 600; color: rgba(255,255,255,0.92); letter-spacing: 0.04em; }
  .mock-empty-sub { font-size: 0.52rem; color: rgba(255,255,255,0.42); line-height: 1.45; max-width: 92%; }
  .mock-swatches { display: flex; gap: 6px; margin: 6px 0 4px; }
  .mock-swatch {
    display: flex; align-items: center; gap: 4px; padding: 3px 7px; border-radius: 6px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    font-size: 0.48rem; color: rgba(255,255,255,0.55); font-family: "Helvetica Neue", monospace;
    opacity: 0.4; transform: scale(0.92); transition: all 0.7s cubic-bezier(0.22,1,0.36,1);
  }
  .mock-swatch-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .mock-accent-line {
    width: 48px; height: 2px; border-radius: 1px; background: linear-gradient(90deg, transparent, #5B8CFF, transparent);
    opacity: 0; transform: scaleX(0.3); transition: all 0.8s cubic-bezier(0.22,1,0.36,1);
  }
  .mock-quick { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; width: 100%; margin-top: 4px; }
  .mock-qbtn {
    padding: 5px 6px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.55);
    font-size: 0.46rem; line-height: 1.35; text-align: left;
    transition: border-color 0.5s, background 0.5s;
  }

  .mock-app-body {
    display: flex; flex-direction: column; width: 100%;
    height: calc(100% - 33px); padding: 0;
  }
  .feat-demo:has(.mock-app-body) .mock-app-body { height: 100%; }
  .mock-app {
    flex: 1; width: 100%; min-width: 0;
    height: 100%; display: flex; flex-direction: column; overflow: hidden;
    transition: background 0.55s cubic-bezier(0.22, 1, 0.36, 1), color 0.55s;
  }
  .mock-app[data-theme="dark"] {
    --ma-bg: #0b0e14; --ma-header: rgba(13, 17, 25, 0.78);
    --ma-text: #f2f5fa; --ma-muted: #a4adbd; --ma-border: rgba(148, 163, 184, 0.18);
    --ma-accent: #5b8cff; --ma-accent-soft: rgba(91, 140, 255, 0.16);
    --ma-input-bg: rgba(20, 25, 35, 0.9); --ma-input-shadow: 0 18px 48px rgba(0,0,0,0.24);
    --ma-btn-bg: rgba(255,255,255,0.04); --ma-prompt-bg: rgba(20,24,33,0.72);
  }
  .mock-app[data-theme="light"] {
    --ma-bg: #eef2f8; --ma-header: rgba(255, 255, 255, 0.86);
    --ma-text: #0f172a; --ma-muted: #64748b; --ma-border: rgba(15, 23, 42, 0.1);
    --ma-accent: #3b6ff5; --ma-accent-soft: rgba(59, 111, 245, 0.12);
    --ma-input-bg: #ffffff; --ma-input-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
    --ma-btn-bg: rgba(15, 23, 42, 0.04); --ma-prompt-bg: #f8fafc;
  }
  .mock-app { background: var(--ma-bg); color: var(--ma-text); }
  .mock-app-header {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 7px 10px; border-bottom: 1px solid var(--ma-border);
    background: var(--ma-header); transition: background 0.55s, border-color 0.55s;
  }
  .mock-app-brand { display: flex; align-items: center; gap: 5px; min-width: 0; }
  .mock-app-brand-icon { width: 14px; height: 14px; flex-shrink: 0; }
  .mock-app-brand-icon svg { width: 100%; height: 100%; display: block; }
  .mock-app-brand-title {
    font-size: 0.56rem; font-weight: 650; color: var(--ma-text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color 0.55s;
  }
  .mock-app-header-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .mock-app-hbtn {
    padding: 3px 6px; border-radius: 6px; border: 1px solid var(--ma-border);
    background: var(--ma-btn-bg); color: var(--ma-muted); font-size: 0.48rem;
    transition: background 0.55s, border-color 0.55s, color 0.55s;
  }
  .mock-app-chat {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 10px 12px; min-height: 0;
    background: linear-gradient(180deg, transparent, rgba(91,140,255,0.03));
    transition: background 0.55s;
  }
  .mock-app[data-theme="light"] .mock-app-chat {
    background: linear-gradient(180deg, rgba(59,111,245,0.04), transparent);
  }
  .mock-app-empty { display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; }
  .mock-app-empty-logo {
    width: 28px; height: 28px;
    filter: drop-shadow(0 0 10px rgba(91,140,255,0.35));
  }
  .mock-app-empty-logo svg {
    width: 100%; height: 100%; display: block; transform-origin: center;
    animation: logo-heartbeat 0.575s ease-in-out infinite;
  }
  .mock-app-empty-title { font-size: 0.62rem; font-weight: 600; color: var(--ma-text); transition: color 0.55s; }
  .mock-app-empty-sub {
    font-size: 0.46rem; color: var(--ma-muted); max-width: 92%; line-height: 1.4;
    transition: color 0.55s;
  }
  .mock-app-input-area {
    padding: 8px 10px 10px; border-top: 1px solid var(--ma-border);
    background: var(--ma-bg); transition: background 0.55s, border-color 0.55s;
  }
  .mock-app-composer { position: relative; width: 100%; max-width: 88%; margin: 0 auto; padding-right: 44px; box-sizing: border-box; }
  .mock-app-input-wrap {
    min-height: 34px; display: flex; align-items: center;
    padding: 6px 10px 6px 14px; border-radius: 14px;
    border: 1px solid var(--ma-border); background: var(--ma-input-bg);
    box-shadow: var(--ma-input-shadow);
    transition: background 0.55s, border-color 0.55s, box-shadow 0.55s;
  }
  .mock-app-placeholder { font-size: 0.5rem; color: var(--ma-muted); transition: color 0.55s; }
  .mock-app-side-btn {
    position: absolute; left: calc(100% + 8px); top: 50%; transform: translateY(-50%);
    width: 28px; height: 28px; border-radius: 8px;
    border: 1px solid var(--ma-border); background: var(--ma-btn-bg);
    color: var(--ma-muted); display: flex; align-items: center; justify-content: center;
    transition: border-color 0.35s, color 0.35s, background 0.35s, box-shadow 0.35s, transform 0.35s;
  }
  .mock-app-side-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; }
  .mock-theme-quick-btn.is-light {
    color: #d97706; border-color: rgba(217, 119, 6, 0.28);
    background: rgba(251, 191, 36, 0.12);
  }
  .mock-theme-quick-btn.is-light .bulb-glass { fill: rgba(251, 191, 36, 0.35); }
  .mock-app[data-theme="light"] .mock-theme-quick-btn { background: rgba(15, 23, 42, 0.04); }
  .mock-theme-quick-btn.is-pulse {
    border-color: var(--ma-accent); color: var(--ma-accent);
    background: var(--ma-accent-soft); transform: translateY(calc(-50% - 1px));
    box-shadow: 0 0 0 3px rgba(91, 140, 255, 0.12);
  }
  .feat-demo.is-live .mock-app-empty-logo svg { animation: logo-heartbeat 0.575s ease-in-out infinite; }

  .mock-layout-body { display: flex; flex-direction: column; width: 100%; height: 100%; }
  .feat-demo:has(.mock-layout-body) { background: transparent; }
  .mock-layout {
    position: relative; flex: 1; width: 100%; min-height: 0;
    display: flex; background: #0b0e14; overflow: hidden;
  }
  .mock-layout-sidebar {
    width: 34%; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px;
    background: #151923; border-right: 1px solid rgba(148, 163, 184, 0.18);
    padding: 8px 7px; overflow: hidden;
    transition: width 320ms cubic-bezier(0.16, 1, 0.3, 1), opacity 260ms, padding 320ms, border-color 260ms;
  }
  .mock-layout.is-collapsed .mock-layout-sidebar {
    width: 0; opacity: 0; padding-left: 0; padding-right: 0; border-right-color: transparent;
  }
  .mock-layout-side-head {
    display: flex; align-items: center; justify-content: space-between; gap: 4px;
    padding-bottom: 4px; border-bottom: 1px solid rgba(148, 163, 184, 0.12);
  }
  .mock-layout-side-title { font-size: 0.58rem; font-weight: 650; color: rgba(242, 245, 250, 0.92); white-space: nowrap; }
  .mock-layout-side-new {
    font-size: 0.46rem; padding: 2px 5px; border-radius: 5px;
    border: 1px solid rgba(148, 163, 184, 0.18); color: rgba(164, 173, 189, 0.88); white-space: nowrap;
  }
  .mock-layout-side-tools {
    margin-top: auto; display: flex; flex-wrap: wrap; gap: 3px;
    padding-top: 6px; border-top: 1px solid rgba(148, 163, 184, 0.12);
  }
  .mock-layout-open-only { display: flex; }
  .mock-layout-collapsed-only { display: none !important; }
  .mock-layout.is-collapsed .mock-layout-open-only { display: none !important; }
  .mock-layout.is-collapsed .mock-layout-collapsed-only { display: inline-flex !important; }
  .mock-layout.is-collapsed .mock-layout-collapsed-only.mock-layout-header-actions,
  .mock-layout.is-collapsed .mock-layout-collapsed-only.mock-layout-brand { display: flex !important; }
  .mock-layout-filter {
    font-size: 0.48rem; padding: 4px 6px; border-radius: 6px;
    border: 1px solid rgba(148, 163, 184, 0.14); color: rgba(164, 173, 189, 0.72); white-space: nowrap;
  }
  .mock-layout-sessions { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .mock-layout-session {
    font-size: 0.5rem; padding: 5px 6px; border-radius: 6px; color: rgba(164, 173, 189, 0.72);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: background 0.35s, color 0.35s, border-color 0.35s;
  }
  .mock-layout-session.active {
    background: rgba(91, 140, 255, 0.14); color: rgba(242, 245, 250, 0.9);
    border: 1px solid rgba(91, 140, 255, 0.22);
  }
  .mock-layout-collapse {
    position: absolute; left: calc(34% - 9px); top: 50%; z-index: 3;
    transform: translateY(-50%); width: 16px; height: 30px; padding: 0;
    border-radius: 999px; border: 1px solid rgba(148, 163, 184, 0.22);
    background: rgba(20, 24, 33, 0.92); color: rgba(164, 173, 189, 0.85);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
    transition: left 320ms cubic-bezier(0.16, 1, 0.3, 1), opacity 220ms, border-color 0.35s, box-shadow 0.35s;
  }
  .mock-layout-collapse svg { width: 10px; height: 10px; }
  .mock-layout.is-collapsed .mock-layout-collapse { opacity: 0; pointer-events: none; }
  .mock-layout-main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
  .mock-layout-brand {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    padding: 7px 8px 4px; font-size: 0.52rem; font-weight: 650; color: rgba(242, 245, 250, 0.88);
    opacity: 0; max-height: 0; overflow: hidden;
    transition: opacity 280ms, max-height 320ms cubic-bezier(0.16, 1, 0.3, 1), padding 320ms;

  function startMotionDemo(demo) {
    stopMotionDemo(demo);

      empty: demo.querySelector('.mock-motion-empty'),
      msgs: demo.querySelector('.mock-motion-msgs'),
      catalog: demo.querySelector('.mock-motion-catalog'),
      input: demo.querySelector('.mock-motion-input-pane'),

    };
    var caption = demo.querySelector('.mock-motion-caption');

    var botMsg = demo.querySelector('.mock-motion-msg-bot');
    var inputWrap = demo.querySelector('.mock-motion-input-wrap');
    var inputText = demo.querySelector('.mock-motion-input-text');
    var sessionItems = demo.querySelectorAll('.mock-motion-session-item');
    if (!panes.empty || !panes.msgs || !panes.catalog || !panes.input || !panes.sessions) return;

    var phases = [
      { label: '新对话 · 空态渐入', duration: 2800, pane: 'empty' },
      { label: '消息 · 轻量上浮', duration: 3000, pane: 'msgs' },
      { label: '工具台 · 侧滑展开', duration: 2800, pane: 'catalog' },
      { label: '输入框 · 光效随输入亮起', duration: 3800, pane: 'input' },
      { label: '历史会话 · 滑过轻跃而出', duration: 3600, pane: 'sessions' }
    ];
    var idx = 0;

    function activatePane(name) {
      Object.keys(panes).forEach(function (key) {
        if (panes[key]) panes[key].classList.toggle('is-active', key === name);
      });
    }

    function resetView() {
      Object.keys(panes).forEach(function (key) {
        if (panes[key]) panes[key].classList.remove('is-active');
      });
      panes.empty.classList.remove('is-out', 'is-enter');
      void panes.empty.offsetWidth;
      panes.msgs.classList.remove('is-visible');
      if (userMsg) userMsg.classList.remove('is-rise');
      if (botMsg) botMsg.classList.remove('is-rise');
      panes.catalog.classList.remove('is-open');
      if (inputWrap) inputWrap.classList.remove('has-content', 'is-focus');
      if (inputText) inputText.textContent = '';
      sessionItems.forEach(function (el) { el.classList.remove('is-hover'); });
    }

    function runInputPhase() {
      var fullText = '查用户 100465989 详情';
      var charIdx = 0;
      function typeChar() {
        if (!inputText || !inputWrap) return;
        if (charIdx < fullText.length) {
          inputText.textContent = fullText.slice(0, charIdx + 1);
          charIdx += 1;
          if (charIdx === 1) inputWrap.classList.add('has-content');
          scheduleMotion(typeChar, 85);
        } else {
          inputWrap.classList.add('is-focus');
        }
      }
      scheduleMotion(typeChar, 350);
    }

    function runSessionsPhase() {
      var order = [0, 1, 2, 1, 0, 2, 1];
      var step = 0;
      function cycleHover() {
        sessionItems.forEach(function (el, i) {
          el.classList.toggle('is-hover', i === order[step % order.length]);
        });
        step += 1;
        scheduleMotion(cycleHover, 620);
      }
      scheduleMotion(cycleHover, 280);
    }

    function applyPhase() {
      clearMotionTimers();
      resetView();
      var current = idx;
      var phase = phases[current];
      if (caption) caption.textContent = phase.label;
      activatePane(phase.pane);

      if (current === 0) {
        panes.empty.classList.add('is-enter');
      } else if (current === 1) {
        panes.msgs.classList.add('is-visible');
        if (userMsg) userMsg.classList.add('is-rise');
        scheduleMotion(function () {
          if (botMsg) botMsg.classList.add('is-rise');
        }, 420);
      } else if (current === 2) {
        panes.msgs.classList.add('is-visible');
        if (userMsg) userMsg.classList.add('is-rise');
        if (botMsg) botMsg.classList.add('is-rise');
        panes.msgs.classList.add('is-active');
        panes.catalog.classList.add('is-active');
        panes.catalog.classList.add('is-open');
      } else if (current === 3) {
        runInputPhase();
      } else if (current === 4) {
        runSessionsPhase();
      }

      idx = (idx + 1) % phases.length;
      scheduleMotion(applyPhase, phase.duration);
    }

    applyPhase();
  }

  function applyStepVisibility(items, animateStep) {
    items.forEach(function (item) {
      if (item.step < stepIdx) item.el.classList.remove('hide');
      else if (item.step === stepIdx) {
        if (animateStep === stepIdx) item.el.classList.add('hide');
        else item.el.classList.remove('hide');
      } else item.el.classList.add('hide');
    });
    if (animateStep === stepIdx) {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          items.forEach(function (item) {
            if (item.step === stepIdx) item.el.classList.remove('hide');
          });
        });
      });
    }
  }

  function renderFeatureTextOnly(s) {
    content.className = 'feature feature-text-only';
    var caps = s.capabilities || [];
    var capHtml = caps.map(function (c) {
      return '<li class="feat-cap-item feat-block">' +
        '<span class="feat-cap-name">' + esc(c.name) + '</span>' +
        '<span class="feat-cap-detail">' + esc(c.detail) + '</span>' +
      '</li>';
    }).join('');
    content.innerHTML =
      '<div class="feat-text">' +
        (s.label ? '<div class="scene-label feat-block">' + esc(s.label) + '</div>' : '') +
        '<h2 class="feat-title feat-block">' + esc(s.title) + '</h2>' +
        '<p class="feat-desc feat-block">' + esc(s.desc) + '</p>' +
        (capHtml ? '<ul class="feat-cap-list' + (caps.length >= 6 ? ' cols-2' : '') + '">' + capHtml + '</ul>' : '') +
      '</div>';

    var items = [];
    if (s.label) {
      items.push(
        { el: content.querySelector('.scene-label'), step: 0 },
        { el: content.querySelector('.feat-title'), step: 0 }
      );
    } else {
      items.push({ el: content.querySelector('.feat-title'), step: 0 });
    }
    items.push({ el: content.querySelector('.feat-desc'), step: 1 });
    content.querySelectorAll('.feat-cap-item').forEach(function (el, i) {
      items.push({ el: el, step: 2 + i });
    });

    var animateStep = -1;
    if (sceneIdx !== lastSceneIdx) { if (stepIdx >= 0) animateStep = stepIdx; }
    else if (stepIdx > lastStepIdx) animateStep = stepIdx;
    applyStepVisibility(items, animateStep);

    lastSceneIdx = sceneIdx;
    lastStepIdx = stepIdx;
  }

  function renderFeature(s) {
    if (s.textOnly) {

      return;
    }
    content.className = 'feature';
    content.innerHTML =
      '<div class="feat-text">' +
        (s.label ? '<div class="scene-label feat-block">' + esc(s.label) + '</div>' : '') +
        '<h2 class="feat-title feat-block">' + esc(s.title) + '</h2>' +
        '<p class="feat-desc feat-block">' + esc(s.desc) + '</p>' +
      '</div>' +
      '<div class="feat-demo-wrap feat-block">' +
        '<div class="feat-demo" id="feat-demo">' + demoHtml(s.demo) + '</div>' +
      '</div>';

    var items;
    if (!s.label) {
      items = [
        { el: content.querySelector('.feat-title'), step: 0 },
        { el: content.querySelector('.feat-desc'), step: 1 },
        { el: content.querySelector('.feat-demo-wrap'), step: 2 }
      ];
    } else {
      items = [
        { el: content.querySelector('.scene-label'), step: 0 },
        { el: content.querySelector('.feat-title'), step: 0 },
        { el: content.querySelector('.feat-desc'), step: 1 },
        { el: content.querySelector('.feat-demo-wrap'), step: 2 }
      ];
    }

    var animateStep = -1;
    if (sceneIdx !== lastSceneIdx) { if (stepIdx >= 0) animateStep = stepIdx; }
    else if (stepIdx > lastStepIdx) animateStep = stepIdx;
    applyStepVisibility(items, animateStep);

    var demo = document.getElementById('feat-demo');
    if (demo) {
      demo.classList.toggle('is-live', stepIdx >= 2);
      if (s.demo === 'waiting' && stepIdx >= 2) startWaitingDemo(demo);
      else stopWaitingDemo(demo);
      if (s.demo === 'theme' && stepIdx >= 2) startThemeDemo(demo);
      else stopThemeDemo(demo);
      if (s.demo === 'sidebar' && stepIdx >= 2) startSidebarDemo(demo);
      else stopSidebarDemo(demo);
      if (s.demo === 'motion' && stepIdx >= 2) startMotionDemo(demo);
      else stopMotionDemo(demo);
      if (s.demo === 'dingtalk-sync' && stepIdx >= 2) startDingtalkSyncDemo(demo);
      else stopDingtalkSyncDemo(demo);
      if (s.demo === 'dingtalk-auth' && stepIdx >= 2) startDingtalkAuthDemo(demo);
      else stopDingtalkAuthDemo(demo);
      if (s.demo === 'session-isolation' && stepIdx >= 2) startSessionIsolationDemo(demo);
      else stopSessionIsolationDemo(demo);
      if (s.demo === 'session-pin' && stepIdx >= 2) startSessionPinDemo(demo);
      else stopSessionPinDemo(demo);
      if (s.demo === 'catalog-onboard' && stepIdx >= 2) startCatalogOnboardDemo(demo);
      else stopCatalogOnboardDemo(demo);
      if (s.demo === 'bookmarks-jump' && stepIdx >= 2) startBookmarksJumpDemo(demo);
      else stopBookmarksJumpDemo(demo);
      if (s.demo === 'file-attach-export' && stepIdx >= 2) startFileAttachExportDemo(demo);
      else stopFileAttachExportDemo(demo);
      if (s.demo === 'file-attach-export' && stepIdx >= 2) startFileAttachExportDemo(demo);
      else stopFileAttachExportDemo(demo);
      if (s.demo === 'cancel-restore' && stepIdx >= 2) startCancelRestoreDemo(demo);
      else stopCancelRestoreDemo(demo);
      if (s.demo === 'task-progress' && stepIdx >= 2) startTaskProgressDemo(demo);
      else stopTaskProgressDemo(demo);
      if (s.demo === 'workflow-combo' && stepIdx >= 2) startWorkflowComboDemo(demo);
      else stopWorkflowComboDemo(demo);
      if (s.demo === 'service-agent-moa' && stepIdx >= 2) startServiceAgentMoaDemo(demo);
      else stopServiceAgentMoaDemo(demo);
      if (s.demo === 'anniversary-egg-workflow' && stepIdx >= 2) startAnniversaryEggWorkflowDemo(demo);
      else stopAnniversaryEggWorkflowDemo(demo);
      if (s.demo === 'registry-sync' && stepIdx >= 2) startRegistrySyncDemo(demo);
      else stopRegistrySyncDemo(demo);
    }

    lastSceneIdx = sceneIdx;
    lastStepIdx = stepIdx;
  }

  function renderRadial(s) {
    content.className = 'radial';
    var callouts = s.callouts || [];
    var angles = [-90, -30, 30, 90, 150, 210];
    var radiusX = 42;
    var radiusY = 36;

    content.innerHTML =
      '<div class="radial-title">' + esc(s.title) + '</div>' +
      '<div class="radial-stage">' +
        '<svg class="radial-svg" id="radial-svg"></svg>' +
        '<div class="radial-center" id="radial-center">' +
          '<div class="feat-demo">' + radialCenterHtml() + '</div>' +
        '</div>' +
      '</div>';

    var stage = content.querySelector('.radial-stage');
    callouts.forEach(function (c, i) {
      var angle = angles[i % angles.length] * Math.PI / 180;
      var cx = 50 + radiusX * Math.cos(angle);
      var cy = 50 + radiusY * Math.sin(angle);
      var node = document.createElement('div');
      node.className = 'radial-callout hide';
      node.style.left = cx + '%';
      node.style.top = cy + '%';
      node.style.transform = 'translate(-50%, -50%)';
      node.innerHTML = '<div class="radial-callout-label">' + esc(c.label) + '</div>' +
        (c.detail ? '<div class="radial-callout-detail">' + esc(c.detail) + '</div>' : '');
      node.dataset.idx = String(i);
      stage.appendChild(node);
    });

    var svg = document.getElementById('radial-svg');
    var centerEl = document.getElementById('radial-center');
    var calloutEls = content.querySelectorAll('.radial-callout');
    var titleEl = content.querySelector('.radial-title');

    function layoutLines() {
      if (!svg || !centerEl || !stage) return;
      var stageRect = stage.getBoundingClientRect();
      var centerRect = centerEl.getBoundingClientRect();
      var cx = centerRect.left + centerRect.width / 2 - stageRect.left;
      var cy = centerRect.top + centerRect.height / 2 - stageRect.top;
      svg.innerHTML = '';
      callouts.forEach(function (_, i) {
        var angle = angles[i % angles.length] * Math.PI / 180;
        var tx = stageRect.width * (50 + radiusX * Math.cos(angle)) / 100;
        var ty = stageRect.height * (50 + radiusY * Math.sin(angle)) / 100;
        var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', cx);
        line.setAttribute('y1', cy);
        line.setAttribute('x2', tx);
        line.setAttribute('y2', ty);
        line.setAttribute('class', 'radial-line' + (stepIdx >= i + 1 ? ' show' : ''));
        svg.appendChild(line);
      });
    }

    var items = [{ el: titleEl, step: 0 }, { el: centerEl, step: 0 }];
    calloutEls.forEach(function (el, i) { items.push({ el: el, step: i + 1 }); });

    var animateStep = -1;
    if (sceneIdx !== lastSceneIdx) { if (stepIdx >= 0) animateStep = stepIdx; }
    else if (stepIdx > lastStepIdx) animateStep = stepIdx;
    applyStepVisibility(items, animateStep);

    requestAnimationFrame(layoutLines);
    window.addEventListener('resize', layoutLines);

    lastSceneIdx = sceneIdx;
    lastStepIdx = stepIdx;
  }

  function renderLines(s) {
    content.className = 'left';
    var html = (s.label ? '<div class="scene-label">' + esc(s.label) + '</div>' : '') + '<div id="lines"></div>';
    content.innerHTML = html;
    var box = document.getElementById('lines');
    var steps = [];
    var nextStepNum = 0;

    (s.lines || []).forEach(function (raw) {
      if (raw.inline) {
        var row = document.createElement('div');
        row.className = 'row';
        var baseStep = nextStepNum;
        raw.inline.forEach(function (w, i) {
          var sn = baseStep + i;
          if (i > 0 && raw.separator) {
            var sp = document.createElement('span');
            sp.className = 'sep hide';
            sp.textContent = '·';
            row.appendChild(sp);
            steps.push({ el: sp, step: sn });
          }
          var el = document.createElement('span');
          el.className = 'line big hide';
          el.textContent = w;
          row.appendChild(el);
          steps.push({ el: el, step: sn });
        });
        nextStepNum += raw.inline.length;
        box.appendChild(row);
        return;
      }
      var row = document.createElement('div');
      row.className = 'row';
      var sn = nextStepNum;
      var main = document.createElement('span');
      var cls = 'line hide';
      if (raw.lead) cls += ' lead';
      if (raw.en) cls += ' en text-en';
      if (raw.dim) cls += ' dim';
      if (raw.small) cls += ' small';
      main.className = cls;
      main.textContent = raw.text || raw;
      row.appendChild(main);
      steps.push({ el: main, step: sn });
      nextStepNum++;
      if (raw.suffix) {
        var suf = document.createElement('span');
        suf.className = 'line suffix hide';
        suf.textContent = raw.suffix.text;
        row.appendChild(suf);
        steps.push({ el: suf, step: sn + 1 });
        nextStepNum++;
      }
      box.appendChild(row);
    });

    var animateStep = -1;
    if (sceneIdx !== lastSceneIdx) { if (stepIdx >= 0) animateStep = stepIdx; }
    else if (stepIdx > lastStepIdx) animateStep = stepIdx;
    applyStepVisibility(steps, animateStep);
    lastSceneIdx = sceneIdx;
    lastStepIdx = stepIdx;
  }

  function sceneNavLabel(s, i) {
    if (s.type === 'hero') return '封面';
    if (s.type === 'feature') {
      var t = (s.title || '').trim();
      return (s.label ? s.label + ' · ' : '') + (t.length > 14 ? t.slice(0, 14) + '…' : t);
    }
    if (s.type === 'center') {
      if (s.titleLines && s.titleLines.length) {
        return (s.label ? s.label + ' · ' : '') + s.titleLines.join('');
      }
      return (s.label ? s.label + ' · ' : '') + ((s.text || '').trim() || ('第 ' + (i + 1) + ' 页'));
    }
    if (s.type === 'lines') {
      var first = (s.lines || [])[0];
      if (first && first.text) return (s.label ? s.label + ' · ' : '') + first.text;
      return s.label || ('第 ' + (i + 1) + ' 页');
    }
    if (s.type === 'radial') return (s.title || '总结页').trim();
    return '第 ' + (i + 1) + ' 页';
  }

  function renderNav() {
    if (!navList) return;
    navList.innerHTML = SCENES.map(function (s, i) {
      return '<li><button type="button" class="kn-nav-item' + (i === sceneIdx ? ' on' : '') +
        '" data-idx="' + i + '"><span class="kn-nav-num">' + (i + 1) +
        '</span><span class="kn-nav-label">' + esc(sceneNavLabel(s, i)) + '</span></button></li>';
    }).join('');
    var active = navList.querySelector('.kn-nav-item.on');
    if (active) active.scrollIntoView({ block: 'nearest' });
  }

  function goToPage(idx) {
    idx = Number(idx);
    if (idx < 0 || idx >= SCENES.length || idx === sceneIdx) return;
    sceneIdx = idx;
    var s = SCENES[sceneIdx];
    stepIdx = isStepScene(s) ? 0 : 0;
    render();
  }

  function isStepScene(s) {
    return s.type === 'lines' || s.type === 'feature' || s.type === 'radial';
  }

  function layoutContentScale() {
    if (!contentScale || !content) return;
    var s = SCENES[sceneIdx];
    if (s && s.type === 'radial') {
      contentScale.style.transform = 'none';
      return;
    }
    contentScale.style.transform = 'scale(1)';
    var stageEl = document.getElementById('stage');
    if (!stageEl) return;
    var padX = 28;
    var padY = 72;
    var availW = Math.max(320, stageEl.clientWidth - padX * 2);
    var availH = Math.max(240, stageEl.clientHeight - padY * 2);
    var cw = content.offsetWidth;
    var ch = content.offsetHeight;
    if (cw < 1 || ch < 1) return;
    var scale = Math.min(availW / cw, availH / ch);
    scale = Math.min(Math.max(scale, 1), 1.42);
    contentScale.style.transform = 'scale(' + scale.toFixed(3) + ')';
  }

  function scheduleContentScale() {
    requestAnimationFrame(function () {
      requestAnimationFrame(layoutContentScale);
    });
  }

  function render() {
    stopWaitingDemo(document.getElementById('feat-demo'));
    stopThemeDemo(document.getElementById('feat-demo'));
    stopSidebarDemo(document.getElementById('feat-demo'));
    stopMotionDemo(document.getElementById('feat-demo'));
    stopDingtalkSyncDemo(document.getElementById('feat-demo'));
    stopSessionIsolationDemo(document.getElementById('feat-demo'));
    stopSessionPinDemo(document.getElementById('feat-demo'));
    stopCatalogOnboardDemo(document.getElementById('feat-demo'));
    var s = SCENES[sceneIdx];
    if (!s) return;
    if (s.type === 'hero') { stepIdx = 0; renderHero(s); }
    else if (s.type === 'center') { stepIdx = 0; renderCenter(s); }
    else if (s.type === 'feature') {
      if (stepIdx < 0) stepIdx = 0;
      renderFeature(s);
    } else if (s.type === 'radial') {
      if (stepIdx < 0) stepIdx = 0;
      renderRadial(s);
    } else {
      if (stepIdx < 0) stepIdx = 0;
      renderLines(s);
    }
    var total = SCENES.length;
    if (isStepScene(s)) {
      progress.textContent = (sceneIdx + 1) + ' / ' + total + ' · ' + (stepIdx + 1) + ' / ' + countSteps(s);
    } else {
      progress.textContent = (sceneIdx + 1) + ' / ' + total;
    }
    dots.innerHTML = SCENES.map(function (_, i) {
      return '<span class="dot' + (i === sceneIdx ? ' on' : '') + '"></span>';
    }).join('');
    renderNav();
    scheduleContentScale();
  }

  function nextStep() {
    var s = SCENES[sceneIdx];
    if (!isStepScene(s)) return false;
    if (stepIdx < countSteps(s) - 1) { stepIdx++; render(); return true; }
    return false;
  }

  function prevStep() {
    var s = SCENES[sceneIdx];
    if (!isStepScene(s)) return false;
    if (stepIdx > 0) { stepIdx--; render(); return true; }
    return false;
  }

  function nextPage() {
    if (sceneIdx >= SCENES.length - 1) return;
    sceneIdx++;
    stepIdx = -1;
    render();
  }

  function prevPage() {
    if (sceneIdx <= 0) return;
    sceneIdx--;
    var s = SCENES[sceneIdx];
    stepIdx = isStepScene(s) ? countSteps(s) - 1 : 0;
    render();
  }

  function forward() {
    var s = SCENES[sceneIdx];
    if (s.type === 'hero' || s.type === 'center') { nextPage(); return; }
    if (!nextStep()) nextPage();
  }

  function backward() {
    var s = SCENES[sceneIdx];
    if (s.type === 'hero' || s.type === 'center') { prevPage(); return; }
    if (!prevStep()) prevPage();
  }

  function onKey(e) {
    var k = e.key;
    if (k === ' ' || k === 'ArrowRight' || k === 'Enter') { e.preventDefault(); forward(); }
    else if (k === 'ArrowLeft' || k === 'Backspace') { e.preventDefault(); backward(); }
    else if (k === 'ArrowDown') { e.preventDefault(); nextPage(); }
    else if (k === 'ArrowUp') { e.preventDefault(); prevPage(); }
    else if (k === 'f' || k === 'F') {
      e.preventDefault();
      toggleFullscreen();
    }
  }

  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  function toggleFullscreen() {
    if (!isFullscreen()) {
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (!req) return;
      Promise.resolve(req.call(el)).then(syncFullscreenLayout).catch(function () {});
    } else {
      var exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (!exit) return;
      Promise.resolve(exit.call(document)).then(syncFullscreenLayout).catch(function () {});
    }
  }

  function syncFullscreenLayout() {
    document.body.classList.toggle('kn-fullscreen', isFullscreen());
    scheduleContentScale();
  }

  if (navList) {
    navList.addEventListener('click', function (e) {
      var btn = e.target.closest('.kn-nav-item');
      if (!btn) return;
      e.stopPropagation();
      goToPage(btn.getAttribute('data-idx'));
    });
  }
  document.addEventListener('fullscreenchange', syncFullscreenLayout);
  document.addEventListener('webkitfullscreenchange', syncFullscreenLayout);

  document.getElementById('stage').addEventListener('click', function (e) {
    if (e.clientX > window.innerWidth / 2) forward();
    else backward();
  });
  window.addEventListener('keydown', onKey);
  window.addEventListener('resize', scheduleContentScale);
  document.body.focus();
  render();
  } catch (err) {
    showKeynoteError(err);
  }
})();
</script>
</body>
