<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yaahlan 智能工具 Agent</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --bg-panel: #161922;
      --bg-hover: #1e2230;
      --bg-input: #12151c;
      --border: #2a3040;
      --text: #e8eaef;
      --muted: #8b93a7;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --user-bg: #1a2744;
      --assistant-bg: #161922;
      --success: #22c55e;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-panel);
      flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 28px; height: 28px; border-radius: 8px;
      background: #0a0a0a;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; flex-shrink: 0;
    }
    .brand-icon svg, .empty-logo svg { width: 100%; height: 100%; display: block; }
    .brand h1 { font-size: 1rem; font-weight: 600; }
    .header-actions { display: flex; gap: 8px; margin-left: auto; }
    .header-actions button {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: 0.82rem;
    }
    .header-actions button:hover:not(:disabled) { border-color: var(--accent); color: var(--text); }
    .header-actions button:disabled {
      opacity: 0.38; cursor: not-allowed;
      border-color: var(--border); color: var(--muted);
      background: transparent;
    }
    .header-actions .primary {
      background: var(--accent); border-color: var(--accent); color: #fff;
    }
    .header-actions .primary:hover { background: var(--accent-hover); }
    .main {
      display: grid;
      grid-template-columns: var(--sidebar-width, 240px) 1fr;
      flex: 1;
      min-height: 0;
    }
    .main.catalog-open {
      grid-template-columns: var(--sidebar-width, 240px) 1fr var(--catalog-width, 380px);
    }
    .main.sidebar-collapsed { grid-template-columns: 1fr; }
    .main.sidebar-collapsed.catalog-open {
      grid-template-columns: 1fr var(--catalog-width, 380px);
    }
    .main.sidebar-collapsed .left-panel { display: none; }
    body.is-resizing { cursor: col-resize !important; user-select: none !important; }
    body.is-resizing * { cursor: col-resize !important; }
    @media (max-width: 960px) {
      .main.catalog-open { grid-template-columns: var(--sidebar-width, 200px) 1fr; }
      .catalog-panel {
        position: fixed; top: 49px; right: 0; bottom: 0;
        width: var(--catalog-width, min(94vw, 400px));
        z-index: 50; box-shadow: -8px 0 32px rgba(0,0,0,0.5);
      }
    }
    @media (max-width: 640px) {
      .main { grid-template-columns: 1fr; }
      .main.catalog-open { grid-template-columns: 1fr; }
      .left-panel { display: none; }
    }
    .left-panel {
      position: relative;
      border-right: 1px solid var(--border);
      background: var(--bg-panel);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .sidebar-resizer {
      position: absolute; right: -3px; top: 0; bottom: 0; width: 6px;
      cursor: col-resize; z-index: 2; touch-action: none;
    }
    .sidebar-resizer::after {
      content: ''; position: absolute; right: 2px; top: 0; bottom: 0; width: 2px;
      background: transparent; transition: background 0.15s;
    }
    .sidebar-resizer:hover::after,
    body.is-resizing .sidebar-resizer::after {
      background: rgba(59,130,246,0.55);
    }
    .panel-head {
      padding: 12px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      font-size: 0.85rem; color: var(--muted);
    }
    .panel-head button:not(.panel-head-close) {
      background: var(--accent); border: none; color: #fff;
      padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.78rem;
    }
    .panel-head-title {
      display: flex; align-items: center; gap: 8px; min-width: 0;
    }
    .panel-head-title > span { color: var(--muted); font-size: 0.85rem; }
    .session-list { overflow-y: auto; flex: 1; }
    .session-item {
      padding: 10px 12px; cursor: pointer; border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    .session-item:hover { background: var(--bg-hover); }
    .session-item.active { background: var(--bg-hover); border-left: 3px solid var(--accent); }
    .panel-head-close {
      flex-shrink: 0;
      width: 16px; height: 16px; padding: 0; margin: 0;
      border: none; border-radius: 0;
      background: transparent; color: #8b93a7;
      cursor: pointer; display: inline-flex;
      align-items: center; justify-content: center;
    }
    .panel-head-close svg {
      width: 12px; height: 12px; stroke: currentColor;
      stroke-width: 1.6; stroke-linecap: round;
    }
    .panel-head-close:hover { color: #c4cad6; }
    .session-title {
      font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .session-meta { font-size: 0.72rem; color: var(--muted); margin-top: 4px; }
    .session-preview {
      font-size: 0.76rem; color: var(--muted); margin-top: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .session-source {
      display: inline-block; font-size: 0.68rem; padding: 1px 6px; border-radius: 4px;
      background: rgba(252, 211, 77, 0.15); color: #fcd34d; vertical-align: middle; margin-right: 4px;
    }
    .session-owner { color: #fcd34d; }
    .dingtalk-owner-bar {
      flex-shrink: 0;
      padding: 8px 24px;
      font-size: 0.8rem;
      color: #fcd34d;
      background: rgba(252, 211, 77, 0.08);
      border-bottom: 1px solid rgba(252, 211, 77, 0.2);
    }
    .dingtalk-owner-bar[hidden] { display: none; }
    .readonly-hint { color: #fcd34d !important; }
    .input-wrap.readonly { border-color: rgba(252, 211, 77, 0.35); }
    textarea.readonly-input::placeholder { color: #fcd34d; opacity: 1; }
    textarea.readonly-input { cursor: not-allowed; color: var(--muted); }
    .chat-area {
      display: flex; flex-direction: column; min-height: 0;
    }
    .messages {
      flex: 1; overflow-y: auto; padding: 20px 24px;
    }
    .empty-state {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100%; text-align: center; gap: 16px;
      color: var(--muted);
    }
    .empty-logo {
      width: 64px; height: 64px; border-radius: 16px;
      background: #0a0a0a;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .empty-state h2 { color: var(--text); font-size: 1.3rem; }
    .empty-state p { font-size: 0.9rem; max-width: 420px; }
    .quick-prompts {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      max-width: 560px; width: 100%; margin-top: 8px;
    }
    .quick-prompts button {
      background: var(--bg-hover); border: 1px solid var(--border);
      color: var(--text); padding: 12px 14px; border-radius: 10px;
      cursor: pointer; font-size: 0.82rem; text-align: left;
      transition: border-color 0.15s;
    }
    .quick-prompts button:hover { border-color: var(--accent); }
    .msg {
      margin-bottom: 16px; max-width: 820px;
    }
    .msg.user { margin-left: auto; }
    .msg-label {
      font-size: 0.72rem; color: var(--muted); margin-bottom: 4px;
    }
    .msg.user .msg-label { text-align: right; }
    .msg-body {
      padding: 12px 16px; border-radius: 12px; font-size: 0.9rem; line-height: 1.6;
    }
    .msg.user .msg-body { background: var(--user-bg); border: 1px solid #2a4060; }
    .msg.assistant .msg-body {
      background: var(--assistant-bg); border: 1px solid var(--border);
    }
    .msg-body pre {
      background: #0a0c10; padding: 10px; border-radius: 8px; overflow-x: auto;
      font-size: 0.82rem; margin: 8px 0;
    }
    .msg-body code { background: #0a0c10; padding: 2px 5px; border-radius: 4px; font-size: 0.85em; }
    .msg-body pre code { background: none; padding: 0; }
    .msg-body table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 0.85rem; }
    .msg-body th, .msg-body td { border: 1px solid var(--border); padding: 6px 10px; }
    .msg-body th { background: var(--bg-hover); }
    .msg-body .markdown-body > :first-child { margin-top: 0; }
    .msg-body .markdown-body > :last-child { margin-bottom: 0; }
    .msg-body .markdown-body p { margin: 0.55em 0; }
    .msg-body .markdown-body h1,
    .msg-body .markdown-body h2,
    .msg-body .markdown-body h3,
    .msg-body .markdown-body h4 {
      margin: 1em 0 0.45em;
      line-height: 1.35;
      font-weight: 600;
      color: var(--text);
    }
    .msg-body .markdown-body h1 { font-size: 1.25rem; }
    .msg-body .markdown-body h2 { font-size: 1.12rem; }
    .msg-body .markdown-body h3 { font-size: 1rem; }
    .msg-body .markdown-body h4 { font-size: 0.95rem; }
    .msg-body .markdown-body ul,
    .msg-body .markdown-body ol {
      margin: 0.45em 0 0.65em;
      padding-left: 1.45em;
      list-style-position: outside;
    }
    .msg-body .markdown-body ul ul,
    .msg-body .markdown-body ol ol,
    .msg-body .markdown-body ul ol,
    .msg-body .markdown-body ol ul {
      margin: 0.2em 0 0.35em;
      padding-left: 1.35em;
    }
    .msg-body .markdown-body li {
      margin: 0.22em 0;
      padding-left: 0.2em;
    }
    .msg-body .markdown-body li > p { margin: 0.2em 0; }
    .msg-body .markdown-body blockquote {
      margin: 0.65em 0;
      padding: 0.2em 0 0.2em 12px;
      border-left: 3px solid var(--border);
      color: var(--muted);
    }
    .msg-body .markdown-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1em 0;
    }
    .msg-body .markdown-body a { color: #93c5fd; text-decoration: none; }
    .msg-body .markdown-body a:hover { text-decoration: underline; }
    .typing { color: var(--muted); font-style: italic; font-size: 0.85rem; padding: 8px 0; }
    .run-status {
      display: flex; flex-direction: column; gap: 4px;
      font-size: 0.8rem; color: var(--muted); margin-bottom: 8px;
      padding: 8px 10px; border-radius: 8px;
      background: rgba(59,130,246,0.06); border: 1px solid rgba(59,130,246,0.15);
    }
    .run-status:empty { display: none; }
    .run-status-line { line-height: 1.45; }
    .run-status-ack { color: #93c5fd; }
    .run-status-batch { color: #fcd34d; }
    .run-status-elapsed { color: var(--muted); font-style: italic; }
    .input-area {
      padding: 12px 20px 16px; border-top: 1px solid var(--border);
      background: var(--bg-panel);
    }
    .input-wrap {
      display: flex; gap: 10px; align-items: flex-end;
      background: var(--bg-input); border: 1px solid var(--border);
      border-radius: 12px; padding: 10px 12px;
    }
    .input-wrap:focus-within { border-color: var(--accent); }
    .input-wrap.drag-over {
      border-color: var(--accent);
      background: rgba(59,130,246,0.08);
      box-shadow: inset 0 0 0 1px rgba(59,130,246,0.25);
    }
    .input-wrap.readonly { opacity: 0.92; }
    .pending-images {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin-bottom: 8px;
    }
    .pending-images:empty { display: none; }
    .pending-image {
      position: relative; width: 72px; height: 72px;
      border-radius: 10px; overflow: hidden;
      border: 1px solid var(--border); background: #0a0c10;
    }
    .pending-image img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .pending-image button {
      position: absolute; top: 4px; right: 4px;
      width: 20px; height: 20px; border: none; border-radius: 999px;
      background: rgba(0,0,0,0.65); color: #fff; cursor: pointer;
      font-size: 12px; line-height: 1;
    }
    .msg-images {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px;
    }
    .msg-images img {
      max-width: 220px; max-height: 180px; border-radius: 10px;
      border: 1px solid var(--border); object-fit: cover; cursor: zoom-in;
    }
    textarea {
      flex: 1; background: transparent; border: none; color: var(--text);
      font-size: 0.9rem; resize: none; outline: none; min-height: 24px; max-height: 160px;
      font-family: inherit; line-height: 1.5;
    }
    .send-btn {
      background: var(--accent); border: none; color: #fff;
      width: 36px; height: 36px; border-radius: 8px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .send-btn:hover { background: var(--accent-hover); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .send-btn[hidden], .stop-btn[hidden] { display: none; }
    .stop-btn {
      background: var(--danger); border: none; color: #fff;
      width: 36px; height: 36px; border-radius: 8px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .stop-btn:hover:not(:disabled) { background: #dc2626; }
    .stop-btn:disabled { opacity: 0.55; cursor: wait; }
    .stop-btn .stop-spinner { display: none; }
    .stop-btn.is-cancelling .stop-icon { display: none; }
    .stop-btn.is-cancelling .stop-spinner {
      display: block;
      animation: stop-spin 0.75s linear infinite;
    }
    @keyframes stop-spin { to { transform: rotate(360deg); } }
    .input-hint { font-size: 0.72rem; color: var(--muted); margin-top: 6px; }
    .about-modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      align-items: center; justify-content: center; z-index: 100;
    }
    .about-modal.open { display: flex; }
    .about-box {
      background: var(--bg-panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 24px; max-width: 480px; width: 90%;
    }
    .about-box h3 { margin-bottom: 12px; }
    .about-box p { color: var(--muted); font-size: 0.88rem; line-height: 1.6; margin-bottom: 8px; }
    .about-box button {
      margin-top: 16px; background: var(--accent); border: none; color: #fff;
      padding: 8px 20px; border-radius: 8px; cursor: pointer;
    }
    .header-actions button.active {
      border-color: var(--accent); color: var(--accent); background: rgba(59,130,246,0.12);
    }
    .catalog-panel {
      position: relative;
      border-left: 1px solid var(--border);
      background: linear-gradient(180deg, #12151c 0%, var(--bg-panel) 120px);
      display: none;
      flex-direction: column;
      min-height: 0;
      width: var(--catalog-width, 380px);
      min-width: 280px;
      max-width: 560px;
    }
    .catalog-panel.open { display: flex; }
    .catalog-panel-resizer {
      position: absolute; left: -3px; top: 0; bottom: 0; width: 6px;
      cursor: col-resize; z-index: 2; touch-action: none;
    }
    .catalog-panel-resizer::after {
      content: ''; position: absolute; left: 2px; top: 0; bottom: 0; width: 2px;
      background: transparent; transition: background 0.15s;
    }
    .catalog-panel-resizer:hover::after,
    body.is-resizing .catalog-panel-resizer::after {
      background: rgba(59,130,246,0.55);
    }
    .catalog-panel-head {
      padding: 12px 14px 10px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-start; gap: 10px; flex-shrink: 0;
    }
    .catalog-panel-head .head-main { flex: 1; min-width: 0; }
    .catalog-panel-head h2 {
      font-size: 0.92rem; font-weight: 600; margin: 0 0 4px;
    }
    .catalog-meta {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 0.72rem; color: var(--muted);
      background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      padding: 2px 8px; border-radius: 999px;
    }
    .catalog-panel-head .head-actions {
      display: flex; align-items: center; gap: 4px; flex-shrink: 0;
    }
    .catalog-panel-head button {
      background: transparent; border: none; color: var(--muted);
      cursor: pointer; font-size: 0.78rem; line-height: 1;
      padding: 6px 8px; border-radius: 6px;
    }
    .catalog-panel-head button:hover { color: var(--text); background: var(--bg-hover); }
    .catalog-panel-head .btn-close { font-size: 1.15rem; padding: 4px 8px; }
    .catalog-toolbar {
      padding: 10px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .catalog-search {
      width: 100%; padding: 9px 12px; border: 1px solid var(--border);
      border-radius: 10px; background: var(--bg-input); color: var(--text);
      font-size: 0.84rem;
    }
    .catalog-search:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }
    .catalog-search::placeholder { color: #6b7280; }
    .catalog-panel-body {
      display: flex; flex-direction: row;
      flex: 1; min-height: 0; min-width: 0;
    }
    .catalog-nav {
      width: var(--catalog-nav-width, 112px);
      min-width: 88px; max-width: 200px; flex-shrink: 0;
      overflow-y: auto; overflow-x: hidden;
      padding: 8px 6px; border-right: 1px solid var(--border);
      scrollbar-width: thin;
    }
    .catalog-nav-resizer {
      width: 5px; flex-shrink: 0; cursor: col-resize;
      background: transparent; touch-action: none;
      transition: background 0.15s;
    }
    .catalog-nav-resizer:hover,
    body.is-resizing .catalog-nav-resizer {
      background: rgba(59,130,246,0.35);
    }
    .catalog-nav button {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      width: 100%; text-align: left; border: 0;
      background: transparent; padding: 7px 8px; border-radius: 8px;
      cursor: pointer; font-size: 0.76rem; color: var(--muted);
      transition: background 0.15s, color 0.15s;
    }
    .catalog-nav button:hover { background: var(--bg-hover); color: var(--text); }
    .catalog-nav button.active {
      background: rgba(59,130,246,0.18); color: #93c5fd; font-weight: 600;
    }
    .catalog-nav .nav-label {
      flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .catalog-nav .count {
      flex-shrink: 0; font-size: 0.68rem; color: var(--muted);
      background: rgba(255,255,255,0.06); padding: 1px 6px; border-radius: 999px;
    }
    .catalog-nav button.active .count {
      color: #93c5fd; background: rgba(59,130,246,0.22);
    }
    .catalog-main {
      overflow-y: auto; padding: 12px; flex: 1; min-width: 0;
      scrollbar-width: thin;
    }
    .catalog-module, .playbook-section {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 14px; margin-bottom: 12px;
    }
    .catalog-module .module-head, .playbook-section .playbook-head {
      margin-bottom: 10px;
    }
    .catalog-module h3, .playbook-section h3 {
      margin: 0; font-size: 0.9rem; font-weight: 600; line-height: 1.35;
    }
    .catalog-module .sub, .playbook-tag-row {
      font-size: 0.72rem; color: var(--muted); margin-top: 4px;
    }
    .playbook-tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .playbook-tag {
      font-size: 0.68rem; background: rgba(59,130,246,0.12);
      color: #93c5fd; padding: 2px 8px; border-radius: 999px;
      border: 1px solid rgba(59,130,246,0.2);
    }
    .catalog-module ol.cats { margin: 0; padding: 0; list-style: none; }
    .catalog-module ol.cats > li {
      margin-bottom: 12px; padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .catalog-module ol.cats > li:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: 0; }
    .cat-name {
      display: block; font-weight: 600; font-size: 0.74rem;
      color: #9ca3af; text-transform: none; letter-spacing: 0.02em;
      margin-bottom: 6px;
    }
    .catalog-module ul.items { margin: 0; padding: 0; list-style: none; }
    .cap {
      margin: 0 0 4px; border-radius: 8px;
      border: 1px solid transparent; transition: border-color 0.15s;
    }
    .cap:has(.cap-head[aria-expanded="true"]) { border-color: rgba(59,130,246,0.25); }
    .cap-head {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 10px; border-radius: 8px;
    }
    .cap-head.is-toggle { cursor: pointer; user-select: none; }
    .cap-head.is-toggle:hover { background: rgba(255,255,255,0.04); }
    .cap-head.is-toggle[aria-expanded="true"] { background: rgba(59,130,246,0.1); }
    .cap-chevron {
      flex-shrink: 0; width: 14px; color: var(--muted); font-size: 0.7rem;
      transition: transform 0.15s;
    }
    .cap-head[aria-expanded="true"] .cap-chevron { transform: rotate(90deg); color: var(--accent); }
    .cap-main {
      display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
      flex: 1; min-width: 0;
    }
    .cap-name { font-size: 0.82rem; color: var(--text); line-height: 1.35; }
    .source-badge {
      font-size: 0.65rem; color: #9ca3af; background: rgba(255,255,255,0.05);
      padding: 2px 7px; border-radius: 999px; border: 1px solid var(--border);
    }
    .source-badge[data-env="online"] {
      background: rgba(234,179,8,0.12); color: #fcd34d; border-color: rgba(234,179,8,0.25);
    }
    .source-badge[data-env="test"] { border-color: rgba(34,197,94,0.2); color: #86efac; }
    .prompt-panel {
      margin: 0 6px 6px; padding: 8px;
      background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px;
    }
    .prompt-panel[hidden] { display: none; }
    .prompt-list { display: flex; flex-direction: column; gap: 8px; }
    .prompt-line {
      display: flex; flex-direction: column; gap: 8px;
      padding: 10px; background: var(--bg-panel);
      border: 1px solid var(--border); border-radius: 8px;
    }
    .prompt-text {
      font-size: 0.78rem; color: #c4cad6;
      line-height: 1.65; word-break: break-word;
    }
    .prompt-field {
      display: inline-block; min-width: 3.5em; max-width: 100%;
      padding: 2px 7px; margin: 0 2px; border: 1px solid rgba(59,130,246,0.35);
      border-radius: 5px; font-size: 0.78rem; background: #0d1118;
      color: var(--text); vertical-align: baseline;
    }
    .prompt-field:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(59,130,246,0.2);
    }
    .prompt-field::placeholder { color: #6b7280; font-style: italic; }
    .prompt-line-footer { display: flex; justify-content: flex-end; }
    .prompt-run {
      border: none; background: var(--accent); color: #fff;
      font-size: 0.74rem; padding: 5px 14px; border-radius: 6px;
      cursor: pointer; font-weight: 500;
      transition: background 0.15s;
    }
    .prompt-run:hover { background: var(--accent-hover); }
    .playbook-summary {
      font-size: 0.78rem; color: var(--muted); margin: 6px 0 0; line-height: 1.55;
    }
    .playbook-defaults {
      display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px;
    }
    .default-chip {
      font-size: 0.7rem; color: var(--muted);
      background: var(--bg-input); border: 1px solid var(--border);
      padding: 3px 8px; border-radius: 6px;
    }
    .default-chip code {
      color: #93c5fd; background: none; padding: 0; font-size: inherit;
    }
    .playbook-steps { margin-top: 10px; }
    .playbook-step {
      border: 1px solid var(--border); border-radius: 10px;
      margin-bottom: 6px; overflow: hidden; background: var(--bg-input);
    }
    .playbook-step-head {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 12px; cursor: pointer; user-select: none;
    }
    .playbook-step-head:hover { background: rgba(255,255,255,0.03); }
    .playbook-step-num {
      flex-shrink: 0; width: 1.5rem; height: 1.5rem; border-radius: 8px;
      background: rgba(59,130,246,0.2); color: #93c5fd;
      font-size: 0.75rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(59,130,246,0.3);
    }
    .playbook-step-title {
      font-weight: 600; font-size: 0.8rem; line-height: 1.4; color: var(--text);
    }
    .playbook-step-sub {
      font-size: 0.72rem; color: var(--muted); margin-top: 3px; line-height: 1.4;
    }
    .playbook-step-sub code {
      font-size: 0.68rem; background: rgba(255,255,255,0.05);
      padding: 1px 4px; border-radius: 3px;
    }
    .playbook-step-body {
      padding: 0 12px 12px 2.8rem;
      border-top: 1px solid rgba(255,255,255,0.04);
    }
    .playbook-step-body[hidden] { display: none; }
    .playbook-step-note { font-size: 0.76rem; color: var(--muted); margin: 8px 0; line-height: 1.5; }
    .playbook-ops {
      margin: 6px 0 0; padding-left: 1.1rem;
      font-size: 0.74rem; color: #9ca3af; line-height: 1.5;
    }
    .playbook-ops li { margin: 3px 0; }
    .catalog-empty {
      color: var(--muted); text-align: center; padding: 40px 16px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="24" height="24" rx="5.5" fill="#000"/>
          <path d="M5.5 9.5L12 6.5V13.5L5.5 16.5V9.5Z" fill="#F5F5F5"/>
          <path d="M12 6.5L18.5 9.5V16.5L12 13.5V6.5Z" fill="#7A7A7A"/>
          <path d="M5.5 16.5L12 13.5L18.5 16.5L12 19.5L5.5 16.5Z" fill="#424242"/>
        </svg>
      </div>
      <h1 id="app-title">Yaahlan 智能工具 Agent</h1>
    </div>
    <div class="header-actions">
      <button type="button" id="btn-sidebar" title="历史会话">历史会话</button>
      <button type="button" id="btn-catalog" title="工具台能力目录">能力目录</button>
      <button type="button" id="btn-new">+ 新对话</button>
      <button type="button" id="btn-clear">清空</button>
      <button type="button" id="btn-about">关于</button>
    </div>
  </header>

  <div class="main">
    <aside class="left-panel">
      <div class="panel-head">
        <div class="panel-head-title">
          <button type="button" class="panel-head-close" id="btn-sidebar-close" title="收起侧边栏" aria-label="收起侧边栏">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18"/>
            </svg>
          </button>
          <span>历史会话</span>
        </div>
        <button type="button" id="btn-new-side">+ 新建</button>
      </div>
      <div class="session-list" id="session-list"></div>
      <div class="sidebar-resizer" id="sidebar-resizer" title="拖动调整历史会话宽度"></div>
    </aside>

    <section class="chat-area">
      <div class="dingtalk-owner-bar" id="dingtalk-owner-bar" hidden></div>
      <div class="messages" id="messages"></div>
      <div class="input-area">
        <div class="pending-images" id="pending-images"></div>
        <div class="input-wrap" id="input-wrap">
          <textarea id="input" rows="1" placeholder="输入问题；可直接粘贴或拖拽图片到此处…"></textarea>
          <button type="button" class="stop-btn" id="btn-stop" title="中断思考" hidden aria-busy="false">
            <svg class="stop-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <rect x="6" y="6" width="12" height="12" rx="1.5"/>
            </svg>
            <svg class="stop-spinner" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
              <circle cx="12" cy="12" r="9" stroke-opacity="0.25"/>
              <path d="M12 3a9 9 0 0 1 9 9" stroke-linecap="round"/>
            </svg>
          </button>
          <button type="button" class="send-btn" id="btn-send" title="发送">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 19V5M5 12l7-7 7 7"/>
            </svg>
          </button>
        </div>
        <div class="input-hint">Enter 发送 · Shift+Enter 换行 · 执行中可点右侧停止按钮中断 · 输入框内粘贴/拖拽图片</div>
      </div>
    </section>

    <aside class="catalog-panel" id="catalog-panel">
      <div class="catalog-panel-resizer" id="catalog-panel-resizer" title="拖动调整能力目录宽度"></div>
      <div class="catalog-panel-head">
        <div class="head-main">
          <h2>工具台能力</h2>
          <span class="catalog-meta" id="catalog-meta"></span>
        </div>
        <div class="head-actions">
          <button type="button" class="btn-close" id="btn-catalog-close" title="关闭">×</button>
        </div>
      </div>
      <div class="catalog-toolbar">
        <input class="catalog-search" id="catalog-search" type="search"
               placeholder="搜索能力、分类或提示语…" autocomplete="off" />
      </div>
      <div class="catalog-panel-body">
        <nav class="catalog-nav" id="catalog-nav"></nav>
        <div class="catalog-nav-resizer" id="catalog-nav-resizer" title="拖动调整分类栏宽度"></div>
        <div class="catalog-main" id="catalog-main"></div>
      </div>
    </aside>
  </div>

  <div class="about-modal" id="about-modal">
    <div class="about-box">
      <h3>关于 Yaahlan Web Agent</h3>
      <p>基于 Cursor Agent SDK 的 Web 对话界面，可直接调用仓库内各模块 execute 脚本、钉钉 MCP、Tunnel 抓包等能力。</p>
      <p>会话历史保存在服务端，重启后可恢复。Agent 上下文按会话复用，支持多轮对话。</p>
      <button type="button" id="btn-about-close">关闭</button>
    </div>
  </div>

  <script src="catalog_panel.js"></script>
  <script>
    const API = '';
    let currentSessionId = localStorage.getItem('web_agent_session') || '';
    /** @type {Map<string, { eventSource: EventSource, runId: string, cancelling?: boolean, status: { ack: string, batch: string, elapsed: string }, shellEl: HTMLElement | null }>} */
    const activeRuns = new Map();
    let meta = {};
    let catalogPanel = null;
    const catalogPref = localStorage.getItem('web_agent_catalog_open');
    let catalogOpen = catalogPref === null ? true : catalogPref === '1';
    const sidebarPref = localStorage.getItem('web_agent_sidebar_open');
    let sidebarOpen = sidebarPref === null ? true : sidebarPref === '1';
    let sessionsCache = [];
    let currentSessionReadOnly = false;
    /** @type {Array<{ id: string, name: string, mime: string, previewUrl: string, data_base64: string }>} */
    let pendingImages = [];
    const MAX_IMAGES = 5;
    const MAX_IMAGE_BYTES = 5 * 1024 * 1024;

    function renderMessageImages(images) {
      if (!images?.length) return '';
      return `<div class="msg-images">${images.map(src =>
        `<a href="${escapeHtml(src)}" target="_blank" rel="noopener"><img src="${escapeHtml(src)}" alt="附图" loading="lazy" /></a>`
      ).join('')}</div>`;
    }

    function renderPendingImages() {
      const container = document.getElementById('pending-images');
      if (!container) return;
      container.innerHTML = pendingImages.map(item => `
        <div class="pending-image" data-id="${escapeHtml(item.id)}">
          <img src="${item.previewUrl}" alt="${escapeHtml(item.name)}" />
          <button type="button" title="移除" aria-label="移除图片">×</button>
        </div>`).join('');
      container.querySelectorAll('.pending-image button').forEach(btn => {
        btn.addEventListener('click', () => {
          const wrap = btn.closest('.pending-image');
          const id = wrap?.getAttribute('data-id');
          if (!id) return;
          pendingImages = pendingImages.filter(item => item.id !== id);
          renderPendingImages();
          updateInputState();
        });
      });
    }

    async function addPendingImageFiles(fileList) {
      if (currentSessionReadOnly) return;
      const files = Array.from(fileList || []);
      for (const file of files) {
        if (pendingImages.length >= (meta.maxImagesPerMessage || MAX_IMAGES)) {
          alert(`最多上传 ${meta.maxImagesPerMessage || MAX_IMAGES} 张图片`);
          break;
        }
        if (!file.type.startsWith('image/')) {
          alert(`不支持的文件类型：${file.name}`);
          continue;
        }
        if (file.size > MAX_IMAGE_BYTES) {
          alert(`图片过大（>${MAX_IMAGE_BYTES / (1024 * 1024)}MB）：${file.name}`);
          continue;
        }
        const dataUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result || ''));
          reader.onerror = () => reject(new Error('读取图片失败'));
          reader.readAsDataURL(file);
        });
        const comma = dataUrl.indexOf(',');
        pendingImages.push({
          id: `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
          name: file.name,
          mime: file.type,
          previewUrl: dataUrl,
          data_base64: comma >= 0 ? dataUrl.slice(comma + 1) : dataUrl,
        });
      }
      renderPendingImages();
      updateInputState();
    }

    function clearPendingImages() {
      pendingImages = [];
      renderPendingImages();
    }

    const DEFAULT_PLACEHOLDER = '输入问题；可直接粘贴或拖拽图片到此处…';
    const READONLY_PLACEHOLDER = '此会话来自钉钉同步，仅供查看；继续对话请点「+ 新对话」';

    function canAttachImages() {
      return !currentSessionReadOnly && !isCurrentSessionStreaming();
    }

    function collectImageFilesFromDataTransfer(dataTransfer) {
      if (!dataTransfer) return [];
      const files = [];
      if (dataTransfer.items?.length) {
        for (const item of dataTransfer.items) {
          if (item.kind === 'file' && item.type.startsWith('image/')) {
            const file = item.getAsFile();
            if (file) files.push(file);
          }
        }
      }
      if (!files.length && dataTransfer.files?.length) {
        for (const file of dataTransfer.files) {
          if (file.type.startsWith('image/')) files.push(file);
        }
      }
      return files;
    }

    function setupInputImageHandlers() {
      const inputWrap = document.getElementById('input-wrap');
      const textarea = document.getElementById('input');
      if (!inputWrap || !textarea) return;

      textarea.addEventListener('paste', (e) => {
        if (!canAttachImages()) return;
        const files = collectImageFilesFromDataTransfer(e.clipboardData);
        if (!files.length) return;
        e.preventDefault();
        addPendingImageFiles(files);
      });

      inputWrap.addEventListener('dragenter', (e) => {
        if (!canAttachImages()) return;
        if (![...(e.dataTransfer?.types || [])].includes('Files')) return;
        e.preventDefault();
        inputWrap.classList.add('drag-over');
      });

      inputWrap.addEventListener('dragover', (e) => {
        if (!canAttachImages()) return;
        if (![...(e.dataTransfer?.types || [])].includes('Files')) return;
        e.preventDefault();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
        inputWrap.classList.add('drag-over');
      });

      inputWrap.addEventListener('dragleave', (e) => {
        if (!inputWrap.contains(e.relatedTarget)) {
          inputWrap.classList.remove('drag-over');
        }
      });

      inputWrap.addEventListener('drop', (e) => {
        e.preventDefault();
        inputWrap.classList.remove('drag-over');
        if (!canAttachImages()) return;
        const files = collectImageFilesFromDataTransfer(e.dataTransfer);
        if (files.length) addPendingImageFiles(files);
      });
    }

    function renderMarkdown(text) {
      try {
        if (typeof marked?.use === 'function') {
          marked.use({ gfm: true, breaks: false });
        } else if (marked?.setOptions) {
          marked.setOptions({ gfm: true, breaks: false });
        }
        return `<div class="markdown-body">${marked.parse(text || '')}</div>`;
      } catch {
        return `<div class="markdown-body">${(text || '').replace(/</g, '&lt;').replace(/\n/g, '<br>')}</div>`;
      }
    }

    async function api(path, opts = {}) {
      const resp = await fetch(API + path, {
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
        ...opts,
      });
      if (resp.status === 401) {
        throw new Error('需要登录鉴权，请刷新页面并在浏览器登录框输入账号密码');
      }
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.error || `HTTP ${resp.status}`);
      }
      return resp.json();
    }

    async function loadMeta() {
      meta = await api('/api/meta');
      document.getElementById('app-title').textContent = meta.title || 'Yaahlan 智能工具 Agent';
      document.title = meta.title || 'Yaahlan Web Agent';
    }

    function isCurrentSessionStreaming() {
      return activeRuns.has(currentSessionId);
    }

    function renderRunStatusEl(statusEl, status) {
      if (!statusEl) return;
      const lines = [];
      if (status.ack) {
        lines.push(`<div class="run-status-line run-status-ack">${escapeHtml(status.ack)}</div>`);
      }
      if (status.batch) {
        lines.push(`<div class="run-status-line run-status-batch">${escapeHtml(status.batch)}</div>`);
      }
      if (status.elapsed) {
        lines.push(`<div class="run-status-line run-status-elapsed">${escapeHtml(status.elapsed)}</div>`);
      }
      statusEl.innerHTML = lines.join('');
    }

    function ensureStreamingShell(sessionId) {
      const run = activeRuns.get(sessionId);
      if (run?.shellEl) return run.shellEl;
      const container = document.getElementById('messages');
      if (container.querySelector('.empty-state')) container.innerHTML = '';
      document.getElementById('typing-indicator')?.remove();
      const el = document.createElement('div');
      el.className = 'msg assistant streaming';
      el.innerHTML = `
        <div class="msg-label">Agent</div>
        <div class="run-status"></div>
        <div class="msg-body"></div>`;
      container.appendChild(el);
      container.scrollTop = container.scrollHeight;
      if (run) {
        run.shellEl = el;
        renderRunStatusEl(el.querySelector('.run-status'), run.status);
      }
      return el;
    }

    function updateRunStatus(sessionId, patch) {
      const run = activeRuns.get(sessionId);
      if (!run) return;
      run.status = { ...run.status, ...patch };
      if (sessionId !== currentSessionId) return;
      const shell = run.shellEl || ensureStreamingShell(sessionId);
      renderRunStatusEl(shell.querySelector('.run-status'), run.status);
      document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    }

    function clearRunStatus(sessionId) {
      const run = activeRuns.get(sessionId);
      if (!run?.shellEl) return;
      const statusEl = run.shellEl.querySelector('.run-status');
      if (statusEl) statusEl.innerHTML = '';
      run.shellEl.classList.remove('streaming');
    }

    function updateDingtalkOwnerBar() {
      const bar = document.getElementById('dingtalk-owner-bar');
      if (!bar) return;
      const item = sessionsCache.find(s => s.id === currentSessionId);
      if (item?.source === 'dingtalk' && item.dingtalk_owner) {
        bar.hidden = false;
        bar.textContent = `钉钉会话 · 归属：${item.dingtalk_owner}`;
      } else {
        bar.hidden = true;
        bar.textContent = '';
      }
    }

    function updateReadOnlyState() {
      const input = document.getElementById('input');
      const inputWrap = document.querySelector('.input-wrap');
      const defaultHint = document.querySelector('.input-area .input-hint');
      if (currentSessionReadOnly) {
        input.readOnly = true;
        input.value = '';
        input.placeholder = READONLY_PLACEHOLDER;
        input.classList.add('readonly-input');
        inputWrap?.classList.add('readonly');
        if (defaultHint) defaultHint.hidden = true;
        clearPendingImages();
      } else {
        input.readOnly = false;
        input.placeholder = DEFAULT_PLACEHOLDER;
        input.classList.remove('readonly-input');
        inputWrap?.classList.remove('readonly');
        if (defaultHint) defaultHint.hidden = false;
      }
      document.getElementById('readonly-hint')?.remove();
      updateInputState();
    }

    function syncSessionReadOnly(sessionId) {
      const item = sessionsCache.find(s => s.id === sessionId);
      currentSessionReadOnly = item?.read_only === true || item?.source === 'dingtalk';
      updateReadOnlyState();
      updateDingtalkOwnerBar();
    }

    function updateInputState() {
      const busy = isCurrentSessionStreaming();
      const hasDraft = !!document.getElementById('input').value.trim() || pendingImages.length > 0;
      const sendBtn = document.getElementById('btn-send');
      const stopBtn = document.getElementById('btn-stop');
      const run = activeRuns.get(currentSessionId);
      sendBtn.hidden = busy;
      stopBtn.hidden = !busy || currentSessionReadOnly;
      sendBtn.disabled = currentSessionReadOnly || busy || !hasDraft;
      const cancelling = !!run?.cancelling;
      stopBtn.disabled = currentSessionReadOnly || !busy || cancelling;
      stopBtn.classList.toggle('is-cancelling', cancelling);
      stopBtn.title = cancelling ? '中断发起中…' : '中断思考';
      stopBtn.setAttribute('aria-busy', cancelling ? 'true' : 'false');
      const clearBtn = document.getElementById('btn-clear');
      if (clearBtn) clearBtn.disabled = currentSessionReadOnly || busy || !currentSessionId;
    }

    function showInterruptedReply(sessionId) {
      if (currentSessionId !== sessionId) return;
      const run = activeRuns.get(sessionId);
      let shell = run?.shellEl;
      if (!shell) {
        shell = ensureStreamingShell(sessionId);
        if (run) run.shellEl = shell;
      }
      clearRunStatus(sessionId);
      shell.querySelector('.msg-body').innerHTML = renderMarkdown('⚠️ 任务已中断。');
    }

    async function cancelCurrentRun() {
      const sessionId = currentSessionId;
      const run = activeRuns.get(sessionId);
      if (!run || run.cancelling) return;
      run.cancelling = true;
      updateRunStatus(sessionId, { ack: '', batch: '', elapsed: '中断发起中…' });
      updateInputState();
      try {
        await api('/api/chat/cancel', {
          method: 'POST',
          body: JSON.stringify({
            run_id: run.runId || '',
            session_id: sessionId,
          }),
        });
        showInterruptedReply(sessionId);
        if (run.pending) {
          finishRun(sessionId);
          return;
        }
        if (!run.cancelWatchdog) {
          run.cancelWatchdog = setTimeout(() => {
            if (!activeRuns.has(sessionId)) return;
            const pending = activeRuns.get(sessionId);
            if (!pending?.cancelling) return;
            pending.eventSource?.close();
            showInterruptedReply(sessionId);
            finishRun(sessionId);
          }, 5000);
        }
      } catch (err) {
        run.cancelling = false;
        updateInputState();
        alert(err.message || '中断失败');
      }
    }

    function setSidebarOpen(open) {
      sidebarOpen = open;
      localStorage.setItem('web_agent_sidebar_open', open ? '1' : '0');
      document.querySelector('.main').classList.toggle('sidebar-collapsed', !open);
      document.getElementById('btn-sidebar')?.classList.toggle('active', open);
    }

    function finishRun(sessionId) {
      const run = activeRuns.get(sessionId);
      if (run?.cancelWatchdog) {
        clearTimeout(run.cancelWatchdog);
      }
      activeRuns.delete(sessionId);
      if (sessionId === currentSessionId) updateInputState();
      loadSessions();
    }

    async function loadSessions() {
      const data = await api('/api/sessions');
      sessionsCache = data.sessions || [];
      const list = document.getElementById('session-list');
      list.innerHTML = '';
      sessionsCache.forEach(s => {
        const el = document.createElement('div');
        el.className = 'session-item' + (s.id === currentSessionId ? ' active' : '');
        el.dataset.id = s.id;
        const running = activeRuns.has(s.id) ? ' · 思考中' : '';
        const sourceBadge = s.source === 'dingtalk'
          ? '<span class="session-source">钉钉</span>'
          : '';
        const ownerLine = s.source === 'dingtalk' && s.dingtalk_owner
          ? `<span class="session-owner">归属：${escapeHtml(s.dingtalk_owner)}</span> · `
          : '';
        const previewLine = s.latest_preview
          ? `<div class="session-preview">${escapeHtml(s.latest_preview)}</div>`
          : '';
        el.innerHTML = `
          <div class="session-title">${sourceBadge}${escapeHtml(s.title)}</div>
          ${previewLine}
          <div class="session-meta">${ownerLine}${escapeHtml(s.relative_time || '')} · ${s.message_count || 0} 条${running}</div>`;
        el.addEventListener('click', () => selectSession(s.id));
        list.appendChild(el);
      });
      syncSessionReadOnly(currentSessionId);
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    async function createSession() {
      clearPendingImages();
      if (currentSessionId) {
        try {
          const data = await api(`/api/sessions/${currentSessionId}/messages`);
          if (!(data.messages || []).length) {
            await api(`/api/sessions/${currentSessionId}`, { method: 'DELETE' });
          }
        } catch { /* ignore */ }
      }
      const s = await api('/api/sessions', { method: 'POST', body: JSON.stringify({ title: '新对话' }) });
      currentSessionId = s.id;
      currentSessionReadOnly = false;
      localStorage.setItem('web_agent_session', currentSessionId);
      await loadSessions();
      updateDingtalkOwnerBar();
      updateReadOnlyState();
      await loadMessages();
      document.getElementById('input').focus();
    }

    async function selectSession(id) {
      if (id === currentSessionId) return;
      clearPendingImages();
      currentSessionId = id;
      localStorage.setItem('web_agent_session', id);
      syncSessionReadOnly(id);
      await loadSessions();
      await loadMessages();
      updateInputState();
    }

    function cursorLogoHtml() {
      return `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="24" height="24" rx="5.5" fill="#000"/>
          <path d="M5.5 9.5L12 6.5V13.5L5.5 16.5V9.5Z" fill="#F5F5F5"/>
          <path d="M12 6.5L18.5 9.5V16.5L12 13.5V6.5Z" fill="#7A7A7A"/>
          <path d="M5.5 16.5L12 13.5L18.5 16.5L12 19.5L5.5 16.5Z" fill="#424242"/>
        </svg>`;
    }

    function pickRotatingPrompts(pool, count) {
      const items = [...(pool || [])];
      const n = Math.max(1, Math.min(count || 4, items.length));
      for (let i = items.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [items[i], items[j]] = [items[j], items[i]];
      }
      return items.slice(0, n);
    }

    function showEmptyState() {
      const pool = meta.quickPrompts || [
        '查一下 Gift 模块 Stage 送礼怎么用',
        '工具平台有哪些 MOA 能力？',
        '解析 PRD 并生成测试用例',
        '用 Tunnel 抓包查某 userId 最近请求',
      ];
      const prompts = pickRotatingPrompts(pool, meta.quickPromptCount || 4);
      const container = document.getElementById('messages');
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-logo">${cursorLogoHtml()}</div>
          <h2>${escapeHtml(meta.title || 'Yaahlan 智能工具 Agent')}</h2>
          <p>${escapeHtml(meta.subtitle || '钉钉 Agent · MOA/Admin 查数 · Tunnel 抓包 · Stage 送礼 · 用例生成')}</p>
          <div class="quick-prompts">
            ${prompts.map(p => `<button type="button" data-prompt="${escapeHtml(p)}">${escapeHtml(p)}</button>`).join('')}
          </div>
        </div>`;
      container.querySelectorAll('[data-prompt]').forEach(btn => {
        btn.addEventListener('click', () => sendMessage(btn.dataset.prompt));
      });
    }

    async function loadMessages() {
      if (!currentSessionId) { showEmptyState(); return; }
      const data = await api(`/api/sessions/${currentSessionId}/messages`);
      const msgs = data.messages || [];
      const container = document.getElementById('messages');
      if (!msgs.length) { showEmptyState(); return; }
      container.innerHTML = '';
      msgs.forEach(m => appendMessage(m.role, m.content, false, m.images || []));
      if (activeRuns.has(currentSessionId)) {
        const run = activeRuns.get(currentSessionId);
        if (run?.shellEl) {
          container.appendChild(run.shellEl);
          renderRunStatusEl(run.shellEl.querySelector('.run-status'), run.status || {});
        } else {
          const typingEl = document.createElement('div');
          typingEl.className = 'typing';
          typingEl.id = 'typing-indicator';
          typingEl.textContent = run?.status?.ack || run?.status?.elapsed || 'Agent 思考中…';
          container.appendChild(typingEl);
        }
      }
      container.scrollTop = container.scrollHeight;
    }

    function userMessageLabel() {
      const item = sessionsCache.find(s => s.id === currentSessionId);
      if (item?.source === 'dingtalk' && item.dingtalk_owner) {
        return item.dingtalk_owner;
      }
      return '你';
    }

    function appendMessage(role, content, scroll = true, images = []) {
      const container = document.getElementById('messages');
      if (container.querySelector('.empty-state')) container.innerHTML = '';
      const el = document.createElement('div');
      el.className = `msg ${role}`;
      const label = role === 'user' ? userMessageLabel() : 'Agent';
      const imageHtml = role === 'user' ? renderMessageImages(images) : '';
      const text = (content || '').trim();
      const bodyHtml = role === 'assistant'
        ? renderMarkdown(text)
        : `${imageHtml}${text ? escapeHtml(text).replace(/\n/g, '<br>') : ''}`;
      el.innerHTML = `
        <div class="msg-label">${escapeHtml(label)}</div>
        <div class="msg-body">${bodyHtml || imageHtml}</div>`;
      container.appendChild(el);
      if (scroll) container.scrollTop = container.scrollHeight;
      return el;
    }

    async function sendMessage(text) {
      const message = (text || document.getElementById('input').value).trim();
      const imagesToSend = pendingImages.map(item => ({
        name: item.name,
        mime: item.mime,
        data_base64: item.data_base64,
      }));
      if ((!message && !imagesToSend.length) || isCurrentSessionStreaming() || currentSessionReadOnly) return;

      if (!currentSessionId) await createSession();

      const sessionId = currentSessionId;
      const previewImages = pendingImages.map(item => item.previewUrl);
      document.getElementById('input').value = '';
      autoResizeInput();
      clearPendingImages();
      appendMessage('user', message, true, previewImages);
      activeRuns.set(sessionId, {
        pending: true,
        eventSource: null,
        runId: '',
        cancelling: false,
        status: { ack: '', batch: '', elapsed: '' },
        shellEl: null,
      });
      updateInputState();

      let assistantEl = null;

      try {
        const { run_id } = await api('/api/chat', {
          method: 'POST',
          body: JSON.stringify({
            session_id: sessionId,
            message,
            images: imagesToSend,
          }),
        });

        const existing = activeRuns.get(sessionId);
        if (!existing || existing.cancelling) {
          return;
        }

        await new Promise((resolve, reject) => {
          const es = new EventSource(`${API}/api/chat/stream/${run_id}`);
          activeRuns.set(sessionId, {
            pending: false,
            eventSource: es,
            runId: run_id,
            cancelling: existing.cancelling,
            status: existing.status,
            shellEl: existing.shellEl,
          });
          updateInputState();
          loadSessions();

          const isViewing = () => currentSessionId === sessionId;

          es.onmessage = (ev) => {
            const data = JSON.parse(ev.data);
            if (data.type === 'ack') {
              updateRunStatus(sessionId, { ack: data.line || '' });
            } else if (data.type === 'status') {
              updateRunStatus(sessionId, {
                elapsed: data.elapsed_line || '',
                batch: data.batch_line || '',
              });
            } else if (data.type === 'delta') {
              if (!isViewing()) return;
              if (!assistantEl) {
                assistantEl = ensureStreamingShell(sessionId);
                activeRuns.get(sessionId).shellEl = assistantEl;
              }
              assistantEl.querySelector('.msg-body').innerHTML = renderMarkdown(data.markdown || '');
              document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
            } else if (data.type === 'done') {
              if (activeRuns.get(sessionId)?.cancelWatchdog) {
                clearTimeout(activeRuns.get(sessionId).cancelWatchdog);
              }
              if (isViewing()) {
                if (!assistantEl) {
                  assistantEl = ensureStreamingShell(sessionId);
                  activeRuns.get(sessionId).shellEl = assistantEl;
                }
                clearRunStatus(sessionId);
                if (data.text) {
                  assistantEl.querySelector('.msg-body').innerHTML = renderMarkdown(data.text);
                } else if (!assistantEl.querySelector('.msg-body').innerHTML.trim()) {
                  assistantEl.querySelector('.msg-body').innerHTML = renderMarkdown('（无回复）');
                }
              }
              es.close();
              resolve();
            } else if (data.type === 'error') {
              if (isViewing()) {
                if (!assistantEl) {
                  assistantEl = ensureStreamingShell(sessionId);
                  activeRuns.get(sessionId).shellEl = assistantEl;
                }
                clearRunStatus(sessionId);
                const text = data.text || `⚠️ ${data.message || 'Agent 执行失败'}`;
                assistantEl.querySelector('.msg-body').innerHTML = renderMarkdown(text);
              }
              es.close();
              resolve();
            }
          };
          es.onerror = () => {
            es.close();
            reject(new Error('流式连接中断'));
          };
        });
      } catch (err) {
        if (currentSessionId === sessionId) {
          document.getElementById('typing-indicator')?.remove();
          const run = activeRuns.get(sessionId);
          if (run?.shellEl) {
            clearRunStatus(sessionId);
            run.shellEl.querySelector('.msg-body').innerHTML = renderMarkdown(`⚠️ ${err.message}`);
          } else {
            appendMessage('assistant', `⚠️ ${err.message}`);
          }
        }
      } finally {
        const run = activeRuns.get(sessionId);
        if (!run) return;
        if (run.eventSource) run.eventSource.close();
        finishRun(sessionId);
      }
    }

    function autoResizeInput() {
      const ta = document.getElementById('input');
      ta.style.height = 'auto';
      ta.style.height = Math.min(ta.scrollHeight, 160) + 'px';
    }

    document.getElementById('input').addEventListener('input', () => {
      autoResizeInput();
      updateInputState();
    });
    document.getElementById('input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    document.getElementById('btn-send').addEventListener('click', () => sendMessage());
    document.getElementById('btn-stop').addEventListener('click', () => cancelCurrentRun());
    document.getElementById('btn-new').addEventListener('click', createSession);
    document.getElementById('btn-new-side').addEventListener('click', createSession);
    document.getElementById('btn-sidebar-close').addEventListener('click', () => setSidebarOpen(false));
    document.getElementById('btn-sidebar').addEventListener('click', () => setSidebarOpen(!sidebarOpen));
    document.getElementById('btn-clear').addEventListener('click', async () => {
      if (isCurrentSessionStreaming() || currentSessionReadOnly) return;
      if (currentSessionId && confirm('清空当前会话消息？')) {
        await api(`/api/sessions/${currentSessionId}`, { method: 'DELETE' });
        await createSession();
      }
    });
    document.getElementById('btn-about').addEventListener('click', () => {
      document.getElementById('about-modal').classList.add('open');
    });
    document.getElementById('btn-about-close').addEventListener('click', () => {
      document.getElementById('about-modal').classList.remove('open');
    });

    function setCatalogOpen(open) {
      catalogOpen = open;
      localStorage.setItem('web_agent_catalog_open', open ? '1' : '0');
      document.getElementById('catalog-panel').classList.toggle('open', open);
      document.querySelector('.main').classList.toggle('catalog-open', open);
      document.getElementById('btn-catalog').classList.toggle('active', open);
    }

    function initSidebarResize() {
      const root = document.documentElement;
      const SIDEBAR_KEY = 'web_agent_sidebar_width';
      const MIN = 180;
      const MAX = 480;
      const DEFAULT = 240;

      function clamp(n, min, max) { return Math.min(max, Math.max(min, n)); }

      function applySidebarWidth(w) {
        const width = clamp(w, MIN, MAX);
        root.style.setProperty('--sidebar-width', width + 'px');
        localStorage.setItem(SIDEBAR_KEY, String(width));
        return width;
      }

      applySidebarWidth(Number(localStorage.getItem(SIDEBAR_KEY)) || DEFAULT);

      const handle = document.getElementById('sidebar-resizer');
      if (!handle) return;
      handle.addEventListener('mousedown', (e) => {
        e.preventDefault();
        const startX = e.clientX;
        const startWidth = parseInt(getComputedStyle(root).getPropertyValue('--sidebar-width'), 10) || DEFAULT;
        document.body.classList.add('is-resizing');

        function onMove(ev) {
          applySidebarWidth(startWidth + (ev.clientX - startX));
        }
        function onUp() {
          document.body.classList.remove('is-resizing');
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    }

    function initCatalogResize() {
      const root = document.documentElement;
      const nav = document.getElementById('catalog-nav');
      const PANEL_KEY = 'web_agent_catalog_width';
      const NAV_KEY = 'web_agent_catalog_nav_width';
      const MIN_PANEL = 280;
      const MAX_PANEL = 560;
      const MIN_NAV = 88;
      const MAX_NAV = 200;
      const DEFAULT_PANEL = 380;
      const DEFAULT_NAV = 112;

      function clamp(n, min, max) { return Math.min(max, Math.max(min, n)); }

      function applyPanelWidth(w) {
        const width = clamp(w, MIN_PANEL, MAX_PANEL);
        root.style.setProperty('--catalog-width', width + 'px');
        localStorage.setItem(PANEL_KEY, String(width));
        return width;
      }

      function applyNavWidth(w) {
        const width = clamp(w, MIN_NAV, MAX_NAV);
        root.style.setProperty('--catalog-nav-width', width + 'px');
        if (nav) nav.style.width = width + 'px';
        localStorage.setItem(NAV_KEY, String(width));
        return width;
      }

      applyPanelWidth(Number(localStorage.getItem(PANEL_KEY)) || DEFAULT_PANEL);
      applyNavWidth(Number(localStorage.getItem(NAV_KEY)) || DEFAULT_NAV);

      function bindHorizontalDrag(handle, getStartWidth, setWidth, invertDelta) {
        if (!handle) return;
        handle.addEventListener('mousedown', (e) => {
          e.preventDefault();
          const startX = e.clientX;
          const startWidth = getStartWidth();
          document.body.classList.add('is-resizing');

          function onMove(ev) {
            const delta = ev.clientX - startX;
            setWidth(startWidth + (invertDelta ? -delta : delta));
          }
          function onUp() {
            document.body.classList.remove('is-resizing');
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
          }
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
        });
      }

      bindHorizontalDrag(
        document.getElementById('catalog-panel-resizer'),
        () => parseInt(getComputedStyle(root).getPropertyValue('--catalog-width'), 10) || DEFAULT_PANEL,
        applyPanelWidth,
        true
      );
      bindHorizontalDrag(
        document.getElementById('catalog-nav-resizer'),
        () => parseInt(getComputedStyle(root).getPropertyValue('--catalog-nav-width'), 10) || DEFAULT_NAV,
        applyNavWidth,
        false
      );
    }

    async function initCatalogPanel() {
      catalogPanel = new CatalogPanel({
        root: document.getElementById('catalog-panel'),
        metaEl: document.getElementById('catalog-meta'),
        searchEl: document.getElementById('catalog-search'),
        navEl: document.getElementById('catalog-nav'),
        mainEl: document.getElementById('catalog-main'),
        onRunPrompt: (text) => {
          if (!text) return;
          const input = document.getElementById('input');
          input.value = text;
          autoResizeInput();
          input.focus();
        },
      });
      await catalogPanel.init(() => api('/api/catalog'));
    }

    document.getElementById('btn-catalog').addEventListener('click', () => setCatalogOpen(!catalogOpen));
    document.getElementById('btn-catalog-close').addEventListener('click', () => setCatalogOpen(false));

    let sessionPollTimer = null;
    function startSessionPolling() {
      if (sessionPollTimer) return;
      sessionPollTimer = setInterval(async () => {
        if (document.hidden) return;
        const viewingId = currentSessionId;
        const wasDingtalk = currentSessionReadOnly;
        try {
          await loadSessions();
          if (viewingId && (wasDingtalk || activeRuns.has(viewingId)) && currentSessionId === viewingId) {
            await loadMessages();
          }
        } catch { /* ignore poll errors */ }
      }, 15000);
    }

    (async () => {
      try {
        setupInputImageHandlers();
        await loadMeta();
        initSidebarResize();
        initCatalogResize();
        setSidebarOpen(sidebarOpen);
        await initCatalogPanel();
        setCatalogOpen(catalogOpen);
        await loadSessions();
        if (currentSessionId) {
          try {
            await api(`/api/sessions/${currentSessionId}/messages`);
            await loadMessages();
          } catch {
            currentSessionId = '';
            localStorage.removeItem('web_agent_session');
            showEmptyState();
          }
        } else {
          showEmptyState();
        }
        startSessionPolling();
      } catch (err) {
        document.getElementById('messages').innerHTML =
          `<div class="empty-state"><p>无法连接 Web Agent 服务：${escapeHtml(err.message)}</p>
           <p style="margin-top:12px;font-size:0.82rem">请运行：python3 platform/web_agent/open_web_agent.py</p></div>`;
      }
    })();
  </script>
