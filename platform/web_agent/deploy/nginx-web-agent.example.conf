# Nginx 反向代理示例：将 Web Agent 挂到公司域名（HTTPS + 可选 Nginx 层鉴权）
#
# 1. 本机/内网运行：python3 platform/web_agent/server.py --ensure
# 2. 复制为 /etc/nginx/sites-available/web-agent.conf 并按环境修改
# 3. SSE 须关闭缓冲：proxy_buffering off

upstream web_agent_backend {
    server 127.0.0.1:18766;
    keepalive 8;
}

server {
    listen 443 ssl http2;
    server_name web-agent.example.com;

    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://web_agent_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / 流式输出
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# 应用层鉴权由 Web Agent 自身 WEB_AGENT_AUTH_* 提供；
# 也可在此增加 auth_basic 双重保护。
