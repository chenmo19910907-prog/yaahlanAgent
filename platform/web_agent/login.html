<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 · Yaahlan 智能工具 Agent</title>
  <script src="theme.js"></script>
  <script>WebAgentTheme.applyThemeEarly();</script>
  <style>
    :root,
    [data-theme="dark"] {
      --bg: #0b0e14;
      --panel: rgba(20, 24, 33, 0.92);
      --border: rgba(148, 163, 184, 0.18);
      --text: #f2f5fa;
      --muted: #a4adbd;
      --accent: #5b8cff;
      --accent-hover: #4a78e8;
      --accent-soft: rgba(91, 140, 255, 0.16);
      --success: #22c55e;
      --danger: #ef4444;
      --input-bg: rgba(255, 255, 255, 0.04);
      --phrase-bg: rgba(255, 255, 255, 0.04);
      --card-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
      --body-bg:
        linear-gradient(135deg, rgba(91, 140, 255, 0.18) 0%, transparent 42%),
        linear-gradient(225deg, rgba(66, 211, 178, 0.13) 0%, transparent 46%),
        linear-gradient(180deg, #0b0e14 0%, #101522 46%, #090b10 100%);
      --oauth-bg: rgba(91, 140, 255, 0.08);
      --oauth-border: rgba(91, 140, 255, 0.22);
      --success-bg: rgba(34, 197, 94, 0.08);
      --success-border: rgba(34, 197, 94, 0.28);
      --copy-hover-bg: rgba(91, 140, 255, 0.24);
      --copied-bg: rgba(34, 197, 94, 0.12);
      --placeholder-color: #98a2b4;
    }
    [data-theme="light"] {
      --bg: #eef2f8;
      --panel: rgba(255, 255, 255, 0.96);
      --border: rgba(15, 23, 42, 0.12);
      --text: #0f172a;
      --muted: #64748b;
      --accent: #3b6ff5;
      --accent-hover: #2f5fe0;
      --accent-soft: rgba(59, 111, 245, 0.12);
      --success: #16a34a;
      --danger: #dc2626;
      --input-bg: #f8fafc;
      --phrase-bg: #f1f5f9;
      --card-shadow: 0 20px 48px rgba(15, 23, 42, 0.1);
      --body-bg:
        linear-gradient(135deg, rgba(59, 111, 245, 0.12) 0%, transparent 44%),
        linear-gradient(225deg, rgba(13, 148, 136, 0.1) 0%, transparent 48%),
        linear-gradient(180deg, #eef2f8 0%, #f8fafc 52%, #e9eef5 100%);
      --oauth-bg: rgba(59, 111, 245, 0.08);
      --oauth-border: rgba(59, 111, 245, 0.22);
      --success-bg: rgba(22, 163, 74, 0.08);
      --success-border: rgba(22, 163, 74, 0.24);
      --copy-hover-bg: rgba(59, 111, 245, 0.18);
      --copied-bg: rgba(22, 163, 74, 0.12);
      --placeholder-color: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: var(--body-bg);
    }
    .card {
      width: min(480px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 28px 24px;
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(12px);
    }
    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
    }
    .card-header-text {
      flex: 1;
      min-width: 0;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 650;
      margin-bottom: 8px;
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.55;
      margin-bottom: 0;
    }
    .theme-quick-btn {
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--phrase-bg);
      color: var(--muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease, transform 0.15s ease;
    }
    .theme-quick-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      flex-shrink: 0;
    }
    .theme-quick-btn:hover {
      border-color: rgba(91, 140, 255, 0.55);
      color: var(--accent);
      background: var(--accent-soft);
      transform: translateY(-1px);
    }
    .theme-quick-btn:active { transform: scale(0.98); }
    .theme-quick-btn.is-light {
      color: #d97706;
      border-color: rgba(217, 119, 6, 0.28);
      background: rgba(251, 191, 36, 0.12);
    }
    .theme-quick-btn.is-light:hover {
      color: #b45309;
      background: rgba(251, 191, 36, 0.2);
    }
    .theme-quick-btn.is-light .bulb-glass {
      fill: rgba(251, 191, 36, 0.35);
    }
    [data-theme="light"] .theme-quick-btn {
      background: rgba(15, 23, 42, 0.04);
    }
    [data-theme="light"] .theme-quick-btn.is-light {
      background: rgba(251, 191, 36, 0.14);
    }
    .oauth-status {
      display: none;
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--oauth-bg);
      border: 1px solid var(--oauth-border);
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.55;
      margin-bottom: 18px;
    }
    .oauth-status.show { display: block; }
    .oauth-status.success {
      color: var(--success);
      border-color: var(--success-border);
      background: var(--success-bg);
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0;
      color: var(--muted);
      font-size: 0.82rem;
    }
    .divider.hidden { display: none; }
    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .otp-section { display: block; }
    .otp-section.hidden { display: none; }
    .step {
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.55;
      margin-bottom: 10px;
      overflow-wrap: anywhere;
      word-break: break-word;
      max-width: 100%;
    }
    .phrase-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 22px;
    }
    .phrase-box {
      min-width: 0;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--phrase-bg);
      border: 1px solid var(--border);
      font-size: 0.86rem;
      line-height: 1.45;
      white-space: nowrap;
      overflow-x: auto;
      color: var(--text);
    }
    .copy-btn {
      flex: 0 0 auto;
      padding: 10px 14px;
      border: none;
      border-radius: 12px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
    }
    .copy-btn:hover { background: var(--copy-hover-bg); }
    .copy-btn:active { transform: scale(0.98); }
    .copy-btn.copied { color: var(--success); background: var(--copied-bg); }
    .code-input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 1.35rem;
      letter-spacing: 0.35em;
      text-align: center;
      outline: none;
    }
    .code-input::placeholder { color: var(--placeholder-color); opacity: 1; }
    .code-input:focus {
      border-color: rgba(91, 140, 255, 0.55);
      box-shadow: 0 0 0 3px rgba(91, 140, 255, 0.15);
    }
    .login-btn {
      width: 100%;
      margin-top: 16px;
      padding: 13px 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      color: #fff;
      font-size: 0.95rem;
      font-weight: 650;
      cursor: pointer;
    }
    .login-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .hint, .error {
      margin-top: 14px;
      font-size: 0.84rem;
      line-height: 1.55;
    }
    .hint { color: var(--muted); }
    .error { color: var(--danger); display: none; }
    .error.show { display: block; }
    @media (max-width: 420px) {
      body { padding: 16px; }
      .card { padding: 20px 16px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <div class="card-header-text">
        <h1>Yaahlan 智能工具 Agent</h1>
        <p class="subtitle" id="subtitle">网页版可通过钉钉机器人验证码登录；在钉钉内打开时将优先尝试自动登录。</p>
      </div>
      <button type="button" class="theme-quick-btn is-dark" id="btn-theme-toggle" title="切换到白天模式" aria-label="切换白天/夜间模式">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true">
          <path d="M9 18h6"/>
          <path d="M10 22h4"/>
          <path class="bulb-glass" d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>
        </svg>
      </button>
    </div>

    <div class="oauth-status" id="oauthStatus">正在通过钉钉验证身份…</div>

    <div class="divider hidden" id="otpDivider">或使用验证码登录</div>

    <div class="otp-section" id="otpSection">
      <p class="step">1. 复制下方文案，发送给【智能工具人yaahlan】或【群内@智能工具人yaahlan】，加群请联系【陈墨】</p>
      <div class="phrase-row">
        <div class="phrase-box" id="loginPhrase">请求访问Yaahlan 智能工具 Agent</div>
        <button type="button" class="copy-btn" id="copyBtn">复制</button>
      </div>

      <p class="step">2. 在钉钉私聊中查收 8 位验证码，输入后登录</p>
      <input id="codeInput" class="code-input" type="text" inputmode="numeric" maxlength="8"
             autocomplete="one-time-code" placeholder="········" />
      <button type="button" class="login-btn" id="loginBtn">登录</button>

      <p class="hint">重新向机器人发送上述文案会更新验证码，并使此前网页登录失效。</p>
    </div>

    <p class="error" id="errorBox"></p>
  </div>

  <script src="https://g.alicdn.com/dingding/dingtalk-jsapi/3.0.25/dingtalk.open.js"></script>
  <script src="dingtalk_oauth.js"></script>
  <script>
    const phraseEl = document.getElementById('loginPhrase');
    const copyBtn = document.getElementById('copyBtn');
    const codeInput = document.getElementById('codeInput');
    const loginBtn = document.getElementById('loginBtn');
    const errorBox = document.getElementById('errorBox');
    const oauthStatus = document.getElementById('oauthStatus');
    const otpSection = document.getElementById('otpSection');
    const otpDivider = document.getElementById('otpDivider');
    const subtitleEl = document.getElementById('subtitle');
    let oauthConfig = { enabled: false, clientId: '', corpId: '' };

    function initThemeSettings() {
      WebAgentTheme.initThemeSettings();
    }

    function showOtpFallback() {
      otpSection.classList.remove('hidden');
      otpDivider.classList.remove('hidden');
      oauthStatus.classList.remove('show');
      subtitleEl.textContent = '网页版可通过钉钉机器人验证码登录；在钉钉内打开时将优先尝试自动登录。';
    }

    function hideOtpForOAuth() {
      otpSection.classList.add('hidden');
      otpDivider.classList.add('hidden');
    }

    function oauthClientReady() {
      return typeof DingtalkOAuth !== 'undefined'
        && typeof DingtalkOAuth.isLikelyDingTalkClient === 'function';
    }

    function showOauthMessage(text, kind) {
      oauthStatus.textContent = text;
      oauthStatus.classList.add('show');
      oauthStatus.classList.toggle('success', kind === 'success');
    }

    function renderLoginPhrase(text) {
      const t = (text || '').trim();
      phraseEl.textContent = t;
      return t;
    }

    function getPhrasePlainText() {
      return phraseEl.textContent.replace(/\s+/g, ' ').trim();
    }

    async function tryDingTalkOAuth() {
      if (!oauthConfig.enabled) return false;
      if (!oauthClientReady() && !window.dd) return false;
      hideOtpForOAuth();
      showOauthMessage('正在通过钉钉验证身份…');
      try {
        const ok = oauthClientReady()
          ? await DingtalkOAuth.tryDingTalkOAuthLogin(oauthConfig)
          : false;
        if (!ok) {
          showOtpFallback();
          return false;
        }
        showOauthMessage('登录成功，正在进入…', 'success');
        window.location.replace('/');
        return true;
      } catch (err) {
        showOauthMessage('钉钉自动登录失败，请使用下方验证码登录');
        showOtpFallback();
        showError(err.message || '钉钉登录失败');
        return false;
      }
    }

    async function bootstrap() {
      try {
        const res = await fetch('/api/auth/status');
        const data = await res.json();
        if (data.loggedIn) {
          window.location.replace('/');
          return;
        }
        if (data.loginPhrase) {
          renderLoginPhrase(data.loginPhrase);
        }
        oauthConfig = data.dingtalkOAuth || oauthConfig;
        if (oauthConfig.enabled && oauthClientReady() && DingtalkOAuth.isLikelyDingTalkClient()) {
          subtitleEl.textContent = '检测到钉钉客户端，正在尝试免登…';
          const ok = await tryDingTalkOAuth();
          if (ok) return;
        }
        showOtpFallback();
      } catch (_) {
        showOtpFallback();
      }
    }

    copyBtn.addEventListener('click', async () => {
      const text = getPhrasePlainText();
      try {
        await navigator.clipboard.writeText(text);
      } catch (_) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      copyBtn.textContent = '已复制';
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.textContent = '复制';
        copyBtn.classList.remove('copied');
      }, 1800);
    });

    function showError(msg) {
      errorBox.textContent = msg || '登录失败';
      errorBox.classList.add('show');
    }

    async function doLogin() {
      const code = codeInput.value.replace(/\D/g, '').slice(0, 8);
      codeInput.value = code;
      if (code.length !== 8) {
        showError('请输入 8 位数字验证码');
        return;
      }
      errorBox.classList.remove('show');
      loginBtn.disabled = true;
      loginBtn.textContent = '登录中…';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code }),
        });
        const data = await res.json();
        if (!res.ok) {
          showError(data.error || '登录失败');
          return;
        }
        window.location.replace('/');
      } catch (err) {
        showError(err.message || '无法连接服务');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = '登录';
      }
    }

    loginBtn.addEventListener('click', doLogin);
    codeInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doLogin();
    });
    codeInput.addEventListener('input', () => {
      codeInput.value = codeInput.value.replace(/\D/g, '').slice(0, 8);
      errorBox.classList.remove('show');
    });

    showOtpFallback();
    try {
      if (typeof initThemeSettings === 'function') initThemeSettings();
    } catch (_) { /* theme.js 未加载时不阻断验证码登录 */ }
    bootstrap();
  </script>
</body>
</html>
