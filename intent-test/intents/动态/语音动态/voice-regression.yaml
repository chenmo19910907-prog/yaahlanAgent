---
id: IT-MOM-VOICE-PUB-056
name: "[回归] 动态删除功能正常"
module: 语音动态-回归
platform: android
priority: P1
tags: [动态, 回归, 删除]
preconditions: 用户已发布语音动态

setup:
  launchApp: true
  steps:
    - tap: [0.90, 0.96]
      afterSleep: 1500
    - act: 进入我的动态页
    - waitFor: 可见已发布的语音动态

intent:
  action: 点击语音动态的更多按钮，选择删除
  expected:
    - 弹出二次确认弹窗
    - 确认删除后动态从列表消失

timeoutMs: 180000

