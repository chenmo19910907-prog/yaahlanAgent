---
id: IT-MOM-VOICE-PUB-051
name: "[回归] 纯文字动态发布不受影响"
module: 语音动态-回归
platform: android
priority: P0
tags: [动态, 回归, 文字发布]

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
    - moments-navigation/open_moment_publish_editor
  steps:
    - act: 输入一段纯文字（regression test text only）
    - waitFor: 文字已展示，发布按钮可点击

intent:
  action: 不添加任何语音/图片/视频，直接点击发布
  expected:
    - 纯文字动态发布成功
    - 跳转我的动态页可见刚发布内容

timeoutMs: 240000

