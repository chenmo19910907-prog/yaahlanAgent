id: IT-MOM-VOICE-PUB-033
name: 语音条+好友可见权限发布
module: 语音动态-发布
platform: android
priority: P1
tags: [动态, 语音, 好友可见, 权限]

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
    - moments-navigation/open_moment_publish_editor
  steps:
