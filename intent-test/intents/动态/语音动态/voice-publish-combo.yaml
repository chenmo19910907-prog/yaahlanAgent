    - waitFor: 编辑页可见语音条
    - act: 点击添加语音房入口，选择一个语音房
    - waitFor: 编辑页可见语音条和语音房card

intent:
  action: 点击右上角发布按钮
  expected:
    - 发布成功
    - 动态中可见语音条和语音房card

timeoutMs: 300000

