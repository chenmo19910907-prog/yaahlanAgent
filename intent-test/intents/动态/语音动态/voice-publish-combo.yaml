---
id: IT-MOM-VOICE-PUB-028
name: 纯语音条动态发布成功
module: 语音动态-发布
platform: android
priority: P0
tags: [动态, 语音, 发布, 纯语音]

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
    - moments-navigation/open_moment_publish_editor
  steps:
    - act: 不输入文字，不上传图片/视频，仅录制约5秒语音并点击使用
    - waitFor: 编辑页仅有语音条

intent:
  action: 点击右上角发布按钮
  expected:
    - 发布成功，跳转我的动态页

verify:
  include:
    - moments-verify/verify_voice_publish_and_visible

timeoutMs: 300000

---
id: IT-MOM-VOICE-PUB-029
name: 文字+语音条组合发布成功
module: 语音动态-发布
platform: android
priority: P0
tags: [动态, 语音, 文字, 组合发布]

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
    - moments-navigation/open_moment_publish_editor
  steps:
    - act: 输入测试文案（voice text combo test）
    - waitFor: 文字输入区展示内容
    - act: 点击语音录制入口，录制约3秒后暂停，点击使用
    - waitFor: 编辑页可见文字和语音条

intent:
  action: 点击右上角发布按钮
  expected:
    - 发布成功，跳转我的动态页

verify:
  include:
    - moments-verify/verify_voice_publish_and_visible

timeoutMs: 300000

---
id: IT-MOM-VOICE-PUB-030
name: 图片+语音条组合发布成功
module: 语音动态-发布
platform: android
priority: P0
tags: [动态, 语音, 图片, 组合发布]

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
    - moments-navigation/open_moment_publish_editor
  steps:
    - act: 点击添加图片入口，从相册选择一张图片
    - waitFor: 编辑页展示图片缩略图
    - act: 点击语音录制入口，录制约3秒后暂停，点击使用
    - waitFor: 编辑页可见图片和语音条

intent:
  action: 点击右上角发布按钮
  expected:
    - 发布成功，跳转我的动态页
    - 我的动态中可见图片和语音条

timeoutMs: 300000

---
id: IT-MOM-VOICE-PUB-031
name: 视频+语音条组合发布成功
module: 语音动态-发布
platform: android
priority: P0
tags: [动态, 语音, 视频, 组合发布]

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
    - moments-navigation/open_moment_publish_editor
  steps:
    - act: 点击添加媒体入口，从相册选择一个2-60秒的视频
    - waitFor: 编辑页展示视频预览图
    - act: 点击语音录制入口，录制约3秒后暂停，点击使用
    - waitFor: 编辑页可见视频预览和语音条

intent:
  action: 点击右上角发布按钮
  expected:
    - 发布成功，跳转我的动态页

verify:
  include:
    - moments-verify/verify_voice_publish_and_visible

timeoutMs: 360000

