id: IT-MOM-VOICE-PUB-032
name: 文字+视频+语音条三者组合发布
module: 语音动态-发布
platform: android
priority: P1
tags: [动态, 语音, 视频, 文字, 全组合]

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
    - moments-navigation/open_moment_publish_editor
  steps:
    - act: 输入测试文案
    - waitFor: 文字展示
    - act: 从相册选择一个视频
    - waitFor: 视频预览图展示
    - act: 点击语音录制入口，录制约3秒后暂停，点击使用
    - waitFor: 编辑页同时展示文字、视频、语音条

intent:
  action: 点击右上角发布按钮
  expected:
    - 发布成功，跳转我的动态页
    - 三种内容均可见

timeoutMs: 360000

