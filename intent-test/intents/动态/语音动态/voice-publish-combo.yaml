    - waitFor: 编辑页可见语音条
    - act: 开启好友可见按钮，确认弹窗点击确认
    - waitFor: 好友可见状态已开启

intent:
  action: 点击右上角发布按钮
  expected:
    - 发布成功
    - 动态为好友可见状态

timeoutMs: 300000

