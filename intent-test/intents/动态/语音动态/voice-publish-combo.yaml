id: IT-MOM-VOICE-PUB-034
name: 语音条+语音房card组合发布
module: 语音动态-发布
platform: android
priority: P1
tags: [动态, 语音, 语音房card, 组合]
preconditions: 用户有可选的语音房（创建/管理/成员房间）

