---
id: IT-ME-VOICE-001
name: 个人主页编辑页展示语音条设置入口
module: 个人主页语音条-设置
platform: android
priority: P0
tags: [个人主页, 语音, 设置入口]

setup:
  launchApp: true
  include:
    - base-navigation/enter_profile_edit_page

intent:
  action: 观察编辑页中是否有个人主页语音条设置栏
  expected:
    - 编辑页展示语音条设置入口
    - 未设置时显示录制按钮

timeoutMs: 120000

---
id: IT-ME-VOICE-002
name: 点击语音条入口打开录制弹窗
module: 个人主页语音条-录制
platform: android
priority: P0
tags: [个人主页, 语音, 录制入口]

setup:
  launchApp: true
  include:
    - base-navigation/enter_profile_edit_page

intent:
  action: 点击个人主页语音条设置栏中的录制按钮
  expected:
    - 弹出底部半屏录制弹窗
    - 弹窗中央可见大圆形紫色录制按钮

timeoutMs: 120000

---
id: IT-ME-VOICE-003
name: 录制语音后点击使用设置主页语音条
module: 个人主页语音条-录制
platform: android
priority: P0
tags: [个人主页, 语音, 录制, 设置]

setup:
  launchApp: true
  include:
    - base-navigation/enter_profile_edit_page
  steps:
    - act: 点击语音条录制入口
    - waitFor: 出现底部录制弹窗，可见大圆形录制按钮

intent:
  action: 录制约5秒后暂停，点击使用
  expected:
    - 录制弹窗关闭
    - 编辑页语音条设置栏显示已录制的语音条
    - 语音条可见播放按钮和删除按钮

timeoutMs: 240000

---
id: IT-ME-VOICE-004
name: 已有语音条时替换弹出二次确认
module: 个人主页语音条-替换
platform: android
priority: P0
tags: [个人主页, 语音, 替换, 确认弹窗]
preconditions: 用户已设置过个人主页语音条

setup:
  launchApp: true
  include:
    - base-navigation/enter_profile_edit_page
  steps:
    - waitFor: 编辑页展示已有的语音条
    - act: 点击录制入口开始新录制
    - waitFor: 录制弹窗出现
    - act: 录制约3秒后暂停
    - waitFor: 出现语音条、重录按钮、使用按钮

intent:
  action: 点击使用按钮
  expected:
    - 弹出二次确认弹窗，提示将替换上条语音
    - 需要用户确认后才执行替换

timeoutMs: 240000

---
id: IT-ME-VOICE-005
name: 确认替换后新语音条生效
module: 个人主页语音条-替换
platform: android
priority: P0
tags: [个人主页, 语音, 替换, 确认]
preconditions: 用户已设置过个人主页语音条

setup:
  launchApp: true
  include:
    - base-navigation/enter_profile_edit_page
  steps:
    - waitFor: 编辑页展示已有语音条
    - act: 录制新的约5秒语音后暂停，点击使用
    - waitFor: 弹出替换确认弹窗

intent:
  action: 点击确认按钮
  expected:
    - 旧语音条被新语音条替换
    - 编辑页显示新的语音条时长（约5秒）

timeoutMs: 240000

---
id: IT-ME-VOICE-006
name: 仅录制未点使用直接返回不替换
module: 个人主页语音条-替换
platform: android
priority: P0
tags: [个人主页, 语音, 不替换, 返回]
preconditions: 用户已设置过个人主页语音条

setup:
  launchApp: true
  include:
    - base-navigation/enter_profile_edit_page
  steps:
    - waitFor: 编辑页展示已有语音条
    - act: 点击录制入口
    - waitFor: 录制弹窗出现
    - act: 录制约3秒后暂停
    - waitFor: 出现语音条、重录按钮、使用按钮

intent:
  action: 不点击使用，直接点击返回关闭弹窗（确认弹窗选择放弃）
  expected:
    - 录制弹窗关闭
    - 原有语音条保持不变，未被替换

timeoutMs: 240000

