id: IT-MOM-VOICE-PUB-024
name: 删除语音条后可重新录制添加
module: 语音动态-编辑页
platform: android
priority: P1
tags: [动态, 语音, 编辑, 删除后重录]

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
    - moments-navigation/open_moment_publish_editor
  steps:
    - act: 录制约3秒后暂停，点击使用
    - waitFor: 编辑页可见语音条
    - act: 点击删除按钮，确认删除
    - waitFor: 语音条消失，录制入口恢复

intent:
  action: 再次点击录制入口，录制新的约5秒音频后暂停，点击使用
  expected:
    - 新语音条正常添加到编辑页
    - 显示新的时长（约5秒）

timeoutMs: 240000

