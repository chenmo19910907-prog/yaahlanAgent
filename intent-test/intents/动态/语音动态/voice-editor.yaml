---
id: IT-MOM-VOICE-PUB-018
name: 编辑页语音条展示秒数和播放删除按钮
module: 语音动态-编辑页
platform: android
priority: P0
tags: [动态, 语音, 编辑, 展示]

setup:
  launchApp: true
  skipPopupDismiss: true
  include:
    - moments-navigation/enter_moment_discover_tab
    - moments-navigation/open_moment_publish_editor
  steps:
    - act: 点击 "+ Add Voice" 按钮，录制约5秒后点击停止，点击 "Use"
    - waitFor: 返回编辑页

intent:
  action: 观察编辑页中 "+ Add Voice" 区域变化后的语音条内容
  expected:
    - 语音条位于文字输入区下方，呈横条形状
    - 语音条左侧可见播放按钮图标
    - 语音条中部展示声波可视化图案
    - 语音条显示录制时长（约 "5s"）
    - 语音条附近可见删除按钮（X 图标）

timeoutMs: 120000

