---
id: IT-MOM-VOICE-PUB-035
name: 发现页语音动态展示语音条区域
module: 语音动态-浏览
platform: android
priority: P0
tags: [动态, 语音, 发现页, 展示]
preconditions: 发现页存在带语音条的动态

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
  steps:
    - waitFor: 发现列表已加载

intent:
  action: 找到一条带语音条的动态，观察语音条展示位置和样式
  expected:
    - 语音条显示在动态文字内容下方、图片上方
    - 语音条呈横条形，左侧有播放按钮，中部有波形图案，右侧有时长数字
    - 语音条样式与编辑页一致（深色背景横条）

timeoutMs: 120000

