id: IT-MOM-VOICE-PUB-043
name: 语音房内点击播放 toast 不可播放
module: 语音动态-浏览
platform: android
priority: P0
tags: [动态, 语音, 浏览, 冲突, 语音房]
preconditions: 用户当前在语音房内

setup:
  launchApp: false
  include:
    - moments-navigation/enter_moment_discover_tab
  steps:
    - waitFor: 发现列表可见带语音条的动态

intent:
  action: 点击语音条的播放按钮
  expected:
    - 弹出 toast 提示当前在语音房内无法播放
    - 语音未开始播放

timeoutMs: 120000

---
id: IT-MOM-VOICE-PUB-044
name: 我的动态页语音条展示与播放
module: 语音动态-浏览
platform: android
priority: P1
tags: [动态, 语音, 我的动态, 播放]
preconditions: 用户已发布过语音动态

setup:
  launchApp: true
  steps:
    - tap: [0.90, 0.96]
      afterSleep: 1500
    - act: 进入我的动态列表
    - waitFor: 我的动态列表可见语音动态

intent:
  action: 点击语音条播放按钮
  expected:
    - 语音正常播放
    - 播放暂停切换正常

timeoutMs: 120000

