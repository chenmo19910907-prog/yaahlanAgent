id: IT-MOM-VOICE-PUB-036
name: 发现页点击播放语音条
module: 语音动态-浏览
platform: android
priority: P0
tags: [动态, 语音, 发现页, 播放]
preconditions: 发现页存在带语音条的动态

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
  steps:
    - waitFor: 发现列表可见带语音条的动态

intent:
  action: 点击语音动态中的语音条播放按钮
  expected:
    - 语音开始播放
    - 播放按钮图标变为暂停图标
    - 波形区域有播放进度动画流动

timeoutMs: 120000

