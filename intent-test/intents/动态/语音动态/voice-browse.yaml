id: IT-MOM-VOICE-PUB-040
name: 详情页语音条暂停再继续
module: 语音动态-浏览
platform: android
priority: P1
tags: [动态, 语音, 详情页, 暂停继续]
preconditions: 存在带语音条的动态

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
  steps:
    - act: 进入带语音条的动态详情页
    - waitFor: 可见语音条
    - act: 点击播放
    - waitFor: 语音播放中

intent:
  action: 点击暂停后再次点击继续播放
  expected:
    - 暂停后可再次继续播放
    - 播放/暂停状态切换正常

timeoutMs: 120000

