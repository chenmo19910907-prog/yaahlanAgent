id: IT-MOM-VOICE-PUB-001
name: 点击 Add Voice 打开录制弹窗
module: 语音动态-录制弹窗
platform: android
priority: P0
tags: [动态, 语音, 录制, 入口]

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
    - moments-navigation/open_moment_publish_editor

intent:
  action: 点击编辑页中的 "+ Add Voice" 按钮
  expected:
    - 从底部弹出半屏 Record 录制弹窗，弹窗标题为 "Record"
    - 弹窗中央可见大圆形紫色渐变按钮，按钮内有白色麦克风图标
    - 按钮下方显示 "Tap to Record" 文字提示
    - 弹窗左上角可见 "<" 返回箭头按钮

timeoutMs: 120000

---
id: IT-MOM-VOICE-PUB-002
name: 点击录制按钮开始录制
module: 语音动态-录制弹窗
platform: android
priority: P0
tags: [动态, 语音, 录制, 计时]

setup:
  launchApp: true
  skipPopupDismiss: true
  include:
    - moments-navigation/enter_moment_discover_tab
    - moments-navigation/open_moment_publish_editor
  steps:
    - act: 点击 "+ Add Voice" 按钮
    - waitFor: 出现底部 Record 弹窗，可见紫色圆形按钮和 "Tap to Record" 文字
    - tap: [0.50, 0.785]
      afterSleep: 4000

intent:
  action: 观察当前录制中的界面状态
  expected:
    - 界面可见 "Tap to Stop Recording" 文字
    - 可见录制计时数字（如 "0:04" 或类似时间格式）

timeoutMs: 180000

