module: 语音动态-录制弹窗
platform: android
priority: P0
tags: [动态, 语音, 录制, 暂停]

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
    - moments-navigation/open_moment_publish_editor
  steps:
    - act: 点击语音条录制按钮入口
    - waitFor: 出现底部录制弹窗，可见大圆形录制按钮
    - act: 点击录制按钮开始录制
