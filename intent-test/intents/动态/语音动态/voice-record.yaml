id: IT-MOM-VOICE-PUB-001
name: 点击录制按钮打开录制弹窗
module: 语音动态-录制弹窗
platform: android
priority: P0
tags: [动态, 语音, 录制, 入口]

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
    - moments-navigation/open_moment_publish_editor

intent:
  action: 点击编辑页中的语音条录制按钮入口
  expected:
    - 弹出底部半屏录制弹窗
    - 弹窗中央可见大圆形紫色录制按钮
    - 弹窗左上角可见返回/关闭按钮

timeoutMs: 120000

