# 语音条动态 · PRD: 支持发布带语音条的动态（Yaahlan-2.5.7）
# 对照: documents/moments/basic module.md
# 排除: 屏幕适配、多语言/RTL、纯后端逻辑、安装/升级路径
# 真机 UI 基准: 2026-07-21 截图校准（英文 UI）
# 自动调试: 见 .cursor/skills/intent-test/SKILL.md §自动调试模式
# 录制时长: 通过 sleep 精确控制；弹窗内按钮用 ADB 坐标，"+ Add Voice" 用 AI

