# 语音动态 · 动态发布
# 模块对照: documents/moments/basic module.md §3 动态发布
# 语音录制参照: video.md 选片/预览流程，改为「录音入口 + 语音条预览」

id: IT-MOM-VOICE-PUB-001
name: 发布入口进入动态编辑页
module: 语音动态-发布
platform: android
priority: P0
tags: [动态, 语音动态, 发布, 入口]

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
    - moments-navigation/open_moment_publish_editor

aiContext: >
  发布入口：动态帧右上角 +。编辑页应有占位文案、软键盘或输入区、添加图片/语音入口。
  参照 basic module §3 入口与编辑页默认文案。

intent:
  action: 确认已进入动态发布编辑页
  expected:
    - 可见文字输入区或发布占位文案
    - 可见添加媒体或语音的入口按钮
    - 右上角发布按钮存在（可能置灰）

timeoutMs: 120000

---
id: IT-MOM-VOICE-PUB-002
name: 无内容时发布按钮不可点
module: 语音动态-发布
platform: android
priority: P1
tags: [动态, 语音动态, 发布, 校验]

setup:
  launchApp: false
  include:
    - moments-navigation/enter_moment_discover_tab
    - moments-navigation/open_moment_publish_editor

intent:
  action: 不输入文字、不录制语音，尝试点击右上角发布按钮
  expected:
    - 发布按钮为置灰或点击无反应
    - 仍停留在发布编辑页

timeoutMs: 90000

---
id: IT-MOM-VOICE-PUB-003
name: 录制语音后发布按钮可点击
module: 语音动态-发布
platform: android
priority: P0
tags: [动态, 语音动态, 发布, 录音]

setup:
  launchApp: false
  include:
    - moments-navigation/enter_moment_discover_tab
    - moments-navigation/open_moment_publish_editor

aiContext: >
  点击麦克风/语音入口，录制 3～10 秒语音后停止。编辑页应出现语音条预览及时长。
  若弹出麦克风权限，点允许。参照 video.md「选取后编辑页展示预览」。

intent:
  action: 录制一段语音（约 3～10 秒）并停止，使编辑页出现语音预览条
  expected:
    - 编辑页展示语音预览条或时长标识
    - 右上角发布按钮变为可点击状态（非置灰）

timeoutMs: 180000

---
id: IT-MOM-VOICE-PUB-004
name: 纯语音动态发布成功
module: 语音动态-发布
platform: android
priority: P0
tags: [动态, 语音动态, 发布, 成功]

preconditions:
  - 账号可正常发布动态；网络可用

setup:
  launchApp: false
  include:
    - moments-navigation/enter_moment_discover_tab
    - moments-navigation/open_moment_publish_editor
  steps:
    - act: 点击语音/麦克风入口，录制约 5 秒语音并停止，确认编辑页出现语音预览条
    - waitFor: 编辑页已展示语音预览，发布按钮可点击

intent:
  action: 点击右上角发布按钮提交纯语音动态
  expected:
    - 出现发布成功 toast 或发布中 loading 后成功提示
    - 跳转至个人动态页或返回列表且可见刚发布的语音动态

timeoutMs: 240000

---
id: IT-MOM-VOICE-PUB-005
name: 图文与语音不可混选（若产品限制）
module: 语音动态-发布
platform: android
priority: P2
tags: [动态, 语音动态, 发布, 互斥]

aiContext: >
  参照 video.md「不可以同时选择照片和视频」。若语音动态与图片互斥，
  已选图片后再点语音应 toast 提示；若产品允许图文+语音则本用例跳过。

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
    - moments-navigation/open_moment_publish_editor
  steps:
    - act: 点击添加图片入口，从相册选择 1 张照片并确认回到编辑页
    - waitFor: 编辑页已展示所选图片缩略图

intent:
  action: 在已添加图片的情况下点击语音/麦克风入口尝试录制
  expected:
    - 出现不可同时选择图片与语音的 toast 提示，或语音入口置灰不可点
    - 编辑页仍保留已选图片

timeoutMs: 180000

---
id: IT-MOM-VOICE-PUB-006
name: 删除已录语音可重新录制
module: 语音动态-发布
platform: android
priority: P1
tags: [动态, 语音动态, 发布, 删除]

setup:
  launchApp: false
  include:
    - moments-navigation/enter_moment_discover_tab
    - moments-navigation/open_moment_publish_editor
  steps:
    - act: 录制约 5 秒语音并停止
    - waitFor: 编辑页展示语音预览条

intent:
  action: 点击语音预览条上的删除或 X 按钮移除语音
  expected:
    - 语音预览条消失，重新出现添加语音/麦克风入口
    - 若无文字内容，发布按钮恢复置灰

timeoutMs: 150000
