id: IT-MOM-VOICE-DET-002
name: 详情页播放与暂停语音
module: 语音动态-详情页
platform: android
priority: P0
tags: [动态, 语音动态, 详情, 播放]

setup:
  launchApp: false
  include:
    - moments-navigation/reset_moment_discover_ready
  steps:
    - act: 进入任意一条语音动态详情页
    - waitFor: 详情页语音播放区域可见

intent:
  action: 点击播放开始播放语音，再次点击暂停
  expected:
    - 第一次点击后语音开始播放
    - 第二次点击后语音暂停

timeoutMs: 120000

