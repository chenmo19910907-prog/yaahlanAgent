# 语音动态 · 动态详情页与互动
# 模块对照: documents/moments/basic module.md §2 动态详情页（语音区域/点赞/评论）

id: IT-MOM-VOICE-DET-001
name: 详情页展示语音播放器
module: 语音动态-详情页
platform: android
priority: P0
tags: [动态, 语音动态, 详情, 展示]

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
  steps:
    - act: 在 Discover 列表点击一条语音动态进入详情页（避开播放按钮，点卡片其他区域）
    - waitFor: 已进入动态详情页

aiContext: >
  详情页应展示完整语音播放器（播放按钮、时长、进度条或波形）。
  参照 video.md 详情页播放控件；语音无全屏视频画面。

intent:
  action: 查看详情页内语音播放区域
  expected:
    - 详情页展示语音播放控件
    - 展示语音总时长或当前进度信息

timeoutMs: 120000

