---
id: IT-MOM-VOICE-DET-006
name: 主态删除语音动态
module: 语音动态-详情页
platform: android
priority: P1
tags: [动态, 语音动态, 详情, 删除]

preconditions:
  - 当前登录账号有一条可删除的语音动态（主态）

setup:
  launchApp: false
  include:
    - moments-navigation/reset_moment_discover_ready
  steps:
    - act: 进入自己发布的一条语音动态详情页
    - waitFor: 详情页右上角更多按钮可见

aiContext: >
  主态 ... 菜单含删除。二次确认文案参照 basic module：
  「删除动态后，点赞、评论等互动数据也将一起清空，确认删除吗？」

intent:
  action: 点击右上角 ... 更多，选择删除并在二次确认弹窗点确定
  expected:
    - 该动态从详情页消失或返回上一页
    - 列表中不再展示该条语音动态

timeoutMs: 180000
