---
id: IT-MOM-VOICE-LIST-006
name: 发现与关注tab切换不刷新列表
module: 语音动态-列表页
platform: android
priority: P2
tags: [动态, 语音动态, 列表, tab]

setup:
  launchApp: false
  include:
    - moments-navigation/enter_moment_discover_tab
  steps:
    - act: 记住当前 Discover 列表第一条动态的大致内容
    - act: 点击 Follow 关注 tab 再点回 Discover 发现 tab

intent:
  action: 对比切回 Discover 后列表首条是否与切换前一致（未整页刷新丢失位置）
  expected:
    - 仍停留在 Discover tab
    - 列表内容与切换前基本一致，未出现异常空白

timeoutMs: 120000
