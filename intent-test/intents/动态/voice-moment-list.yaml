# 语音动态 · 动态列表页（Discover）
# 模块对照: documents/moments/basic module.md §1 动态列表页
# 语音能力参照: documents/moments/video.md 列表播放（播放键/时长/点击播放）

id: IT-MOM-VOICE-LIST-001
name: 动态帧入口默认进入发现tab
module: 语音动态-列表页
platform: android
priority: P0
tags: [动态, 语音动态, 列表, 入口]

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab

aiContext: >
  Yaahlan 动态帧。底部 Moment tab 进入后默认 Discover 发现 tab 高亮。
  权限弹窗点允许；广告/活动弹窗关闭。

intent:
  action: 确认当前在 Discover 发现 tab，列表区域可见
  expected:
    - 顶栏 Discover tab 处于选中高亮状态
    - 动态列表或空态区域可见

timeoutMs: 120000

---
id: IT-MOM-VOICE-LIST-002
name: 发现列表语音动态展示播放控件
module: 语音动态-列表页
platform: android
priority: P0
tags: [动态, 语音动态, 列表, 展示]

preconditions:
  - Discover 列表中存在至少一条语音动态（非纯图文）

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab

aiContext: >
  语音动态卡片应区别于纯图文：可见播放按钮或波形条，并展示语音时长（如 0:15）。
  参照 video.md 列表「视频预览图上增加播放键」；语音动态无视频画面。

intent:
  action: 在 Discover 列表中找到一条语音动态并查看其语音区域
  expected:
    - 该动态卡片展示语音播放入口（播放按钮或波形区域）
    - 展示语音时长标识

timeoutMs: 120000

---
id: IT-MOM-VOICE-LIST-003
name: 列表点击播放语音动态
module: 语音动态-列表页
platform: android
priority: P0
tags: [动态, 语音动态, 列表, 播放]

setup:
  launchApp: false
  include:
    - moments-navigation/reset_moment_discover_ready

aiContext: >
  点击语音动态卡片的播放区域开始播放；参照 video.md「点击播放键进入播放」。
  若用户在语音房内小窗，可能 toast 拦截全屏，列表内播放应仍可用。

intent:
  action: 在 Discover 列表点击一条语音动态的播放按钮或语音条开始播放
  expected:
    - 语音开始播放（播放态图标变化或进度走动）
    - 仍停留在 Discover 列表页未跳转

timeoutMs: 120000

---
id: IT-MOM-VOICE-LIST-004
name: 列表播放中再次点击暂停
module: 语音动态-列表页
platform: android
priority: P1
tags: [动态, 语音动态, 列表, 播放]

setup:
  launchApp: false
  include:
    - moments-navigation/reset_moment_discover_ready
  steps:
    - act: 点击一条语音动态的播放按钮开始播放
    - waitFor: 语音处于播放中状态

intent:
  action: 再次点击该语音动态的播放控制区域
  expected:
    - 语音暂停播放
    - 仍停留在 Discover 列表页

timeoutMs: 120000

