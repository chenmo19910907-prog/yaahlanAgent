name: 点击语音动态卡片进入详情页
module: 语音动态-列表页
platform: android
priority: P0
tags: [动态, 语音动态, 列表, 详情入口]

setup:
  launchApp: false
  include:
    - moments-navigation/reset_moment_discover_ready

intent:
  action: 点击一条语音动态卡片的文字或用户信息区域（非播放按钮）进入详情
