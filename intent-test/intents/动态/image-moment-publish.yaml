id: IT-MOM-IMG-PUB-003
name: 图文动态发布成功
module: 图片动态-发布
platform: android
priority: P0
tags: [动态, 图片, 文字, 发布]

setup:
  launchApp: false
  include:
    - moments-navigation/enter_moment_discover_tab
    - moments-navigation/open_moment_publish_editor
  steps:
    - act: 输入简短文字并从相册选择 1 张图片确认回到编辑页
    - waitFor: 编辑页同时展示文字与图片缩略图

intent:
  action: 点击发布提交图文动态
  expected:
    - 发布成功 toast 或等价成功反馈
    - 发布后可见同时含文字与图片的动态

timeoutMs: 240000

