id: IT-MOM-IMG-PUB-005
name: 相册多选最多九张提示
module: 图片动态-发布
platform: android
priority: P2
tags: [动态, 图片, 发布, 上限]

aiContext: >
  basic module：最多 9 张图，超过 toast「最多选择9张图」。若相册不便一次选 10 张可跳过。

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
    - moments-navigation/open_moment_publish_editor

intent:
  action: 进入相册尝试勾选超过 9 张图片（或连续添加至第 10 张）
  expected:
    - 出现最多选择 9 张图相关 toast 提示，或第 10 张无法选中

timeoutMs: 180000
