# 纯图片 / 图文 · 动态发布
# 对照: documents/moments/basic module.md §3 图片选择、上传、发布成功

id: IT-MOM-IMG-PUB-001
name: 选择单张图片后发布按钮可点
module: 图片动态-发布
platform: android
priority: P0
tags: [动态, 图片, 发布, 选图]

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
    - moments-navigation/open_moment_publish_editor

aiContext: >
  点击 + 或相册入口，从相册选择 1 张图片并确认回到编辑页。
  若弹出相册/存储权限，点允许。

intent:
  action: 从相册选择 1 张图片并确认回到编辑页
  expected:
    - 编辑页展示所选图片缩略图
    - 右上角发布按钮变为可点击（非置灰）

timeoutMs: 180000

---
id: IT-MOM-IMG-PUB-002
name: 纯图片动态发布成功
module: 图片动态-发布
platform: android
priority: P0
tags: [动态, 图片, 发布, 成功]

setup:
  launchApp: false
  include:
    - moments-navigation/enter_moment_discover_tab
    - moments-navigation/open_moment_publish_editor
  steps:
    - act: 从相册选择 1 张图片并确认回到编辑页
    - waitFor: 编辑页已展示图片缩略图，发布按钮可点击

intent:
  action: 不输入文字，直接点击发布提交纯图片动态
  expected:
    - 出现发布成功 toast 或 loading 后成功提示
    - 跳转个人动态页或列表可见刚发布的图片动态

timeoutMs: 240000

