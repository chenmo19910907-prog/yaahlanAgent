# 转发动态 · PRD: Yaahlan-2.5.8 原帖删除/不可见特殊展示
# UI 基准: "This moment has been changed to Friends Only or has been deleted" 嵌套占位
# 排除: 权限变更实时推送（需造数）、屏幕适配、多语言

# ╔═══════════════════════════════════════════════════════════╗
# ║  模块 6：异常态 — 原帖不可见占位 → 详情一致 → 仍可互动   ║
# ╚═══════════════════════════════════════════════════════════╝

id: IT-MOM-REPOST-043
name: Feed 原帖不可见嵌套区展示占位文案
module: 转发动态-异常态
platform: android
priority: P0
tags: [动态, 转发, 不可见, Feed]
preconditions: 存在原帖已删除或不可见的转发帖（MOA 造数 7063843_100261858）

setup:
  launchApp: true
  include:
    - repost-navigation/enter_my_moments_from_me_tab
    - repost-navigation/find_unavailable_repost_in_discover

intent:
  action: 观察已找到的原帖不可见转发帖嵌套卡片区域
  expected:
    - 嵌套卡片区域展示 "This moment has been changed to Friends Only or has been deleted" 文案

timeoutMs: 180000

