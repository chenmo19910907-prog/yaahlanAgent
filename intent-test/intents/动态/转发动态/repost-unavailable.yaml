  launchApp: true
  include:
    - repost-navigation/enter_my_moments_from_me_tab
    - repost-navigation/find_unavailable_repost_in_discover
    - repost-navigation/open_unavailable_repost_detail

intent:
  action: 确认已进入转发帖详情页并观察互动区域
  expected:
    - 已进入单条动态详情页（Moments details 或可见 Comment 区域）
    - 详情页嵌套区展示 "This moment has been changed to Friends Only or has been deleted"

timeoutMs: 180000

---
id: IT-MOM-REPOST-047
name: Discover 列表可见不可见态转发帖样例
module: 转发动态-异常态
platform: android
priority: P1
tags: [动态, 转发, 不可见, 展示]
preconditions: 测试环境 Feed 已存在不可见原帖的转发帖

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
  steps:
    - waitFor: Discover 列表已加载

intent:
  action: 在 Discover 列表中查找不可见原帖的转发帖样例
  expected:
    - Discover 列表正常加载，可见动态卡片
    - 若存在带 Reposted 标签且嵌套区含 "Friends Only or has been deleted" 的转发帖，占位文案正确展示
    - 若暂无此类数据，列表浏览正常无崩溃

timeoutMs: 180000
