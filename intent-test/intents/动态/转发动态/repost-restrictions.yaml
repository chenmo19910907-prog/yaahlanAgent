id: IT-MOM-REPOST-040
name: 自己动态分享不支持转发
module: 转发动态-限制
platform: android
priority: P0
tags: [动态, 转发, 自己动态, 限制]
preconditions: 测试账号个人主页存在自己发布的动态

setup:
  launchApp: true
  include:
    - repost-navigation/enter_my_moments_from_me_tab
  steps:
    - act: 点击自己发布的一条普通动态进入详情或打开分享菜单

intent:
  action: 尝试点击 Repost this moment 或观察分享面板是否展示 Repost 按钮
  expected:
    - 自己动态分享面板无紫色 "Repost this moment" 按钮，或点击后出现不可转发 toast
    - 当前页面为分享面板或动态详情页，不是转发编辑页

timeoutMs: 120000

