id: IT-MOM-REPOST-041
name: 二次转发限制后其他分享方式仍可用
module: 转发动态-限制
platform: android
priority: P1
tags: [动态, 转发, 分享, 共存]
preconditions: Discover 存在 Forward 转发帖

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
    - repost-navigation/open_forward_post_share_menu

intent:
  action: 观察 Repost 不可用后面板其他分享入口
  expected:
    - 面板仍展示 Whatsapp、Facebook、Copy link 外部分享入口
    - 面板仍展示站内 Share 联系人列表及 "share" 按钮
    - 其他分享方式布局正常可用

timeoutMs: 120000

---
id: IT-MOM-REPOST-042
name: 转发帖详情二次转发后仍不可转发
module: 转发动态-限制
platform: android
priority: P1
tags: [动态, 转发, 二次转发, 回归]
preconditions: 已存在被转发过的原帖及对应转发帖

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
  steps:
    - act: 对一条 Forward 转发帖打开 Share or repost，点击 Repost 触发 toast
    - waitFor: 出现不可二次转发 toast

intent:
  action: 关闭分享面板后再次打开同一转发帖分享菜单，再次点击 Repost
  expected:
    - 仍出现不可二次转发 toast
    - 始终无法进入转发编辑页

timeoutMs: 120000
