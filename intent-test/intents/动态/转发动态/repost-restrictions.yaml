id: IT-MOM-REPOST-037
name: 转发帖不可二次转发 toast 提示
module: 转发动态-限制
platform: android
priority: P0
tags: [动态, 转发, 二次转发, 限制]
preconditions: Discover 存在带 Forward 标签的转发帖

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
    - repost-navigation/open_forward_post_share_menu

intent:
  action: 点击 "Repost this moment" 按钮尝试二次转发
  expected:
    - 出现 toast 提示不可二次转发（含 repost 或 forward 相关英文提示）
    - 仍停留在 Share or repost 分享面板，不是转发编辑页

timeoutMs: 120000

