# 转发动态 · PRD: Yaahlan-2.5.8 转发他人动态
# UI 基准: Share or repost 半屏弹窗（2026-07-23 设计稿）
# 排除: 屏幕适配、多语言/RTL、后台开关、站外分享、安装/升级路径、老版本回归
# 已评估: 与神秘人逻辑无关

# ╔═══════════════════════════════════════════════════════════╗
# ║  模块 1：分享入口 — 面板展示 → Repost 跳转 → 关闭/限制   ║
# ╚═══════════════════════════════════════════════════════════╝

id: IT-MOM-REPOST-001
name: 他人动态点击分享打开 Share or repost 面板
module: 转发动态-分享入口
platform: android
priority: P0
tags: [动态, 转发, 分享, 入口]
preconditions: Discover 页存在他人发布的普通动态（非 Forward 帖）

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
  steps:
    - waitFor: Discover 动态列表已加载，可见至少一条带操作栏的他人动态
    - act: 在 Discover 列表中找到一条他人发布的普通动态（非 Forward 转发帖），点击该动态操作栏中的 curved arrow 分享图标
    - waitFor: 从底部弹出半屏分享面板，标题为 "Share or repost"

intent:
  action: 观察当前分享面板
  expected:
    - 半屏分享面板仍处于打开状态
    - 面板标题为 "Share or repost"
    - 面板顶部可见紫色按钮 "Repost this moment"

timeoutMs: 120000

