module: 转发动态-分享入口
platform: android
priority: P1
tags: [动态, 转发, 分享, 外部分享]

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
    - repost-navigation/open_others_moment_share_menu

intent:
  action: 观察 Repost this moment 按钮下方的外部分享区域
  expected:
