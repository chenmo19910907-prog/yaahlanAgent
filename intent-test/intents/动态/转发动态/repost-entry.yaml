id: IT-MOM-REPOST-008
name: 分享面板展示站内 Share 联系人列表
module: 转发动态-分享入口
platform: android
priority: P1
tags: [动态, 转发, 分享, 站内分享]

setup:
  launchApp: true
  skipPopupDismiss: true
  include:
    - repost-navigation/dismiss_blocking_popup
    - moments-navigation/enter_moment_discover_tab
    - repost-navigation/open_others_moment_share_menu
  steps:
    - act: 若 Share 联系人列表未完全可见，向下滑动分享面板一次

intent:
  action: 观察分享面板站内 Share 区域
  expected:
    - 可见 "Share" 分区标题
    - 联系人列表中可见 share 按钮
    - Repost this moment 按钮仍可见

timeoutMs: 180000
