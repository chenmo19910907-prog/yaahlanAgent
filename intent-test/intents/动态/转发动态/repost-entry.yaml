id: IT-MOM-REPOST-002
name: 分享面板展示 Repost this moment 主按钮
module: 转发动态-分享入口
platform: android
priority: P0
tags: [动态, 转发, 分享, 主按钮]

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
    - repost-navigation/open_others_moment_share_menu

intent:
  action: 观察分享面板顶部主操作区域
  expected:
    - 面板顶部可见紫色全宽按钮 "Repost this moment"
    - 按钮文案完整可读，未被其他元素遮挡

timeoutMs: 120000

