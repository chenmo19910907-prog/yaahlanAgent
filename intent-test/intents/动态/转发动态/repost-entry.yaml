id: IT-MOM-REPOST-004
name: 点击 Repost this moment 进入转发编辑页
module: 转发动态-分享入口
platform: android
priority: P0
tags: [动态, 转发, 编辑页, 入口]

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
    - repost-navigation/open_others_moment_share_menu
    - repost-navigation/open_repost_editor_from_share

