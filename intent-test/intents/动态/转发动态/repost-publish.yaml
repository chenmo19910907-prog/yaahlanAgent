id: IT-MOM-REPOST-021
name: 纯转发发布成功
module: 转发动态-发布
platform: android
priority: P0
tags: [动态, 转发, 发布, 纯转发]

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
    - repost-navigation/open_others_moment_share_menu
    - repost-navigation/open_repost_editor_from_share

intent:
  action: 不追加任何内容，点击右上角 "Post" 按钮发布
  expected:
    - 发布流程正常完成
    - 出现发布成功提示或自动跳转离开编辑页

verify:
  include:
    - repost-verify/verify_repost_publish_success
    - repost-verify/verify_forward_label_in_discover

timeoutMs: 300000

