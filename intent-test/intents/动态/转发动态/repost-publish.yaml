id: IT-MOM-REPOST-028
name: 转发帖嵌套区不展示原帖皮肤
module: 转发动态-发布
platform: android
priority: P1
tags: [动态, 转发, 皮肤, 嵌套]
preconditions: 被转发原帖使用了皮肤，且已被他人转发

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
  steps:
    - act: 在 Discover 列表滑动查找带 Forward 标签的转发帖

intent:
  action: 观察转发帖嵌套区域样式
  expected:
    - 嵌套卡片内容（文字/图片/语音）正常可见
    - 嵌套卡片为简洁卡片样式，重点展示原帖内容
    - 外层转发帖可使用转发者自己选择的皮肤

timeoutMs: 120000
