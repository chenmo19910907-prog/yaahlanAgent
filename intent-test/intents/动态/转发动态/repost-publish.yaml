---
id: IT-MOM-REPOST-025
name: 发布后 Discover 展示 Forward 标签
module: 转发动态-发布
platform: android
priority: P0
tags: [动态, 转发, 发现页, 展示]
preconditions: 测试账号刚发布一条转发帖

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
  steps:
    - waitFor: Discover 列表已加载
    - act: 在 Discover 列表中向上或向下滑动，找到一条带 "Forward" 标签的转发帖

intent:
  action: 观察找到的转发帖卡片结构
  expected:
    - 转发帖可见 "Forward" 标签
    - 外层展示转发发布者昵称
    - 嵌套区域内可见被转发动态卡片，底部有 "Moment" 字样

timeoutMs: 120000

---
id: IT-MOM-REPOST-026
name: 发布后嵌套卡片展示原帖内容
module: 转发动态-发布
platform: android
priority: P0
tags: [动态, 转发, 发现页, 嵌套卡片]
preconditions: Discover 存在带文字/图片/语音的转发帖

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
  steps:
    - waitFor: 列表中存在带 "Forward" 标签的转发帖

intent:
  action: 观察转发帖嵌套卡片内的原帖内容展示
  expected:
    - 嵌套卡片内可见原作者 @昵称 或昵称信息
    - 嵌套卡片内可见原帖文字、语音条时长、图片或视频封面中的至少一种内容
    - 嵌套卡片区域完整展示，未被截断为空白

timeoutMs: 120000

---
id: IT-MOM-REPOST-027
name: 无转发文案时仍展示嵌套卡片
module: 转发动态-发布
platform: android
priority: P1
tags: [动态, 转发, 纯转发, 展示]
preconditions: 存在未追加文字的纯转发帖

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
  steps:
    - act: 在 Discover 列表中多次滑动，找到一条带 Forward 标签或嵌套转发卡片的转发帖

intent:
  action: 观察转发帖展示
  expected:
    - 可见嵌套的被转发动态卡片区域
    - 嵌套卡片内可见原帖内容（文字、图片或语音）
    - 转发帖卡片结构完整，页面正常展示

timeoutMs: 120000

