---
id: IT-MOM-REPOST-023
name: 语音加转发发布成功
module: 转发动态-发布
platform: android
priority: P0
tags: [动态, 转发, 发布, 语音]
preconditions: 麦克风权限已授予

setup:
  launchApp: true
  skipPopupDismiss: true
  include:
    - moments-navigation/enter_moment_discover_tab
    - repost-navigation/open_others_moment_share_menu
    - repost-navigation/open_repost_editor_from_share
  steps:
    - act: 点击 "+ Add Voice message" 按钮
    - waitFor: 出现底部 Record 弹窗，可见紫色圆形录制按钮
    - tap: [0.50, 0.785]
      afterSleep: 500
    - sleep: 3000
    - tap: [0.50, 0.785]
      afterSleep: 2000
    - tap: [0.731, 0.861]
      afterSleep: 2000
    - waitFor: 编辑页可见语音条胶囊

intent:
  action: 点击右上角 "Post" 按钮发布
  expected:
    - 发布成功，离开编辑页

verify:
  include:
    - repost-verify/verify_repost_publish_success

timeoutMs: 300000

