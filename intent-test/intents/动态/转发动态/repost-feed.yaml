module: 转发动态-Feed跳转
platform: android
priority: P1
tags: [动态, 转发, 关注页, 展示]
preconditions: Following 页存在转发帖

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
    - moments-navigation/enter_moment_follow_tab
  steps:
    - waitFor: Following 关注 tab 动态列表已加载

intent:
  action: 在 Following 列表中找到转发帖并观察
  expected:
    - 转发帖可见 "Forward" 标签
    - 嵌套卡片正常展示被转发动态内容
    - 卡片结构与 Discover 页一致

timeoutMs: 120000

