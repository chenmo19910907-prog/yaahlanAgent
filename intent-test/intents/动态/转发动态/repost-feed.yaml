id: IT-MOM-REPOST-036
name: 转发帖外层展示热度标签
module: 转发动态-Feed跳转
platform: android
priority: P2
tags: [动态, 转发, 热度, 展示]
preconditions: 被转发原帖为高热度动态（含 Hot 或 NO.1 标签）

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
  steps:
    - act: 在 Discover 列表滑动查找带 Forward 标签的转发帖

intent:
  action: 观察转发帖外层热度标签展示
  expected:
    - 若被转发原帖带 Hot 或 NO.1 标签，转发帖外层可见该热度标签
    - 嵌套卡片内重点展示原帖内容
    - 转发帖卡片结构完整可见

timeoutMs: 120000
