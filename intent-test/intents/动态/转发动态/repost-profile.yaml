id: IT-MOM-REPOST-052
name: 点击纯转发缩略图进入转发帖详情
module: 转发动态-个人主页
platform: android
priority: P1
tags: [动态, 转发, 个人主页, 跳转]
preconditions: 个人主页存在纯转发帖缩略图

setup:
  launchApp: true
  include:
    - repost-navigation/enter_my_moments_from_me_tab

intent:
  action: 点击纯转发帖缩略图
  expected:
    - 进入该转发帖 "Moments details" 详情页
    - 详情页可见 "Forward" 标签和嵌套卡片
    - 页面正常加载无崩溃

timeoutMs: 120000
