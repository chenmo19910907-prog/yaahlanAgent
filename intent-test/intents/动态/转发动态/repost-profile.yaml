id: IT-MOM-REPOST-050
name: 带语音转发帖缩略图正常展示
module: 转发动态-个人主页
platform: android
priority: P0
tags: [动态, 转发, 个人主页, 语音]
preconditions: 个人主页存在带语音条的转发帖

setup:
  launchApp: true
  include:
    - repost-navigation/enter_my_moments_from_me_tab

intent:
  action: 找到带语音条的转发帖缩略图
  expected:
    - 缩略图展示语音条或语音相关视觉元素
    - 缩略图主视觉为语音内容而非纯转发图标
    - 缩略图可正常展示在动态网格中

