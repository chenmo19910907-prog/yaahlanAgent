id: IT-MOM-REPOST-051
name: 仅话题标签转发帖缩略图展示转发图标
module: 转发动态-个人主页
platform: android
priority: P1
tags: [动态, 转发, 个人主页, 话题]
preconditions: 个人主页存在仅添加话题、无文案无语音的转发帖

setup:
  launchApp: true
  include:
    - repost-navigation/enter_my_moments_from_me_tab

intent:
  action: 找到仅含话题标签、无正文无语音的转发帖缩略图
  expected:
    - 缩略图内展示转发动态专用图标
    - 缩略图不展示话题标签文字作为主视觉

timeoutMs: 120000

