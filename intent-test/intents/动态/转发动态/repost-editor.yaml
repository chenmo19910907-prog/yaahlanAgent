---
id: IT-MOM-REPOST-012
name: 转发编辑页添加语音条
module: 转发动态-编辑页
platform: android
priority: P0
tags: [动态, 转发, 编辑页, 语音]
preconditions: 麦克风权限已授予

setup:
  launchApp: true
  skipPopupDismiss: true
  include:
    - moments-navigation/enter_moment_discover_tab
    - repost-navigation/open_others_moment_share_menu
    - repost-navigation/open_repost_editor_from_share
  steps:
    - act: 点击 "+ Add Voice message" 按钮
    - waitFor: 出现底部 Record 弹窗，可见紫色圆形录制按钮
    - tap: [0.50, 0.785]
      afterSleep: 500
    - sleep: 3000
    - tap: [0.50, 0.785]
      afterSleep: 2000
    - tap: [0.731, 0.861]
      afterSleep: 2000
    - waitFor: 返回转发编辑页，可见语音条胶囊

intent:
  action: 观察编辑页语音条展示
  expected:
    - 文字输入区下方可见语音条胶囊，显示时长（如 "3s" 或 "5s"）
    - 转发卡片预览仍正常展示，未被语音条遮挡
    - 右上角 "Post" 按钮仍高亮可点击

timeoutMs: 180000

