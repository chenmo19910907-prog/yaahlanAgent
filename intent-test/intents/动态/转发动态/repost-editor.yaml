# 转发动态 · PRD: Yaahlan-2.5.8 转发编辑页
# UI 基准: 转发编辑页设计稿（X / Post / 转发卡片 / + Add Voice message）
# 排除: 屏幕适配、多语言/RTL、@提及/表情细节回归、安装/升级路径

# ╔═══════════════════════════════════════════════════════════╗
# ║  模块 2：转发编辑页 — 卡片展示 → 编辑能力 → 纯转发发布  ║
# ╚═══════════════════════════════════════════════════════════╝

id: IT-MOM-REPOST-009
name: 纯转发编辑页展示转发卡片与 Post 按钮
module: 转发动态-编辑页
platform: android
priority: P0
tags: [动态, 转发, 编辑页, 展示]

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
    - repost-navigation/open_others_moment_share_menu
    - repost-navigation/open_repost_editor_from_share

intent:
  action: 观察转发编辑页整体布局（未输入任何附加内容）
  expected:
    - 左上角可见 X 关闭按钮
    - 右上角可见紫色 "Post" 按钮，处于高亮可点击状态
    - 原图片/视频上传区已被转发卡片预览替代
    - 转发卡片底部可见 "Moment" 字样
    - 转发卡片右侧可见原作者昵称

timeoutMs: 120000

