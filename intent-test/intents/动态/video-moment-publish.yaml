id: IT-MOM-VID-PUB-004
name: 纯视频动态发布成功
module: 视频动态-发布
platform: android
priority: P0
tags: [动态, 视频, 发布, 成功]

preconditions:
  - 相册有 2 秒～1 分钟合规视频

setup:
  launchApp: false
  include:
    - moments-navigation/enter_moment_discover_tab
    - moments-navigation/open_moment_publish_editor
  steps:
    - act: 选取一条合规视频确认回到编辑页
    - waitFor: 编辑页展示视频预览，发布按钮可点击

intent:
  action: 点击发布提交纯视频动态
  expected:
    - 发布成功 toast 或 loading 后成功提示
    - 跳转个人动态页或列表可见刚发布的视频动态（含播放键）

timeoutMs: 300000

