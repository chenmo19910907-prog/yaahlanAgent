---
id: IT-MOM-VID-PUB-002
name: 选取视频后编辑页展示预览与时长
module: 视频动态-发布
platform: android
priority: P0
tags: [动态, 视频, 发布, 预览]

aiContext: >
  相册中选择 2 秒～1 分钟内的视频，预览页点确认回到编辑页。
  video.md：预览图右下角展示时长，与所选一致；选取后不再展示上传 + 按钮。

setup:
  launchApp: false
  include:
    - moments-navigation/enter_moment_discover_tab
    - moments-navigation/open_moment_publish_editor
  steps:
    - act: 点击 + 选相册，选择一条合规时长视频进入预览并点确认
    - waitFor: 回到动态编辑页

intent:
  action: 查看编辑页视频预览区域
  expected:
    - 展示视频预览图，右下角或附近有时长标识
    - 上传 + 按钮已隐藏或不可再添加互斥媒体

timeoutMs: 240000

---
id: IT-MOM-VID-PUB-003
name: 已选照片不可再选视频
module: 视频动态-发布
platform: android
priority: P0
tags: [动态, 视频, 发布, 互斥]

aiContext: >
  video.md：先选照片再选视频 toast「不可以同时选择照片和视频」；Android 视频可能置灰。

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab
    - moments-navigation/open_moment_publish_editor
  steps:
    - act: 从相册选择 1 张照片并确认回到编辑页
    - waitFor: 编辑页已展示图片缩略图

intent:
  action: 再次点击 + 进入相册尝试选择视频
  expected:
    - 出现不可同时选择照片与视频的 toast，或视频项置灰不可选
    - 已选照片仍保留在编辑页

timeoutMs: 180000

