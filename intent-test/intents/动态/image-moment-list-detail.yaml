# 图片动态 · 列表展示与详情大图
# 对照: documents/moments/basic module.md §1/§2 动态图片区域

id: IT-MOM-IMG-LIST-001
name: 列表单图动态缩略图展示
module: 图片动态-列表页
platform: android
priority: P0
tags: [动态, 图片, 列表, 展示]

preconditions:
  - Discover 存在单图动态（可先跑 IT-MOM-IMG-PUB-002）

setup:
  launchApp: true
  include:
    - moments-navigation/enter_moment_discover_tab

intent:
  action: 在 Discover 找到一条单图动态
  expected:
    - 展示单张图片缩略图（约正方形）
    - 图片区域无视频播放键 overlay

timeoutMs: 120000

---
id: IT-MOM-IMG-LIST-002
name: 列表点击图片查看大图
module: 图片动态-列表页
platform: android
priority: P0
tags: [动态, 图片, 列表, 大图]

setup:
  launchApp: false
  include:
    - moments-navigation/reset_moment_discover_ready

intent:
  action: 在列表点击一条图片动态的图片区域
  expected:
    - 进入图片大图查看页
    - 大图页可见返回按钮

timeoutMs: 120000

---
id: IT-MOM-IMG-LIST-003
name: 大图页返回动态列表
module: 图片动态-列表页
platform: android
priority: P0
tags: [动态, 图片, 列表, 返回]

setup:
  launchApp: false
  include:
    - moments-navigation/reset_moment_discover_ready
  steps:
    - act: 在列表点击图片进入大图页
    - waitFor: 大图页可见返回按钮

intent:
  action: 点击大图页返回按钮
  expected:
    - 返回 Discover 动态列表页
    - 仍可见刚才那条图片动态

timeoutMs: 120000

---
id: IT-MOM-IMG-DET-001
name: 详情页图片区域展示
module: 图片动态-详情页
platform: android
priority: P0
tags: [动态, 图片, 详情, 展示]

setup:
  launchApp: false
  include:
    - moments-navigation/reset_moment_discover_ready
  steps:
    - act: 点击图文或纯图动态进入详情（非点图片大图入口）
    - waitFor: 已进入动态详情页

intent:
  action: 查看详情页图片区域
  expected:
    - 详情页展示与列表一致的图片缩略图
    - 点击图片可进入大图查看

timeoutMs: 120000

---
id: IT-MOM-IMG-DET-002
name: 详情页多图可左右滑动
module: 图片动态-详情页
platform: android
priority: P1
tags: [动态, 图片, 详情, 多图]

preconditions:
  - 存在含 2 张及以上图片的动态

setup:
  launchApp: false
  include:
    - moments-navigation/reset_moment_discover_ready
  steps:
    - act: 进入一条多图动态详情页，点击图片进入大图
    - waitFor: 大图页可见且可能有多图指示

intent:
  action: 在大图页左右滑动切换图片
  expected:
    - 可切换到另一张图片
    - 滑动后图片展示正常无黑屏

timeoutMs: 120000
