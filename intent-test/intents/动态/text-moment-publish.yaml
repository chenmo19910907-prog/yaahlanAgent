id: IT-MOM-TXT-PUB-004
name: 文字支持换行与emoji
module: 文字动态-发布
platform: android
priority: P1
tags: [动态, 文字, 发布, emoji]

setup:
  launchApp: false
  include:
    - moments-navigation/enter_moment_discover_tab
    - moments-navigation/open_moment_publish_editor

intent:
  action: 输入两行文字（中间换行）并附带一个 emoji，确认编辑页展示正常后点击发布
  expected:
    - 编辑页换行与 emoji 展示正常
    - 发布成功 toast 或等价成功反馈

timeoutMs: 240000
