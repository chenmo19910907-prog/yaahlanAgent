id: IT-SEED-GIFT-TUNNEL
name: 定制礼物 Tunnel 抓包种子
module: _seed
platform: android
priority: P0
tags: [seed, 礼物, tunnel]

# intent-run 跑定制礼物用例前自动执行：进指定房 → Customize → 周榜 + 搜索，供 preflight 写 TEST_CUSTOM_GIFT_*
setup:
  launchApp: true
  include:
    - base-navigation/enter_voice_room_by_room_id
    - base-navigation/open_gift_panel_customize_tab
    - gift-custom-search/seed_custom_gift_tunnel_capture

aiContext: >
  Yaahlan 测试环境。目标是触发 getTotalCustomGiftRankList 与 searchCustomGift 抓包，
  以便 preflight 写入真实 uid/昵称。搜索有结果或无结果均可，关键是完成 UI 操作。

intent:
  action: 保持当前礼物面板或搜索页可见，无需额外操作
  expected:
    - 仍在语音房内，礼物面板或定制礼物搜索相关页面可见

timeoutMs: 240000
tunnel: false
