; pytest配置文件，addopts为执行pytest命令时附带的参数
; 执行命令`pytest mod/test_mod1.py` 等同于 `pytest mod/test_mod1.py -rA  --capture=sys ...`
[pytest]
testpaths = business_case
pythonpath = .

; 执行的pytest默认参数。tee-sys: 执行过程中控制台也输出日志
addopts = -rA --capture=tee-sys --tb=short

; 限制test case发现范围
; 排除特定文件夹
norecursedirs = venv base tmp* report* virtEnv
; 测试case方法名称必须以test开头或结尾，且使用下划线_分隔
python_functions = *_test test_*
; 测试case文件名必须以test开头或结尾，且使用下划线_分隔
python_files = test_*.py *_test.py
;无需在命令行中加参数，每次运行测试时都会自动显示 DEBUG 级别的日志
log_cli = true
log_cli_level = DEBUG
python_classes = Test* *Tests *Suite
; https://docs.pytest.org/en/6.2.x/example/markers.html
; 仅执行线上case select: pytest -m online_test
; 不执行线上case deselected: pytest -m "not online_test"
markers =
    slow: marks tests as slow
    online_test: mark a test as a online.
    basic_test: mark a test as basic
    hook_test: mark a test as webhook
    guild_progress_old: 按 202512 旧进步奖口径（上周期薪资）
    guild_progress_new: 按 202608 新进步奖口径（近6周期最高薪资）
    confirm_salary: 按区域确认应得薪资（写操作，默认跳过，需 RUN_CONFIRM_BY_AREA=1）
